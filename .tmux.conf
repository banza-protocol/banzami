# Banzami — tmux config for the dev session.
# Loaded automatically by dev.sh via: tmux -f .tmux.conf new-session ...

# Mouse: click to select panes and windows, scroll with trackpad/wheel.
set -g mouse on

# Increase scrollback buffer.
set -g history-limit 10000

# Start window and pane numbering at 0 (matches dev.sh window indices).
set -g base-index 0
set -g pane-base-index 0

# Show window names in the status bar.
set -g status-style "bg=black,fg=white"
set -g window-status-current-style "bg=green,fg=black,bold"

# Slightly longer pane indicators display time.
set -g display-panes-time 2000
