<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/></filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="700" height="460" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="20" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="45" text-anchor="middle" fill="white" font-size="14" font-weight="700">Protocol Simulator — What-If Analysis</text>
  <text x="350" y="59" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">SIMULA MUDANÇAS ANTES DE IMPLEMENTAR · DELTA DE READINESS · IMPACTO DE CERTIFICAÇÃO</text>

  <!-- Current State (left) -->
  <rect x="30" y="82" width="200" height="180" rx="10" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="130" y="102" text-anchor="middle" fill="#64748B" font-size="9" font-weight="700" letter-spacing="0.8">ESTADO ACTUAL</text>
  <rect x="46" y="110" width="168" height="28" rx="6" fill="#F5F1EE" stroke="#E2D9D7" stroke-width="1"/>
  <text x="130" y="122" text-anchor="middle" fill="#64748B" font-size="8" font-weight="600">Manifesto JSON</text>
  <text x="130" y="133" text-anchor="middle" fill="#9CA3AF" font-size="7">operator_id · environment</text>
  <!-- Caps -->
  <text x="46" y="154" fill="#64748B" font-size="8" font-weight="600">Capacidades actuais</text>
  <rect x="46" y="160" width="78" height="14" rx="4" fill="#990011" opacity="0.15"/>
  <text x="85" y="170" text-anchor="middle" fill="#990011" font-size="7.5" font-weight="600">supports_wallets</text>
  <rect x="130" y="160" width="84" height="14" rx="4" fill="#990011" opacity="0.15"/>
  <text x="172" y="170" text-anchor="middle" fill="#990011" font-size="7.5" font-weight="600">supports_transfers</text>
  <rect x="46" y="178" width="62" height="14" rx="4" fill="#990011" opacity="0.15"/>
  <text x="77" y="188" text-anchor="middle" fill="#990011" font-size="7.5" font-weight="600">supports_qr</text>
  <!-- Level -->
  <text x="46" y="212" fill="#64748B" font-size="8" font-weight="600">Nível actual</text>
  <circle cx="140" cy="234" r="18" fill="#2A3A8C"/>
  <text x="140" y="239" text-anchor="middle" fill="white" font-size="16" font-weight="700">1</text>
  <text x="166" y="234" fill="#64748B" font-size="8">Level 1</text>
  <text x="166" y="244" fill="#9CA3AF" font-size="7">Protocol-compatible</text>

  <!-- Proposed changes (middle-left) -->
  <rect x="248" y="82" width="200" height="180" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="348" y="102" text-anchor="middle" fill="#166534" font-size="9" font-weight="700" letter-spacing="0.8">MUDANÇAS PROPOSTAS</text>
  <text x="258" y="120" fill="#166534" font-size="8" font-weight="600">Adicionar capacidades</text>
  <rect x="258" y="126" width="120" height="14" rx="4" fill="#15803D" opacity="0.15"/>
  <text x="275" y="136" fill="#15803D" font-size="7.5" font-weight="600">+ supports_traces</text>
  <rect x="258" y="144" width="120" height="14" rx="4" fill="#15803D" opacity="0.15"/>
  <text x="275" y="154" fill="#15803D" font-size="7.5" font-weight="600">+ supports_webhooks</text>
  <text x="258" y="176" fill="#166534" font-size="8" font-weight="600">Nível alvo</text>
  <circle cx="310" cy="208" r="16" fill="#0E7490"/>
  <text x="310" y="213" text-anchor="middle" fill="white" font-size="13" font-weight="700">2</text>
  <text x="332" y="207" fill="#0E7490" font-size="8" font-weight="600">Target: Level 2</text>
  <text x="332" y="218" fill="#9CA3AF" font-size="7">Trace-compatible</text>

  <!-- Arrows to engine -->
  <line x1="230" y1="172" x2="248" y2="172" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Simulator engine -->
  <rect x="30" y="280" width="418" height="50" rx="10" fill="#990011" filter="url(#sh)"/>
  <text x="239" y="303" text-anchor="middle" fill="white" font-size="12" font-weight="700">runSimulation() — Protocol Simulator Engine</text>
  <text x="239" y="319" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="8">analyzeCertificationReadiness(before) · apply_changes · analyzeCertificationReadiness(after)</text>

  <!-- Arrows from inputs to engine -->
  <line x1="130" y1="262" x2="130" y2="280" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="348" y1="262" x2="348" y2="280" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrows from engine to outputs -->
  <line x1="80" y1="330" x2="80" y2="350" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="330" x2="200" y2="350" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="330" x2="350" y2="350" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Outputs -->
  <rect x="30" y="352" width="120" height="70" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1" filter="url(#sh)"/>
  <text x="90" y="370" text-anchor="middle" fill="#166534" font-size="8" font-weight="700">READINESS DELTA</text>
  <text x="90" y="392" text-anchor="middle" fill="#15803D" font-size="22" font-weight="700">+17%</text>
  <text x="90" y="408" text-anchor="middle" fill="#9CA3AF" font-size="7">67% → 84%</text>

  <rect x="160" y="352" width="120" height="70" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1" filter="url(#sh)"/>
  <text x="220" y="370" text-anchor="middle" fill="#64748B" font-size="8" font-weight="700">CERT. IMPACT</text>
  <text x="220" y="390" text-anchor="middle" fill="#0E7490" font-size="10" font-weight="700">Level 2</text>
  <text x="220" y="404" text-anchor="middle" fill="#15803D" font-size="8">unlocked ✓</text>

  <rect x="290" y="352" width="158" height="70" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1" filter="url(#sh)"/>
  <text x="369" y="370" text-anchor="middle" fill="#64748B" font-size="8" font-weight="700">ESFORÇO ESTIMADO</text>
  <text x="369" y="390" text-anchor="middle" fill="#92400E" font-size="12" font-weight="700">Baixo</text>
  <text x="369" y="405" text-anchor="middle" fill="#9CA3AF" font-size="7">2 requisitos em falta</text>

  <!-- Right side: before/after visual -->
  <rect x="470" y="82" width="200" height="340" rx="10" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="570" y="102" text-anchor="middle" fill="#64748B" font-size="9" font-weight="700" letter-spacing="0.8">ANTES → DEPOIS</text>

  <!-- Level bars before -->
  <text x="484" y="120" fill="#9CA3AF" font-size="8">Antes</text>
  {[
    { level: 0, color: '#374151', w: 150, status: 'achieved' },
    { level: 1, color: '#2A3A8C', w: 150, status: 'achieved' },
    { level: 2, color: '#0E7490', w: 60, status: 'partial' },
    { level: 3, color: '#7C3AED', w: 0, status: 'blocked' },
    { level: 4, color: '#990011', w: 0, status: 'blocked' },
  ].map((l, i) => (
    <g key={i} transform={`translate(484, ${128 + i * 20})`}>
      <rect width="8" height="8" rx="2" fill={l.color}/>
      <rect x="14" y="1" width="130" height="6" rx="3" fill="#F1F5F9"/>
      <rect x="14" y="1" width={l.w} height="6" rx="3" fill={l.color} opacity="0.6"/>
      <text x="152" y="8" fill="#9CA3AF" font-size="7">{l.status}</text>
    </g>
  ))}

  <!-- Level bars after -->
  <text x="484" y="242" fill="#15803D" font-size="8" font-weight="600">Depois</text>
  {[
    { level: 0, color: '#374151', w: 150, status: 'achieved' },
    { level: 1, color: '#2A3A8C', w: 150, status: 'achieved' },
    { level: 2, color: '#0E7490', w: 130, status: 'achieved' },
    { level: 3, color: '#7C3AED', w: 0, status: 'blocked' },
    { level: 4, color: '#990011', w: 0, status: 'blocked' },
  ].map((l, i) => (
    <g key={i} transform={`translate(484, ${250 + i * 20})`}>
      <rect width="8" height="8" rx="2" fill={l.color}/>
      <rect x="14" y="1" width="130" height="6" rx="3" fill="#F1F5F9"/>
      <rect x="14" y="1" width={l.w} height="6" rx="3" fill={l.color} opacity={l.status === 'achieved' ? 1 : 0.4}/>
      <text x="152" y="8" fill={l.status === 'achieved' ? '#15803D' : '#9CA3AF'} font-size="7">{l.status}</text>
    </g>
  ))}

  <!-- Requirements satisfied -->
  <text x="484" y="368" fill="#64748B" font-size="8" font-weight="600">Requisitos satisfeitos</text>
  <text x="484" y="382" fill="#15803D" font-size="8" font-family="ui-monospace, monospace">✓ L2-001 · L2-002</text>
  <text x="484" y="396" fill="#9CA3AF" font-size="8" font-family="ui-monospace, monospace">○ L3-001 · L3-002</text>

  <text x="350" y="440" text-anchor="middle" fill="#9CA3AF" font-size="8">BanzAI · Protocol Simulator · banzami.org</text>
</svg>
