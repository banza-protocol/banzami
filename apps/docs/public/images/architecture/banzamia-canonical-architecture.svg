  <rect x="30" y="230" width="640" height="28" rx="8" fill="url(#goldG)" filter="url(#sh)"/>
  <text x="350" y="249" text-anchor="middle" fill="white" font-size="10" font-weight="700">Quadro de Certificação — 5 Níveis de Confiança</text>

