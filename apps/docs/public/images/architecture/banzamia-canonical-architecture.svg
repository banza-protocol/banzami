<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C89B3C"/>
      <stop offset="100%" style="stop-color:#D4A843"/>
    </linearGradient>
    <linearGradient id="kernelG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/></filter>
  </defs>

  <rect width="700" height="560" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="16" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="41" text-anchor="middle" fill="white" font-size="14" font-weight="700">Banzami — Arquitectura Canónica do Ecossistema</text>
  <text x="350" y="55" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">PROTOCOLO · OPERADORES · CERTIFICAÇÃO · BANZAMIA · APLICAÇÕES</text>

  <!-- ═══ LAYER 1: Protocol Kernel (bottom of stack) ═══ -->
  <rect x="30" y="76" width="640" height="58" rx="10" fill="url(#kernelG)" filter="url(#sh)"/>
  <text x="350" y="98" text-anchor="middle" fill="white" font-size="11" font-weight="700">Protocolo Banzami — Kernel (Rust)</text>
  <text x="350" y="114" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-size="8.5">Ledger · Wallets · QR Protocol · Settlement · Federation · Conformance Engine · Jobs · Audit</text>
  <text x="350" y="128" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="8">Infraestrutura financeira aberta e programável — RFC-0001 a RFC-0008</text>

  <!-- Connector: Kernel → Operators -->
  <line x1="350" y1="134" x2="350" y2="148" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ═══ LAYER 2: Operators ═══ -->
  <rect x="30" y="148" width="640" height="28" rx="8" fill="#374151" filter="url(#sh)"/>
  <text x="350" y="167" text-anchor="middle" fill="white" font-size="10" font-weight="700">Operadores — Entidades certificadas que operam sobre o protocolo</text>

  <!-- Operator pills -->
  <rect x="42" y="184" width="130" height="32" rx="7" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="107" y="198" text-anchor="middle" fill="#990011" font-size="9" font-weight="700">Banza</text>
  <text x="107" y="210" text-anchor="middle" fill="#9CA3AF" font-size="7.5">L1 — Payment Operator</text>

  <rect x="184" y="184" width="130" height="32" rx="7" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="249" y="198" text-anchor="middle" fill="#374151" font-size="9" font-weight="700">Sandbox Operator</text>
  <text x="249" y="210" text-anchor="middle" fill="#9CA3AF" font-size="7.5">L0 — Development &amp; Testing</text>

  <rect x="326" y="184" width="130" height="32" rx="7" fill="#F9FAFB" stroke="#E2D9D7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="391" y="198" text-anchor="middle" fill="#9CA3AF" font-size="9" font-weight="700">Operador Futuro</text>
  <text x="391" y="210" text-anchor="middle" fill="#9CA3AF" font-size="7.5">L2–L4 — Candidato</text>

  <rect x="468" y="184" width="190" height="32" rx="7" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="563" y="198" text-anchor="middle" fill="#374151" font-size="9" font-weight="700">SDK — TypeScript · Flutter · PHP</text>
  <text x="563" y="210" text-anchor="middle" fill="#9CA3AF" font-size="7.5">Integração externa via protocolo oficial</text>

  <!-- Connector: Operators → Certification -->
  <line x1="350" y1="216" x2="350" y2="230" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3"/>

