  <rect x="30" y="266" width="118" height="30" rx="7" fill="white" stroke="#C89B3C" stroke-width="1.5" filter="url(#sh)"/>
  <text x="89" y="279" text-anchor="middle" fill="#92400E" font-size="8" font-weight="700">L0 · Sandbox</text>
  <text x="89" y="290" text-anchor="middle" fill="#9CA3AF" font-size="7">Desenvolvimento</text>

  <rect x="156" y="266" width="118" height="30" rx="7" fill="white" stroke="#C89B3C" stroke-width="1.5" filter="url(#sh)"/>
  <text x="215" y="279" text-anchor="middle" fill="#92400E" font-size="8" font-weight="700">L1 · Payment</text>
  <text x="215" y="290" text-anchor="middle" fill="#9CA3AF" font-size="7">Pagamentos básicos</text>

  <rect x="282" y="266" width="118" height="30" rx="7" fill="white" stroke="#C89B3C" stroke-width="1.5" filter="url(#sh)"/>
  <text x="341" y="279" text-anchor="middle" fill="#92400E" font-size="8" font-weight="700">L2 · Settlement</text>
  <text x="341" y="290" text-anchor="middle" fill="#9CA3AF" font-size="7">Liquidação directa</text>

  <rect x="408" y="266" width="118" height="30" rx="7" fill="white" stroke="#C89B3C" stroke-width="1.5" filter="url(#sh)"/>
  <text x="467" y="279" text-anchor="middle" fill="#92400E" font-size="8" font-weight="700">L3 · Federation</text>
  <text x="467" y="290" text-anchor="middle" fill="#9CA3AF" font-size="7">Federação cross-op.</text>

  <rect x="534" y="266" width="136" height="30" rx="7" fill="white" stroke="#C89B3C" stroke-width="1.5" filter="url(#sh)"/>
  <text x="602" y="279" text-anchor="middle" fill="#92400E" font-size="8" font-weight="700">L4 · Infrastructure</text>
  <text x="602" y="290" text-anchor="middle" fill="#9CA3AF" font-size="7">Nó de protocolo</text>

  <!-- Connector: Certification → BanzamIA -->
  <line x1="350" y1="296" x2="350" y2="310" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3"/>

