  <rect x="30" y="310" width="640" height="34" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="330" text-anchor="middle" fill="white" font-size="12" font-weight="700">BanzamIA — Protocol Operating System</text>
  <text x="350" y="341" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="8">8 capacidades · 16 módulos · 3 camadas · Ferramentas determinam a verdade. A IA explica a verdade.</text>

  <!-- 3 module layers -->
  <!-- Protocolo layer -->
  <rect x="30" y="352" width="640" height="26" rx="6" fill="#FFF5F5" stroke="#990011" stroke-width="1" stroke-opacity="0.3"/>
  <text x="100" y="368" text-anchor="middle" fill="#990011" font-size="8.5" font-weight="700">Protocolo</text>
  <text x="350" y="368" text-anchor="middle" fill="#6B7280" font-size="8">Chat · Protocol Research · Protocol Graph · Knowledge Search · RFC/ADR Explorer</text>

  <!-- Operador layer -->
  <rect x="30" y="382" width="640" height="26" rx="6" fill="#FFF5F5" stroke="#990011" stroke-width="1" stroke-opacity="0.3"/>
  <text x="100" y="398" text-anchor="middle" fill="#990011" font-size="8.5" font-weight="700">Operador</text>
  <text x="358" y="398" text-anchor="middle" fill="#6B7280" font-size="8">Operator Builder · Cert. Copilot · Conformance · Manifest Validator · Protocol Simulator</text>

  <!-- Inteligência layer -->
  <rect x="30" y="412" width="640" height="26" rx="6" fill="#FFF5F5" stroke="#990011" stroke-width="1" stroke-opacity="0.3"/>
  <text x="100" y="428" text-anchor="middle" fill="#990011" font-size="8.5" font-weight="700">Inteligência</text>
  <text x="366" y="428" text-anchor="middle" fill="#6B7280" font-size="8">Trace Explainer · SDK Assistant · Federation Intel. · Protocol Memory · Digital Twin · Quality Dashboard</text>

  <!-- Model Router + Retrieval sub-row -->
  <rect x="30" y="444" width="308" height="26" rx="6" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="90" y="456" text-anchor="middle" fill="#374151" font-size="8" font-weight="700">Model Router</text>
  <text x="230" y="456" text-anchor="middle" fill="#9CA3AF" font-size="7.5">DOCS→Qwen · CODE→Qwen Coder · REASONING→DeepSeek</text>
  <text x="184" y="466" text-anchor="middle" fill="#9CA3AF" font-size="7">Encaminhamento dinâmico por tipo de tarefa</text>

  <rect x="362" y="444" width="308" height="26" rx="6" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="420" y="456" text-anchor="middle" fill="#374151" font-size="8" font-weight="700">Retrieval</text>
  <text x="530" y="456" text-anchor="middle" fill="#9CA3AF" font-size="7.5">RAG (Qdrant) ←→ Protocol Graph (17 nós · 11 relações)</text>
  <text x="516" y="466" text-anchor="middle" fill="#9CA3AF" font-size="7">Recuperação híbrida — vectorial + estrutural</text>

  <!-- Connector: BanzamIA → Applications -->
  <line x1="350" y1="470" x2="350" y2="484" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ═══ LAYER 5: Applications (top of user experience) ═══ -->
  <rect x="30" y="484" width="640" height="28" rx="8" fill="#374151" filter="url(#sh)"/>
  <text x="350" y="503" text-anchor="middle" fill="white" font-size="10" font-weight="700">Aplicações — Superfícies de utilizador e integração</text>

  <!-- Application pills -->
  <rect x="30" y="520" width="108" height="26" rx="7" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="84" y="537" text-anchor="middle" fill="#374151" font-size="8.5" font-weight="700">Banza · App</text>

  <rect x="146" y="520" width="108" height="26" rx="7" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="200" y="537" text-anchor="middle" fill="#374151" font-size="8.5" font-weight="700">banzami.org</text>

  <rect x="262" y="520" width="108" height="26" rx="7" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="316" y="537" text-anchor="middle" fill="#374151" font-size="8.5" font-weight="700">Mobile (Flutter)</text>

  <rect x="378" y="520" width="108" height="26" rx="7" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="432" y="537" text-anchor="middle" fill="#374151" font-size="8.5" font-weight="700">Admin · Dashboard</text>

  <rect x="494" y="520" width="106" height="26" rx="7" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="547" y="537" text-anchor="middle" fill="#374151" font-size="8.5" font-weight="700">BanzamIA · OS</text>

  <rect x="608" y="520" width="62" height="26" rx="7" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="639" y="537" text-anchor="middle" fill="#374151" font-size="8.5" font-weight="700">Partner API</text>
</svg>
