<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C89B3C"/>
      <stop offset="100%" style="stop-color:#D4A843"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/></filter>
  </defs>

  <rect width="700" height="500" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="20" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="45" text-anchor="middle" fill="white" font-size="14" font-weight="700">Protocol Operating System — BanzamIA Vision</text>
  <text x="350" y="59" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">COMPREENDER · EXPLICAR · VALIDAR · SIMULAR · PREVER · GUIAR</text>

  <!-- Central OS ring -->
  <circle cx="350" cy="260" r="110" fill="none" stroke="#990011" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.3"/>
  <circle cx="350" cy="260" r="75" fill="#990011" filter="url(#sh)"/>
  <text x="350" y="249" text-anchor="middle" fill="white" font-size="13" font-weight="700">BanzamIA</text>
  <text x="350" y="264" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9">Protocol</text>
  <text x="350" y="277" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9">Operating System</text>
  <text x="350" y="293" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="8">v2026</text>

  <!-- Capability orbits (8 capabilities around the center) -->
  <!-- Understand — top -->
  <rect x="280" y="82" width="140" height="40" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="100" text-anchor="middle" fill="#374151" font-size="10" font-weight="700">Compreender</text>
  <text x="350" y="114" text-anchor="middle" fill="#9CA3AF" font-size="8">RAG · Knowledge Base · Protocol Graph</text>
  <line x1="350" y1="122" x2="350" y2="186" stroke="#E2D9D7" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Explain — top-right -->
  <rect x="510" y="126" width="140" height="40" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="580" y="144" text-anchor="middle" fill="#374151" font-size="10" font-weight="700">Explicar</text>
  <text x="580" y="158" text-anchor="middle" fill="#9CA3AF" font-size="8">Chat · Research Agent · Citations</text>
  <line x1="510" y1="146" x2="457" y2="208" stroke="#E2D9D7" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Validate — right -->
  <rect x="536" y="240" width="134" height="40" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="603" y="258" text-anchor="middle" fill="#374151" font-size="10" font-weight="700">Validar</text>
  <text x="603" y="272" text-anchor="middle" fill="#9CA3AF" font-size="8">Conformance · Manifest · Trace</text>
  <line x1="536" y1="260" x2="425" y2="260" stroke="#E2D9D7" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Simulate — bottom-right -->
  <rect x="510" y="334" width="140" height="40" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="580" y="352" text-anchor="middle" fill="#374151" font-size="10" font-weight="700">Simular</text>
  <text x="580" y="366" text-anchor="middle" fill="#9CA3AF" font-size="8">Protocol Simulator · What-If</text>
  <line x1="510" y1="354" x2="457" y2="312" stroke="#E2D9D7" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Predict — bottom -->
  <rect x="280" y="378" width="140" height="40" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="396" text-anchor="middle" fill="#374151" font-size="10" font-weight="700">Prever</text>
  <text x="350" y="410" text-anchor="middle" fill="#9CA3AF" font-size="8">Memory · Trajectory · Analytics</text>
  <line x1="350" y1="378" x2="350" y2="334" stroke="#E2D9D7" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Guide — bottom-left -->
  <rect x="50" y="334" width="140" height="40" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="120" y="352" text-anchor="middle" fill="#374151" font-size="10" font-weight="700">Guiar</text>
  <text x="120" y="366" text-anchor="middle" fill="#9CA3AF" font-size="8">Digital Twin · Recommendations</text>
  <line x1="190" y1="354" x2="243" y2="312" stroke="#E2D9D7" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Certify — left -->
  <rect x="30" y="240" width="134" height="40" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="97" y="258" text-anchor="middle" fill="#374151" font-size="10" font-weight="700">Certificar</text>
  <text x="97" y="272" text-anchor="middle" fill="#9CA3AF" font-size="8">Copilot · L0–L4 · Roadmap</text>
  <line x1="164" y1="260" x2="275" y2="260" stroke="#E2D9D7" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Federate — top-left -->
  <rect x="50" y="126" width="140" height="40" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="120" y="144" text-anchor="middle" fill="#374151" font-size="10" font-weight="700">Federar</text>
  <text x="120" y="158" text-anchor="middle" fill="#9CA3AF" font-size="8">Federation Intelligence · Graph</text>
  <line x1="190" y1="146" x2="243" y2="208" stroke="#E2D9D7" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Tagline -->
  <rect x="180" y="450" width="340" height="30" rx="8" fill="url(#goldG)" filter="url(#sh)"/>
  <text x="350" y="469" text-anchor="middle" fill="white" font-size="11" font-weight="700">Tools determine truth. AI explains truth.</text>

  <text x="350" y="492" text-anchor="middle" fill="#9CA3AF" font-size="8">BanzamIA · Protocol Operating System · banzami.org</text>
</svg>
