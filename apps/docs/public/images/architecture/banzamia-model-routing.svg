  <!-- Caption -->
  <text x="350" y="398" text-anchor="middle" fill="#9B8E8C" font-size="9">BanzAI não envia todos os pedidos para o mesmo modelo. Cada tarefa recebe o modelo e as ferramentas certas.</text>
