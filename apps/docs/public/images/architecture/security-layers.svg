<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000014"/>
    </filter>
  </defs>

  <rect width="700" height="420" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="22" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="50" text-anchor="middle" fill="white" font-size="16" font-weight="700">Camadas de Segurança</text>
  <text x="350" y="62" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">CADA TRANSACÇÃO ATRAVESSA TODAS AS CAMADAS</text>

  <!-- Layer 1: Consumer -->
  <rect x="200" y="86" width="300" height="52" rx="10" fill="white" stroke="#D4C9C7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="108" text-anchor="middle" fill="#1A1A1A" font-size="12" font-weight="700">Consumidor / Comerciante</text>
  <text x="350" y="127" text-anchor="middle" fill="#6B6265" font-size="9">App Banza · Banza Business · SDK</text>

  <!-- Arrow 1 -->
  <line x1="350" y1="138" x2="350" y2="162" stroke="#C4B8B6" stroke-width="2"/>
  <polygon points="344,159 356,159 350,169" fill="#C4B8B6"/>

  <!-- Layer 2: API Gateway -->
  <rect x="120" y="169" width="460" height="52" rx="10" fill="#FEF9F5" stroke="#DBBCB2" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="191" text-anchor="middle" fill="#990011" font-size="12" font-weight="700">API Gateway</text>
  <text x="350" y="209" text-anchor="middle" fill="#6B6265" font-size="9">JWT · Rate limiting · CORS · Idempotência · Routing</text>

  <!-- Arrow 2 -->
  <line x1="350" y1="221" x2="350" y2="245" stroke="#C4B8B6" stroke-width="2"/>
  <polygon points="344,242 356,242 350,252" fill="#C4B8B6"/>

  <!-- Layer 3: Rust Core -->
  <rect x="60" y="252" width="580" height="64" rx="10" fill="#F5EDE8" stroke="#DBBCB2" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="274" text-anchor="middle" fill="#990011" font-size="12" font-weight="700">Rust Core — Invariantes Financeiros</text>
  <text x="350" y="293" text-anchor="middle" fill="#6B6265" font-size="9">INV-LEDGER · INV-STL · INV-TRACE · validação de estado</text>
  <text x="350" y="308" text-anchor="middle" fill="#9B8E8C" font-size="9">Motor de risco · KYC/KYB · compliance · auditoria</text>

  <!-- Arrow 3 -->
  <line x1="350" y1="316" x2="350" y2="340" stroke="#C4B8B6" stroke-width="2"/>
  <polygon points="344,337 356,337 350,347" fill="#C4B8B6"/>

  <!-- Layer 4: PostgreSQL -->
  <rect x="30" y="347" width="640" height="52" rx="10" fill="#EEF2FF" stroke="#9BA8D4" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="369" text-anchor="middle" fill="#2A3A8C" font-size="12" font-weight="700">PostgreSQL</text>
  <text x="350" y="387" text-anchor="middle" fill="#5B6C9A" font-size="9">constraints de esquema · transacções ACID · append-only ledger</text>
</svg>
