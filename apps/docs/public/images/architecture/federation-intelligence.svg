<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/></filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="700" height="460" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="20" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="45" text-anchor="middle" fill="white" font-size="14" font-weight="700">Federation Intelligence — Operator Compatibility Analysis</text>
  <text x="350" y="59" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">COMPATIBILIDADE · CAPACIDADES EM FALTA · CONFLITOS · PRÓXIMAS ACÇÕES</text>

  <!-- Operator A -->
  <rect x="30" y="82" width="195" height="170" rx="10" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="127" y="101" text-anchor="middle" fill="#374151" font-size="10" font-weight="700">Operador A</text>
  <text x="127" y="114" text-anchor="middle" fill="#9CA3AF" font-size="8">op_alpha_001 · sandbox</text>
  <!-- Level indicator -->
  <circle cx="64" cy="145" r="20" fill="#2A3A8C"/>
  <text x="64" y="150" text-anchor="middle" fill="white" font-size="16" font-weight="700">1</text>
  <text x="94" y="140" fill="#1E293B" font-size="9" font-weight="600">Level 1</text>
  <text x="94" y="152" fill="#9CA3AF" font-size="8">Protocol-compatible</text>
  <!-- Caps -->
  <text x="44" y="180" fill="#9CA3AF" font-size="7.5">✓ supports_wallets</text>
  <text x="44" y="192" fill="#9CA3AF" font-size="7.5">✓ supports_transfers</text>
  <text x="44" y="204" fill="#9CA3AF" font-size="7.5">✓ supports_qr</text>
  <text x="44" y="216" fill="#EF4444" font-size="7.5">✗ supports_manifest</text>
  <text x="44" y="228" fill="#EF4444" font-size="7.5">✗ supports_federation</text>
  <text x="44" y="240" fill="#EF4444" font-size="7.5">✗ supports_cross_operator</text>

  <!-- Operator B -->
  <rect x="475" y="82" width="195" height="170" rx="10" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="573" y="101" text-anchor="middle" fill="#374151" font-size="10" font-weight="700">Operador B</text>
  <text x="573" y="114" text-anchor="middle" fill="#9CA3AF" font-size="8">op_beta_002 · sandbox</text>
  <!-- Level indicator -->
  <circle cx="516" cy="145" r="20" fill="#0E7490"/>
  <text x="516" y="150" text-anchor="middle" fill="white" font-size="16" font-weight="700">2</text>
  <text x="544" y="140" fill="#1E293B" font-size="9" font-weight="600">Level 2</text>
  <text x="544" y="152" fill="#9CA3AF" font-size="8">Trace-compatible</text>
  <!-- Caps -->
  <text x="494" y="180" fill="#9CA3AF" font-size="7.5">✓ supports_wallets</text>
  <text x="494" y="192" fill="#9CA3AF" font-size="7.5">✓ supports_transfers</text>
  <text x="494" y="204" fill="#9CA3AF" font-size="7.5">✓ supports_qr</text>
  <text x="494" y="216" fill="#9CA3AF" font-size="7.5">✓ supports_traces</text>
  <text x="494" y="228" fill="#EF4444" font-size="7.5">✗ supports_federation</text>
  <text x="494" y="240" fill="#EF4444" font-size="7.5">✗ supports_cross_operator</text>

  <!-- Arrows to analysis engine -->
  <line x1="225" y1="167" x2="265" y2="200" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="475" y1="167" x2="435" y2="200" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Analysis engine -->
  <rect x="250" y="204" width="200" height="48" rx="10" fill="#990011" filter="url(#sh)"/>
  <text x="350" y="226" text-anchor="middle" fill="white" font-size="11" font-weight="700">analyzeFederation()</text>
  <text x="350" y="241" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="8">Cert A · Cert B · Caps · Environments</text>

  <!-- Compatibility score -->
  <rect x="220" y="270" width="260" height="54" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1" filter="url(#sh)"/>
  <text x="350" y="289" text-anchor="middle" fill="#64748B" font-size="8" font-weight="700" letter-spacing="0.5">COMPATIBILITY SCORE</text>
  <text x="310" y="316" text-anchor="middle" fill="#92400E" font-size="28" font-weight="700">52</text>
  <rect x="330" y="298" width="120" height="8" rx="4" fill="#F1F5F9"/>
  <rect x="330" y="298" width="62" height="8" rx="4" fill="#F59E0B"/>
  <text x="350" y="320" text-anchor="middle" fill="#92400E" font-size="7">Não pronto · 2 bloqueios</text>

  <!-- Outputs row -->
  <line x1="165" y1="252" x2="60" y2="336" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>
  <line x1="350" y1="324" x2="350" y2="344" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="535" y1="252" x2="640" y2="336" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>

  <!-- Left output: missing A -->
  <rect x="30" y="338" width="150" height="76" rx="8" fill="white" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="105" y="356" text-anchor="middle" fill="#92400E" font-size="8" font-weight="700">EM FALTA — A</text>
  <text x="44" y="370" fill="#92400E" font-size="7.5" font-family="ui-monospace, monospace">○ supports_manifest</text>
  <text x="44" y="382" fill="#92400E" font-size="7.5" font-family="ui-monospace, monospace">○ supports_federation</text>
  <text x="44" y="394" fill="#92400E" font-size="7.5" font-family="ui-monospace, monospace">○ supports_cross_operator</text>
  <text x="105" y="408" text-anchor="middle" fill="#9CA3AF" font-size="7">Esforço: 3–6 semanas</text>

  <!-- Middle output: shared caps -->
  <rect x="268" y="344" width="164" height="70" rx="8" fill="white" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="350" y="362" text-anchor="middle" fill="#166534" font-size="8" font-weight="700">CAPACIDADES PARTILHADAS</text>
  <text x="282" y="376" fill="#15803D" font-size="7.5" font-family="ui-monospace, monospace">✓ supports_wallets</text>
  <text x="282" y="388" fill="#15803D" font-size="7.5" font-family="ui-monospace, monospace">✓ supports_transfers</text>
  <text x="282" y="400" fill="#15803D" font-size="7.5" font-family="ui-monospace, monospace">✓ supports_qr</text>

  <!-- Right output: missing B -->
  <rect x="520" y="338" width="150" height="76" rx="8" fill="white" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="595" y="356" text-anchor="middle" fill="#92400E" font-size="8" font-weight="700">EM FALTA — B</text>
  <text x="534" y="370" fill="#92400E" font-size="7.5" font-family="ui-monospace, monospace">○ supports_federation</text>
  <text x="534" y="382" fill="#92400E" font-size="7.5" font-family="ui-monospace, monospace">○ supports_cross_operator</text>
  <text x="595" y="398" text-anchor="middle" fill="#9CA3AF" font-size="7">Esforço: 1–2 semanas</text>

  <text x="350" y="438" text-anchor="middle" fill="#9CA3AF" font-size="8">BanzamIA · Federation Intelligence · banzami.org</text>
</svg>
