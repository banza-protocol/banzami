<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000014"/>
    </filter>
  </defs>

  <rect width="700" height="300" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="22" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="50" text-anchor="middle" fill="white" font-size="16" font-weight="700">Arquitectura de Federação</text>
  <text x="350" y="62" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">ENCAMINHAMENTO ENTRE OPERADORES CERTIFICADOS (PLANEADO)</text>

  <!-- Operator X node -->
  <rect x="40" y="100" width="175" height="70" rx="12" fill="white" stroke="#D4C9C7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="127" y="124" text-anchor="middle" fill="#990011" font-size="11" font-weight="700">Operador X</text>
  <text x="127" y="141" text-anchor="middle" fill="#1A1A1A" font-size="10" font-weight="600">Consumidor A</text>
  <text x="127" y="157" text-anchor="middle" fill="#6B6265" font-size="9">@alice · Operador X</text>

  <!-- Arrow right -->
  <line x1="215" y1="135" x2="258" y2="135" stroke="#C4B8B6" stroke-width="2"/>
  <polygon points="255,129 265,135 255,141" fill="#C4B8B6"/>
  <text x="240" y="126" text-anchor="middle" fill="#9B8E8C" font-size="8">pagamento</text>

  <!-- Federation layer -->
  <rect x="263" y="90" width="174" height="90" rx="12" fill="#FEF9F5" stroke="#DBBCB2" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="115" text-anchor="middle" fill="#990011" font-size="10" font-weight="700">Camada de</text>
  <text x="350" y="130" text-anchor="middle" fill="#990011" font-size="10" font-weight="700">Federação Banzami</text>
  <text x="350" y="149" text-anchor="middle" fill="#6B6265" font-size="8">encaminhamento</text>
  <text x="350" y="163" text-anchor="middle" fill="#6B6265" font-size="8">liquidação · invariantes</text>

  <!-- Arrow right -->
  <line x1="437" y1="135" x2="480" y2="135" stroke="#C4B8B6" stroke-width="2"/>
  <polygon points="477,129 487,135 477,141" fill="#C4B8B6"/>
  <text x="460" y="126" text-anchor="middle" fill="#9B8E8C" font-size="8">crédito</text>

  <!-- Operator Y node -->
  <rect x="485" y="100" width="175" height="70" rx="12" fill="white" stroke="#D4C9C7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="572" y="124" text-anchor="middle" fill="#990011" font-size="11" font-weight="700">Operador Y</text>
  <text x="572" y="141" text-anchor="middle" fill="#1A1A1A" font-size="10" font-weight="600">Consumidor B</text>
  <text x="572" y="157" text-anchor="middle" fill="#6B6265" font-size="9">@bob · Operador Y</text>

  <!-- Footer -->
  <text x="350" y="225" text-anchor="middle" fill="#9B8E8C" font-size="9">Ambos os operadores devem ter Nível 4 — Operador de Infraestrutura</text>
  <text x="350" y="242" text-anchor="middle" fill="#9B8E8C" font-size="9">Invariantes financeiros verificados em ambos os lados da federação</text>
</svg>
