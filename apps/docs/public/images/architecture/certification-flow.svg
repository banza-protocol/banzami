<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 540" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/>
    </filter>
  </defs>

  <rect width="700" height="540" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="22" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="50" text-anchor="middle" fill="white" font-size="16" font-weight="700">Processo de Certificação</text>
  <text x="350" y="62" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">7 ETAPAS — DO MANIFESTO AO ARTEFACTO ASSINADO</text>

  <!-- Steps -->
  <!-- Step 1 -->
  <rect x="80" y="86" width="540" height="44" rx="8" fill="white" stroke="#D4C9C7" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="108" cy="108" r="12" fill="#990011"/>
  <text x="108" y="113" text-anchor="middle" fill="white" font-size="11" font-weight="700">1</text>
  <text x="132" y="105" fill="#1A1A1A" font-size="10" font-weight="700">Operador submete Manifesto</text>
  <text x="132" y="121" fill="#6B6265" font-size="9">declara nível alvo e capacidades</text>

  <line x1="350" y1="130" x2="350" y2="148" stroke="#C4B8B6" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="345,145 355,145 350,153" fill="#C4B8B6"/>

  <!-- Step 2 -->
  <rect x="80" y="153" width="540" height="44" rx="8" fill="#FEF9F5" stroke="#DBBCB2" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="108" cy="175" r="12" fill="#990011"/>
  <text x="108" y="180" text-anchor="middle" fill="white" font-size="11" font-weight="700">2</text>
  <text x="132" y="172" fill="#1A1A1A" font-size="10" font-weight="700">BanzAI Manifest Validator</text>
  <text x="132" y="188" fill="#6B6265" font-size="9">valida estrutura e completude do manifesto</text>

  <line x1="350" y1="197" x2="350" y2="215" stroke="#C4B8B6" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="345,212 355,212 350,220" fill="#C4B8B6"/>

  <!-- Step 3 -->
  <rect x="80" y="220" width="540" height="44" rx="8" fill="white" stroke="#D4C9C7" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="108" cy="242" r="12" fill="#990011"/>
  <text x="108" y="247" text-anchor="middle" fill="white" font-size="11" font-weight="700">3</text>
  <text x="132" y="239" fill="#1A1A1A" font-size="10" font-weight="700">Operador executa Conformance Suite</text>
  <text x="132" y="255" fill="#6B6265" font-size="9">para o nível declarado — 100% pass obrigatório</text>

  <line x1="350" y1="264" x2="350" y2="282" stroke="#C4B8B6" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="345,279 355,279 350,287" fill="#C4B8B6"/>

  <!-- Step 4 -->
  <rect x="80" y="287" width="540" height="44" rx="8" fill="#FEF9F5" stroke="#DBBCB2" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="108" cy="309" r="12" fill="#990011"/>
  <text x="108" y="314" text-anchor="middle" fill="white" font-size="11" font-weight="700">4</text>
  <text x="132" y="306" fill="#1A1A1A" font-size="10" font-weight="700">BanzAI Conformance</text>
  <text x="132" y="322" fill="#6B6265" font-size="9">verifica resultados dos testes e invariantes</text>

  <line x1="350" y1="331" x2="350" y2="349" stroke="#C4B8B6" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="345,346 355,346 350,354" fill="#C4B8B6"/>

  <!-- Step 5 -->
  <rect x="80" y="354" width="540" height="44" rx="8" fill="white" stroke="#D4C9C7" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="108" cy="376" r="12" fill="#990011"/>
  <text x="108" y="381" text-anchor="middle" fill="white" font-size="11" font-weight="700">5</text>
  <text x="132" y="373" fill="#1A1A1A" font-size="10" font-weight="700">Invariantes financeiros verificados</text>
  <text x="132" y="389" fill="#6B6265" font-size="9">INV-LEDGER · INV-STL · INV-TRACE · INV-WALLET para todas as capacidades</text>

  <line x1="350" y1="398" x2="350" y2="416" stroke="#C4B8B6" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="345,413 355,413 350,421" fill="#C4B8B6"/>

  <!-- Step 6 -->
  <rect x="80" y="421" width="540" height="44" rx="8" fill="#EDF7ED" stroke="#3D8A3D" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="108" cy="443" r="12" fill="#1E661E"/>
  <text x="108" y="448" text-anchor="middle" fill="white" font-size="11" font-weight="700">6</text>
  <text x="132" y="440" fill="#1E661E" font-size="10" font-weight="700">Certificação emitida como artefacto assinado</text>
  <text x="132" y="456" fill="#6B6265" font-size="9">documento criptograficamente assinado com nível e capacidades</text>

  <line x1="350" y1="465" x2="350" y2="483" stroke="#C4B8B6" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="345,480 355,480 350,488" fill="#C4B8B6"/>

  <!-- Step 7 -->
  <rect x="80" y="488" width="540" height="32" rx="8" fill="#EEF2FF" stroke="#9BA8D4" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="108" cy="504" r="12" fill="#2A3A8C"/>
  <text x="108" y="509" text-anchor="middle" fill="white" font-size="11" font-weight="700">7</text>
  <text x="132" y="508" fill="#2A3A8C" font-size="10" font-weight="700">Certificação registada no registo público de operadores</text>
</svg>
