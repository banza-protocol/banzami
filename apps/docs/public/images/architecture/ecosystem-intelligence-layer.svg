<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C89B3C"/>
      <stop offset="100%" style="stop-color:#D4A843"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="700" height="500" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="20" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="45" text-anchor="middle" fill="white" font-size="14" font-weight="700">Ecosystem Intelligence Layer</text>
  <text x="350" y="59" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">CAMADAS DE INTELIGÊNCIA DO BANZAI</text>

  <!-- Layer 1: Knowledge Foundation -->
  <rect x="40" y="82" width="620" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="100" text-anchor="middle" fill="#475569" font-size="9" font-weight="700" letter-spacing="0.8">CAMADA 1 — BASE DE CONHECIMENTO</text>
  <!-- boxes inside -->
  <rect x="56" y="106" width="110" height="36" rx="6" fill="white" stroke="#E2D9D7" stroke-width="1"/>
  <text x="111" y="121" text-anchor="middle" fill="#64748B" font-size="8" font-weight="600">RFCs · ADRs</text>
  <text x="111" y="133" text-anchor="middle" fill="#9CA3AF" font-size="7">Protocolo canónico</text>

  <rect x="176" y="106" width="110" height="36" rx="6" fill="white" stroke="#E2D9D7" stroke-width="1"/>
  <text x="231" y="121" text-anchor="middle" fill="#64748B" font-size="8" font-weight="600">OpenAPI · Schemas</text>
  <text x="231" y="133" text-anchor="middle" fill="#9CA3AF" font-size="7">Contratos de API</text>

  <rect x="296" y="106" width="110" height="36" rx="6" fill="white" stroke="#E2D9D7" stroke-width="1"/>
  <text x="351" y="121" text-anchor="middle" fill="#64748B" font-size="8" font-weight="600">Invariantes</text>
  <text x="351" y="133" text-anchor="middle" fill="#9CA3AF" font-size="7">Propriedades financeiras</text>

  <rect x="416" y="106" width="110" height="36" rx="6" fill="white" stroke="#E2D9D7" stroke-width="1"/>
  <text x="471" y="121" text-anchor="middle" fill="#64748B" font-size="8" font-weight="600">Conceitos · SDK</text>
  <text x="471" y="133" text-anchor="middle" fill="#9CA3AF" font-size="7">Documentação técnica</text>

  <rect x="536" y="106" width="108" height="36" rx="6" fill="white" stroke="#E2D9D7" stroke-width="1"/>
  <text x="590" y="121" text-anchor="middle" fill="#64748B" font-size="8" font-weight="600">Conformance Tests</text>
  <text x="590" y="133" text-anchor="middle" fill="#9CA3AF" font-size="7">Resultados de validação</text>

  <!-- Arrow -->
  <line x1="350" y1="152" x2="350" y2="168" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Layer 2: RAG + Graph -->
  <rect x="40" y="170" width="620" height="70" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#sh)"/>
