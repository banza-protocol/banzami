  <text x="130" y="341" text-anchor="middle" fill="#6B6265" font-size="9">TypeScript · Dart · PHP · Go</text>
  <rect x="248" y="314" width="180" height="28" rx="14" fill="#EA580C"/>
  <text x="338" y="333" text-anchor="middle" fill="white" font-size="10" font-weight="700">× BanzamIA</text>
  <rect x="446" y="306" width="224" height="44" rx="8" fill="#EDF7ED" stroke="#86EFAC" stroke-width="1.5" filter="url(#sh)"/>
  <text x="558" y="325" text-anchor="middle" fill="#166534" font-size="10" font-weight="700">Desenvolvimento mais rápido</text>
  <text x="558" y="341" text-anchor="middle" fill="#4B7A51" font-size="8">Geração de código · Guia de integração</text>

  <!-- ROW 6: Federação (y=358) -->
  <rect x="30" y="358" width="200" height="44" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#sh)"/>
