<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/>
    </filter>
  </defs>

  <rect width="700" height="420" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="22" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="47" text-anchor="middle" fill="white" font-size="14" font-weight="700">BanzamIA como Multiplicador de Força</text>
  <text x="350" y="61" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">SEIS COMPONENTES DO ECOSSISTEMA AMPLIFICADOS</text>

  <!-- Column headers -->
  <text x="130" y="90" text-anchor="middle" fill="#6B6265" font-size="9" font-weight="600" letter-spacing="0.5">COMPONENTE</text>
  <text x="338" y="90" text-anchor="middle" fill="#EA580C" font-size="9" font-weight="700" letter-spacing="0.5">× BANZAMIA</text>
  <text x="558" y="90" text-anchor="middle" fill="#6B6265" font-size="9" font-weight="600" letter-spacing="0.5">RESULTADO</text>

  <!-- ROW 1: Kernel (y=98) -->
  <rect x="30" y="98" width="200" height="44" rx="8" fill="#FEF9F5" stroke="#DBBCB2" stroke-width="1.5" filter="url(#sh)"/>
  <text x="130" y="117" text-anchor="middle" fill="#990011" font-size="11" font-weight="700">Kernel</text>
