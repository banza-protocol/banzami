  <text x="338" y="229" text-anchor="middle" fill="white" font-size="10" font-weight="700">× BanzamIA</text>
  <rect x="446" y="202" width="224" height="44" rx="8" fill="#EDF7ED" stroke="#86EFAC" stroke-width="1.5" filter="url(#sh)"/>
  <text x="558" y="221" text-anchor="middle" fill="#166534" font-size="10" font-weight="700">Menos erros de implementação</text>
  <text x="558" y="237" text-anchor="middle" fill="#4B7A51" font-size="8">Validação guiada e explicada</text>

