  <text x="338" y="177" text-anchor="middle" fill="white" font-size="10" font-weight="700">× BanzamIA</text>
  <rect x="446" y="150" width="224" height="44" rx="8" fill="#EDF7ED" stroke="#86EFAC" stroke-width="1.5" filter="url(#sh)"/>
  <text x="558" y="169" text-anchor="middle" fill="#166534" font-size="10" font-weight="700">Mais sucesso de certificação</text>
