  <text x="338" y="281" text-anchor="middle" fill="white" font-size="10" font-weight="700">× BanzamIA</text>
  <rect x="446" y="254" width="224" height="44" rx="8" fill="#EDF7ED" stroke="#86EFAC" stroke-width="1.5" filter="url(#sh)"/>
  <text x="558" y="273" text-anchor="middle" fill="#166534" font-size="10" font-weight="700">Conhecimento acessível a todos</text>
  <text x="558" y="289" text-anchor="middle" fill="#4B7A51" font-size="8">Protocolo explicável a qualquer um</text>

  <!-- ROW 5: Integration Surface (y=306) -->
  <rect x="30" y="306" width="200" height="44" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" filter="url(#sh)"/>
