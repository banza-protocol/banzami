  <rect x="248" y="106" width="180" height="28" rx="14" fill="#EA580C"/>
  <text x="338" y="125" text-anchor="middle" fill="white" font-size="10" font-weight="700">× BanzamIA</text>
  <rect x="446" y="98" width="224" height="44" rx="8" fill="#EDF7ED" stroke="#86EFAC" stroke-width="1.5" filter="url(#sh)"/>
  <text x="558" y="117" text-anchor="middle" fill="#166534" font-size="10" font-weight="700">Integrações mais fáceis</text>
  <text x="558" y="133" text-anchor="middle" fill="#4B7A51" font-size="8">SDKs mais rápidos de adoptar</text>

