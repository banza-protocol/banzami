  <rect x="248" y="366" width="180" height="28" rx="14" fill="#EA580C"/>
  <text x="338" y="385" text-anchor="middle" fill="white" font-size="10" font-weight="700">× BanzamIA</text>
  <rect x="446" y="358" width="224" height="44" rx="8" fill="#EDF7ED" stroke="#86EFAC" stroke-width="1.5" filter="url(#sh)"/>
  <text x="558" y="377" text-anchor="middle" fill="#166534" font-size="10" font-weight="700">Onboarding mais fácil</text>
  <text x="558" y="393" text-anchor="middle" fill="#4B7A51" font-size="8">Operadores adoptam a federação mais rápido</text>

  <!-- Caption -->
  <text x="350" y="412" text-anchor="middle" fill="#9B8E8C" font-size="9">O BanzamIA amplifica cada componente do ecossistema. Quanto maior o protocolo, mais valioso o BanzamIA.</text>
