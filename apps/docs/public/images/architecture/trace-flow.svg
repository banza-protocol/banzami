<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/>
    </filter>
  </defs>

  <rect width="700" height="520" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="22" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="50" text-anchor="middle" fill="white" font-size="16" font-weight="700">Sistema de Rastreabilidade</text>
  <text x="350" y="62" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">CADA PAGAMENTO GERA UM trace_id ÚNICO</text>

  <!-- Events: left column (QR/Transfer events) and right column (Ledger events) -->

  <!-- qr.created -->
  <rect x="220" y="84" width="260" height="40" rx="8" fill="white" stroke="#D4C9C7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="270" y="109" fill="#990011" font-size="10" font-weight="700">qr.created</text>
  <text x="400" y="109" text-anchor="middle" fill="#6B6265" font-size="9">QR gerado pelo comerciante</text>

  <line x1="350" y1="124" x2="350" y2="144" stroke="#C4B8B6" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="345,141 355,141 350,149" fill="#C4B8B6"/>

  <!-- transfer.initiated -->
  <rect x="220" y="149" width="260" height="40" rx="8" fill="white" stroke="#D4C9C7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="270" y="174" fill="#990011" font-size="10" font-weight="700">transfer.initiated</text>
  <text x="415" y="174" text-anchor="middle" fill="#6B6265" font-size="9">consumidor confirma</text>

  <line x1="350" y1="189" x2="350" y2="209" stroke="#C4B8B6" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="345,206 355,206 350,214" fill="#C4B8B6"/>

  <!-- ledger.debit -->
  <rect x="120" y="214" width="220" height="40" rx="8" fill="#FEF9F5" stroke="#DBBCB2" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="238" fill="#990011" font-size="10" font-weight="700">ledger.debit</text>
  <text x="230" y="252" text-anchor="middle" fill="#6B6265" font-size="8">carteira consumidor</text>

  <!-- ledger.credit (parallel) -->
  <rect x="360" y="214" width="220" height="40" rx="8" fill="#FEF9F5" stroke="#DBBCB2" stroke-width="1.5" filter="url(#sh)"/>
  <text x="410" y="231" fill="#990011" font-size="10" font-weight="700">ledger.credit</text>
  <text x="470" y="245" text-anchor="middle" fill="#6B6265" font-size="8">merchant + fees</text>

  <!-- Connecting lines from transfer.initiated to both ledger events -->
  <line x1="350" y1="209" x2="230" y2="214" stroke="#C4B8B6" stroke-width="1.5"/>
  <line x1="350" y1="209" x2="470" y2="214" stroke="#C4B8B6" stroke-width="1.5"/>

  <!-- Merge lines back -->
  <line x1="230" y1="254" x2="230" y2="278" stroke="#C4B8B6" stroke-width="1.5"/>
  <line x1="470" y1="254" x2="470" y2="278" stroke="#C4B8B6" stroke-width="1.5"/>
  <line x1="230" y1="278" x2="470" y2="278" stroke="#C4B8B6" stroke-width="1.5"/>
  <line x1="350" y1="278" x2="350" y2="294" stroke="#C4B8B6" stroke-width="1.5"/>
  <polygon points="345,291 355,291 350,299" fill="#C4B8B6"/>

  <!-- transfer.completed -->
  <rect x="220" y="299" width="260" height="40" rx="8" fill="white" stroke="#D4C9C7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="270" y="323" fill="#990011" font-size="10" font-weight="700">transfer.completed</text>
  <text x="420" y="323" text-anchor="middle" fill="#6B6265" font-size="9">INV-TRACE-001 verificado</text>

  <line x1="350" y1="339" x2="350" y2="359" stroke="#C4B8B6" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="345,356 355,356 350,364" fill="#C4B8B6"/>

  <!-- qr.paid -->
  <rect x="220" y="364" width="260" height="40" rx="8" fill="#EDF7ED" stroke="#3D8A3D" stroke-width="1.5" filter="url(#sh)"/>
  <text x="270" y="389" fill="#1E661E" font-size="10" font-weight="700">qr.paid</text>
  <text x="370" y="389" text-anchor="middle" fill="#6B6265" font-size="9">QR marcado como PAID</text>

  <line x1="350" y1="404" x2="350" y2="424" stroke="#C4B8B6" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="345,421 355,421 350,429" fill="#C4B8B6"/>

  <!-- settlement.assigned -->
  <rect x="220" y="429" width="260" height="40" rx="8" fill="#EEF2FF" stroke="#9BA8D4" stroke-width="1.5" filter="url(#sh)"/>
  <text x="270" y="453" fill="#2A3A8C" font-size="10" font-weight="700">settlement.assigned</text>
  <text x="440" y="453" text-anchor="middle" fill="#6B6265" font-size="9">ciclo T+0</text>

  <!-- trace_id label on the right -->
  <rect x="590" y="130" width="80" height="310" rx="8" fill="rgba(153,0,17,0.05)" stroke="#DBBCB2" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="630" y="295" text-anchor="middle" fill="#990011" font-size="9" font-weight="700" transform="rotate(-90 630 295)">trace_id</text>
</svg>
