<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 322" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/>
    </filter>
  </defs>

  <rect width="700" height="322" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="22" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="47" text-anchor="middle" fill="white" font-size="14" font-weight="700">O Protocolo que se Explica a Si Mesmo</text>
  <text x="350" y="61" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">MODELO TRADICIONAL VS. COM BANZAMIA</text>

  <!-- LEFT COLUMN: Modelo Tradicional -->
  <rect x="30" y="80" width="300" height="216" rx="12" fill="white" stroke="#DBBCB2" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="30" y="80" width="300" height="32" rx="12" fill="#475569"/>
  <rect x="30" y="100" width="300" height="12" fill="#475569"/>
  <text x="180" y="101" text-anchor="middle" fill="white" font-size="10" font-weight="700" letter-spacing="0.5">MODELO TRADICIONAL</text>

  <!-- Left flow -->
  <rect x="50" y="120" width="260" height="28" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="180" y="138" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">Protocolo</text>

  <text x="180" y="157" text-anchor="middle" fill="#9CA3AF" font-size="12">↓</text>

  <rect x="50" y="162" width="260" height="44" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="180" y="180" text-anchor="middle" fill="#991B1B" font-size="10" font-weight="600">Suporte Humano Necessário</text>
  <text x="180" y="197" text-anchor="middle" fill="#B91C1C" font-size="8">Equipa de suporte · Especialistas · Architects</text>

  <text x="180" y="218" text-anchor="middle" fill="#9CA3AF" font-size="12">↓</text>

  <rect x="50" y="224" width="260" height="28" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="180" y="242" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">Operador</text>

  <text x="180" y="270" text-anchor="middle" fill="#991B1B" font-size="8" font-style="italic">⚠ Limitado pela capacidade humana disponível</text>
  <text x="180" y="285" text-anchor="middle" fill="#991B1B" font-size="8" font-style="italic">Escala lenta · Custo elevado</text>

  <!-- RIGHT COLUMN: Com BanzamIA -->
  <rect x="370" y="80" width="300" height="216" rx="12" fill="white" stroke="#FED7AA" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="370" y="80" width="300" height="32" rx="12" fill="#EA580C"/>
  <rect x="370" y="100" width="300" height="12" fill="#EA580C"/>
  <text x="520" y="101" text-anchor="middle" fill="white" font-size="10" font-weight="700" letter-spacing="0.5">COM BANZAMIA</text>

  <!-- Right flow -->
  <rect x="390" y="120" width="260" height="28" rx="6" fill="#FFF7F0" stroke="#FED7AA" stroke-width="1"/>
  <text x="520" y="138" text-anchor="middle" fill="#9A3412" font-size="10" font-weight="600">Protocolo</text>

  <text x="520" y="157" text-anchor="middle" fill="#9CA3AF" font-size="12">↓</text>

  <!-- Big BanzamIA box -->
  <rect x="390" y="162" width="260" height="60" rx="6" fill="#FFF7F0" stroke="#FED7AA" stroke-width="1.5"/>
  <rect x="390" y="162" width="260" height="60" rx="6" fill="#EA580C"/>
  <text x="520" y="183" text-anchor="middle" fill="white" font-size="11" font-weight="700">BanzamIA</text>
  <text x="520" y="199" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="8">Chat · Validator · Conformance · SDK · Trace</text>
  <text x="520" y="213" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="8">24 horas · Sem limite de escala</text>

  <text x="520" y="234" text-anchor="middle" fill="#9CA3AF" font-size="12">↓</text>

  <rect x="390" y="240" width="260" height="28" rx="6" fill="#FFF7F0" stroke="#FED7AA" stroke-width="1"/>
  <text x="520" y="258" text-anchor="middle" fill="#9A3412" font-size="10" font-weight="600">Operador</text>

  <text x="520" y="278" text-anchor="middle" fill="#166534" font-size="8" font-style="italic">✓ Escala autónoma e ilimitada</text>
  <text x="520" y="291" text-anchor="middle" fill="#166534" font-size="8" font-style="italic">Custo sub-linear · Velocidade máxima</text>

  <!-- Caption -->
  <text x="350" y="310" text-anchor="middle" fill="#9B8E8C" font-size="9">Sem BanzamIA: o protocolo depende de humanos para se explicar. Com BanzamIA: o protocolo explica-se a si mesmo.</text>
</svg>
