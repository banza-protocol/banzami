<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 490" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <linearGradient id="goG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EDF7ED"/>
      <stop offset="100%" style="stop-color:#D4EDD4"/>
    </linearGradient>
    <linearGradient id="rustG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF9F5"/>
      <stop offset="100%" style="stop-color:#F5EDE8"/>
    </linearGradient>
    <linearGradient id="pgG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EEF2FF"/>
      <stop offset="100%" style="stop-color:#DDE3FF"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000014"/>
    </filter>
  </defs>

  <rect width="700" height="490" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="22" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="50" text-anchor="middle" fill="white" font-size="16" font-weight="700">Topologia de Serviços</text>

  <!-- Internet node -->
  <rect x="260" y="84" width="180" height="38" rx="8" fill="white" stroke="#D4C9C7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="108" text-anchor="middle" fill="#6B6265" font-size="12" font-weight="600">Internet</text>

  <!-- Arrow 1 -->
  <line x1="350" y1="122" x2="350" y2="148" stroke="#C4B8B6" stroke-width="2"/>
  <polygon points="344,145 356,145 350,155" fill="#C4B8B6"/>

  <!-- Go Services box -->
  <rect x="30" y="155" width="640" height="126" rx="12" fill="url(#goG)" stroke="#3D8A3D" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="175" text-anchor="middle" fill="#1E661E" font-size="10" font-weight="700" letter-spacing="1">CAMADA DE SERVIÇOS GO</text>

  <!-- api-gateway -->
  <rect x="48" y="183" width="186" height="84" rx="8" fill="white" stroke="#D4C9C7" stroke-width="1"/>
  <text x="141" y="200" text-anchor="middle" fill="#1A1A1A" font-size="10" font-weight="700">api-gateway :8080</text>
  <line x1="48" y1="207" x2="234" y2="207" stroke="#F0E8E6" stroke-width="1"/>
  <text x="141" y="222" text-anchor="middle" fill="#6B6265" font-size="9">Auth JWT</text>
  <text x="141" y="236" text-anchor="middle" fill="#6B6265" font-size="9">Rate limiting</text>
  <text x="141" y="250" text-anchor="middle" fill="#6B6265" font-size="9">Idempotência</text>
  <text x="141" y="264" text-anchor="middle" fill="#6B6265" font-size="9">Webhooks</text>

  <!-- public-api -->
  <rect x="257" y="183" width="186" height="84" rx="8" fill="white" stroke="#D4C9C7" stroke-width="1"/>
  <text x="350" y="200" text-anchor="middle" fill="#1A1A1A" font-size="10" font-weight="700">public-api :8083</text>
  <line x1="257" y1="207" x2="443" y2="207" stroke="#F0E8E6" stroke-width="1"/>
  <text x="350" y="222" text-anchor="middle" fill="#6B6265" font-size="9">Ops consumidor</text>
  <text x="350" y="236" text-anchor="middle" fill="#6B6265" font-size="9">Sandbox API</text>
  <text x="350" y="250" text-anchor="middle" fill="#6B6265" font-size="9">Push notificações</text>

  <!-- admin-api -->
  <rect x="466" y="183" width="186" height="84" rx="8" fill="white" stroke="#D4C9C7" stroke-width="1"/>
  <text x="559" y="200" text-anchor="middle" fill="#1A1A1A" font-size="10" font-weight="700">admin-api :8082</text>
  <line x1="466" y1="207" x2="652" y2="207" stroke="#F0E8E6" stroke-width="1"/>
  <text x="559" y="222" text-anchor="middle" fill="#6B6265" font-size="9">Ops admin</text>
  <text x="559" y="236" text-anchor="middle" fill="#6B6265" font-size="9">Gestão merchant</text>
  <text x="559" y="250" text-anchor="middle" fill="#6B6265" font-size="9">Relatórios</text>

  <!-- Arrow 2 + label -->
  <line x1="350" y1="281" x2="350" y2="307" stroke="#C4B8B6" stroke-width="2"/>
  <polygon points="344,304 356,304 350,314" fill="#C4B8B6"/>
  <text x="380" y="300" fill="#9B8E8C" font-size="9">HTTP (loopback)</text>

  <!-- Rust Core box -->
  <rect x="30" y="314" width="640" height="72" rx="12" fill="url(#rustG)" stroke="#DBBCB2" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="336" text-anchor="middle" fill="#990011" font-size="10" font-weight="700" letter-spacing="1">RUST CORE API — interno, nunca exposto</text>
  <text x="350" y="353" text-anchor="middle" fill="#6B6265" font-size="9">18 crates · único escritor das tabelas financeiras</text>
  <text x="350" y="369" text-anchor="middle" fill="#9B8E8C" font-size="9">ledger · wallets · settlement · qr · payment-links · risk · compliance · routing</text>

  <!-- Arrow 3 -->
  <line x1="350" y1="386" x2="350" y2="410" stroke="#C4B8B6" stroke-width="2"/>
  <polygon points="344,407 356,407 350,417" fill="#C4B8B6"/>

  <!-- PostgreSQL box -->
  <rect x="30" y="417" width="640" height="50" rx="12" fill="url(#pgG)" stroke="#9BA8D4" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="439" text-anchor="middle" fill="#2A3A8C" font-size="11" font-weight="700" letter-spacing="0.5">POSTGRESQL</text>
  <text x="350" y="456" text-anchor="middle" fill="#5B6C9A" font-size="9">única fonte de verdade financeira · ACID · constraints de esquema</text>
</svg>
