<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 364" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/>
    </filter>
  </defs>

  <rect width="700" height="364" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="22" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="47" text-anchor="middle" fill="white" font-size="14" font-weight="700">A Economia de Adopção do Protocolo</text>
  <text x="350" y="61" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">ANTES E DEPOIS DO BANZAI</text>

  <!-- LEFT COLUMN: SEM BANZAI -->
  <rect x="30" y="80" width="305" height="252" rx="12" fill="white" stroke="#DBBCB2" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="30" y="80" width="305" height="36" rx="12" fill="#7F1D1D"/>
  <rect x="30" y="102" width="305" height="14" fill="#7F1D1D"/>
  <text x="182" y="103" text-anchor="middle" fill="white" font-size="11" font-weight="700" letter-spacing="1">SEM BANZAI</text>

  <!-- Left steps -->
  <rect x="46" y="126" width="273" height="34" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="182" y="147" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">Novos Operadores chegam</text>

  <text x="182" y="167" text-anchor="middle" fill="#9CA3AF" font-size="12">↓</text>

  <rect x="46" y="172" width="273" height="34" rx="7" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="182" y="193" text-anchor="middle" fill="#991B1B" font-size="10" font-weight="600">+ Pedidos de suporte</text>

  <text x="182" y="213" text-anchor="middle" fill="#9CA3AF" font-size="12">↓</text>

  <rect x="46" y="218" width="273" height="34" rx="7" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="182" y="239" text-anchor="middle" fill="#991B1B" font-size="10" font-weight="600">+ Carga de certificação</text>

  <text x="182" y="259" text-anchor="middle" fill="#9CA3AF" font-size="12">↓</text>

  <rect x="46" y="264" width="273" height="34" rx="7" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="182" y="285" text-anchor="middle" fill="#991B1B" font-size="10" font-weight="600">+ Documentação manual necessária</text>

  <!-- Left outcome -->
  <rect x="46" y="304" width="273" height="22" rx="7" fill="#7F1D1D"/>
  <text x="182" y="319" text-anchor="middle" fill="white" font-size="10" font-weight="700">Crescimento cria custo</text>

  <!-- RIGHT COLUMN: COM BANZAI -->
  <rect x="365" y="80" width="305" height="252" rx="12" fill="white" stroke="#FED7AA" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="365" y="80" width="305" height="36" rx="12" fill="#EA580C"/>
  <rect x="365" y="102" width="305" height="14" fill="#EA580C"/>
  <text x="517" y="103" text-anchor="middle" fill="white" font-size="11" font-weight="700" letter-spacing="1">COM BANZAI</text>

  <!-- Right steps -->
  <rect x="381" y="126" width="273" height="34" rx="7" fill="#FFF7F0" stroke="#FED7AA" stroke-width="1"/>
  <text x="517" y="147" text-anchor="middle" fill="#9A3412" font-size="10" font-weight="600">Novos Operadores chegam</text>

  <text x="517" y="167" text-anchor="middle" fill="#9CA3AF" font-size="12">↓</text>

  <rect x="381" y="172" width="273" height="34" rx="7" fill="#EDF7ED" stroke="#86EFAC" stroke-width="1"/>
  <text x="517" y="193" text-anchor="middle" fill="#166534" font-size="10" font-weight="600">Adopção self-service via BanzAI</text>

  <text x="517" y="213" text-anchor="middle" fill="#9CA3AF" font-size="12">↓</text>

  <rect x="381" y="218" width="273" height="34" rx="7" fill="#EDF7ED" stroke="#86EFAC" stroke-width="1"/>
  <text x="517" y="239" text-anchor="middle" fill="#166534" font-size="10" font-weight="600">RAG melhora com o crescimento</text>

  <text x="517" y="259" text-anchor="middle" fill="#9CA3AF" font-size="12">↓</text>

  <rect x="381" y="264" width="273" height="34" rx="7" fill="#EDF7ED" stroke="#86EFAC" stroke-width="1"/>
  <text x="517" y="285" text-anchor="middle" fill="#166534" font-size="10" font-weight="600">Protocolo torna-se mais acessível</text>

  <!-- Right outcome -->
  <rect x="381" y="304" width="273" height="22" rx="7" fill="#EA580C"/>
  <text x="517" y="319" text-anchor="middle" fill="white" font-size="10" font-weight="700">Crescimento cria valor</text>

  <!-- Caption -->
  <text x="350" y="352" text-anchor="middle" fill="#9B8E8C" font-size="9">Sem BanzAI: o crescimento do ecossistema cria custo linear. Com BanzAI: o crescimento cria valor composto.</text>
</svg>
