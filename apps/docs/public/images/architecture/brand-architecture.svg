<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <linearGradient id="bzG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF9F5"/>
      <stop offset="100%" style="stop-color:#F5EDE8"/>
    </linearGradient>
    <linearGradient id="iaG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF9EC"/>
      <stop offset="100%" style="stop-color:#FEF0C7"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000014"/>
    </filter>
  </defs>

  <rect width="700" height="440" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="22" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="50" text-anchor="middle" fill="white" font-size="16" font-weight="700">Arquitectura de Dois Níveis</text>

  <!-- Banza root -->
  <rect x="220" y="84" width="260" height="56" rx="12" fill="#990011" filter="url(#sh)"/>
  <text x="350" y="108" text-anchor="middle" fill="white" font-size="14" font-weight="700">BANZAMI</text>
  <text x="350" y="127" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="9">organização · protocolo · ecossistema</text>

  <!-- Trunk line down -->
  <line x1="350" y1="140" x2="350" y2="166" stroke="#C4B8B6" stroke-width="2"/>
  <!-- Branch left to Banzami -->
  <line x1="180" y1="166" x2="350" y2="166" stroke="#C4B8B6" stroke-width="2"/>
  <!-- Branch right to BanzAI -->
  <line x1="350" y1="166" x2="530" y2="166" stroke="#C4B8B6" stroke-width="2"/>
  <!-- Drop to Banzami -->
  <line x1="180" y1="166" x2="180" y2="190" stroke="#C4B8B6" stroke-width="2"/>
  <!-- Drop to BanzAI -->
  <line x1="530" y1="166" x2="530" y2="190" stroke="#C4B8B6" stroke-width="2"/>

  <!-- Banzami column -->
  <rect x="60" y="190" width="240" height="56" rx="10" fill="url(#bzG)" stroke="#DBBCB2" stroke-width="1.5" filter="url(#sh)"/>
  <text x="180" y="214" text-anchor="middle" fill="#990011" font-size="13" font-weight="700">Banzami</text>
  <text x="180" y="232" text-anchor="middle" fill="#6B6265" font-size="9">produto principal de pagamento</text>

  <!-- Banzami product tree -->
  <line x1="180" y1="246" x2="180" y2="268" stroke="#D4C9C7" stroke-width="1.5"/>

  <!-- Products grid under Banzami -->
  <rect x="60" y="268" width="240" height="142" rx="10" fill="white" stroke="#D4C9C7" stroke-width="1.5" filter="url(#sh)"/>
  <line x1="180" y1="268" x2="180" y2="290" stroke="#F0E8E6" stroke-width="1"/>
  <text x="180" y="287" text-anchor="middle" fill="#9B8E8C" font-size="8" font-weight="600" letter-spacing="0.5">PRODUTOS</text>

  <text x="85" y="307" fill="#1A1A1A" font-size="9" font-weight="600">Banzami Wallet</text>
  <text x="85" y="323" fill="#6B6265" font-size="8">carteira do consumidor</text>
  <text x="85" y="341" fill="#1A1A1A" font-size="9" font-weight="600">Banzami Business</text>
  <text x="85" y="357" fill="#6B6265" font-size="8">gestão de comerciantes</text>
  <text x="85" y="375" fill="#1A1A1A" font-size="9" font-weight="600">Banzami QR · Checkout · Pay Links</text>
  <text x="85" y="391" fill="#6B6265" font-size="8">pagamento sem hardware</text>
  <text x="85" y="407" fill="#1A1A1A" font-size="9" font-weight="600">Banzami SDK · API · @banza</text>

  <!-- BanzAI column -->
  <rect x="410" y="190" width="240" height="56" rx="10" fill="url(#iaG)" stroke="#D4A800" stroke-width="1.5" filter="url(#sh)"/>
  <text x="530" y="214" text-anchor="middle" fill="#7A5800" font-size="13" font-weight="700">BanzAI</text>
  <text x="530" y="232" text-anchor="middle" fill="#6B6265" font-size="9">Sistema Operativo de Protocolo</text>

  <line x1="530" y1="246" x2="530" y2="268" stroke="#D4C9C7" stroke-width="1.5"/>

  <!-- BanzAI features -->
  <rect x="410" y="268" width="240" height="142" rx="10" fill="white" stroke="#D4C9C7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="530" y="287" text-anchor="middle" fill="#9B8E8C" font-size="8" font-weight="600" letter-spacing="0.5">MÓDULOS</text>

  <text x="430" y="307" fill="#1A1A1A" font-size="9" font-weight="600">Chat — Q&amp;A do protocolo</text>
  <text x="430" y="323" fill="#1A1A1A" font-size="9" font-weight="600">Operator Builder</text>
  <text x="430" y="339" fill="#6B6265" font-size="8">criação de manifesto</text>
  <text x="430" y="357" fill="#1A1A1A" font-size="9" font-weight="600">Conformance · Validador</text>
  <text x="430" y="373" fill="#1A1A1A" font-size="9" font-weight="600">Trace Explainer</text>
  <text x="430" y="389" fill="#1A1A1A" font-size="9" font-weight="600">SDK Assistant</text>
  <text x="430" y="405" fill="#1A1A1A" font-size="9" font-weight="600">RFC/ADR Explorer · Knowledge</text>
</svg>
