<!--
  id:        SVG-P-001
  diagram:   Protocol Overview
  version:   1.0
  source:    BANZA_REFERENCE.md §1 Introduction, ADR-025
  updated:   2026-06-01
  author:    BANZA Protocol
  style:     protocol
-->
<svg viewBox="0 0 800 570" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P001 desc-P001"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">

  <title id="title-P001">BANZA — Open Financial Infrastructure Protocol Overview</title>
  <desc id="desc-P001">Overview of BANZA as an open financial infrastructure protocol showing the four protocol properties (public rules, open certification, verifiable invariants, federation) and the ecosystem hierarchy (BANZA, BanzAI, Operators).</desc>

  <defs>
    <linearGradient id="hG-P001" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#990011"/>
      <stop offset="100%" stop-color="#B11226"/>
    </linearGradient>
    <filter id="sh-P001" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="570" fill="#FCF6F5"/>

  <!-- Header bar -->
  <rect x="20" y="16" width="760" height="62" rx="8" fill="url(#hG-P001)" filter="url(#sh-P001)"/>
  <text x="400" y="44" text-anchor="middle" fill="white" font-size="18" font-weight="700" letter-spacing="0.5">BANZA</text>
  <text x="400" y="65" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11" letter-spacing="1.2">OPEN FINANCIAL INFRASTRUCTURE PROTOCOL</text>

  <!-- Section label -->
  <text x="30" y="102" fill="#6B6265" font-size="10" font-weight="600" letter-spacing="0.8">FOUR PROTOCOL PROPERTIES — BANZA_REFERENCE.md §1</text>

  <!-- Property 1: Public Rules -->
  <rect x="20" y="112" width="372" height="112" rx="7" fill="white" stroke="#D4C9C7" stroke-width="1" filter="url(#sh-P001)"/>
  <rect x="20" y="112" width="5" height="112" rx="3" fill="#990011"/>
  <text x="38" y="134" fill="#1A1A1A" font-size="13" font-weight="700">Public Rules</text>
  <text x="38" y="154" fill="#6B6265" font-size="11">The specification — RFCs, ADRs, conformance</text>
  <text x="38" y="169" fill="#6B6265" font-size="11">suite — is publicly available. No documentation</text>
  <text x="38" y="184" fill="#6B6265" font-size="11">is behind an NDA. Any entity can implement.</text>
  <text x="38" y="216" fill="#990011" font-size="10" font-weight="600" letter-spacing="0.3">Protocol rules are open to all operators</text>

  <!-- Property 2: Open Certification -->
  <rect x="408" y="112" width="372" height="112" rx="7" fill="white" stroke="#D4C9C7" stroke-width="1" filter="url(#sh-P001)"/>
  <rect x="408" y="112" width="5" height="112" rx="3" fill="#990011"/>
  <text x="426" y="134" fill="#1A1A1A" font-size="13" font-weight="700">Open Certification</text>
  <text x="426" y="154" fill="#6B6265" font-size="11">Any legal entity that passes the conformance</text>
  <text x="426" y="169" fill="#6B6265" font-size="11">suite becomes a certified BANZA operator. No</text>
  <text x="426" y="184" fill="#6B6265" font-size="11">bilateral agreement. No institutional approval.</text>
  <text x="426" y="216" fill="#990011" font-size="10" font-weight="600" letter-spacing="0.3">Certification is open to all qualifying entities</text>

  <!-- Property 3: Verifiable Invariants -->
  <rect x="20" y="238" width="372" height="112" rx="7" fill="white" stroke="#D4C9C7" stroke-width="1" filter="url(#sh-P001)"/>
  <rect x="20" y="238" width="5" height="112" rx="3" fill="#990011"/>
  <text x="38" y="260" fill="#1A1A1A" font-size="13" font-weight="700">Verifiable Invariants</text>
  <text x="38" y="280" fill="#6B6265" font-size="11">Financial properties are enforced by the Rust</text>
  <text x="38" y="295" fill="#6B6265" font-size="11">kernel and verifiable by any independent auditor.</text>
  <text x="38" y="310" fill="#6B6265" font-size="11">INV-LEDGER · INV-WALLET · INV-STL · INV-FED</text>
  <text x="38" y="342" fill="#990011" font-size="10" font-weight="600" letter-spacing="0.3">Correctness is mathematical, not contractual</text>

  <!-- Property 4: Federation -->
  <rect x="408" y="238" width="372" height="112" rx="7" fill="white" stroke="#D4C9C7" stroke-width="1" filter="url(#sh-P001)"/>
  <rect x="408" y="238" width="5" height="112" rx="3" fill="#990011"/>
  <text x="426" y="260" fill="#1A1A1A" font-size="13" font-weight="700">Federation</text>
  <text x="426" y="280" fill="#6B6265" font-size="11">Certified operators route payments between</text>
  <text x="426" y="295" fill="#6B6265" font-size="11">each other without bilateral agreements. Trust is</text>
  <text x="426" y="310" fill="#6B6265" font-size="11">cryptographic. Settlement is protocol-defined.</text>
  <text x="426" y="342" fill="#990011" font-size="10" font-weight="600" letter-spacing="0.3">STATUS: COMPLETE — ADR-026 · 79/79 tests</text>

  <!-- Ecosystem hierarchy section -->
  <rect x="20" y="368" width="760" height="168" rx="8" fill="#EAE0DF" stroke="#D4C9C7" stroke-width="1"/>
  <text x="36" y="390" fill="#1A1A1A" font-size="11" font-weight="700" letter-spacing="0.8">ECOSYSTEM HIERARCHY — ADR-025</text>
  <text x="36" y="406" fill="#6B6265" font-size="10">Dependencies flow up. BANZA and BanzAI never depend on operators. This direction is permanent and non-negotiable.</text>

  <!-- Operators box -->
  <rect x="36" y="416" width="728" height="32" rx="5" fill="white" stroke="#D4C9C7" stroke-width="1"/>
  <rect x="36" y="416" width="5" height="32" rx="3" fill="#15803D"/>
  <text x="56" y="437" fill="#15803D" font-size="12" font-weight="700">Operators</text>
  <text x="140" y="437" fill="#6B6265" font-size="11">— certified entities that implement the protocol · process payments · settle obligations</text>

  <!-- Depend on arrow -->
  <text x="400" y="461" text-anchor="middle" fill="#6B6265" font-size="11">↑  depend on</text>

  <!-- BanzAI box -->
  <rect x="36" y="466" width="728" height="32" rx="5" fill="white" stroke="#D4C9C7" stroke-width="1"/>
  <rect x="36" y="466" width="5" height="32" rx="3" fill="#1D4ED8"/>
  <text x="56" y="487" fill="#1D4ED8" font-size="12" font-weight="700">BanzAI</text>
  <text x="112" y="487" fill="#6B6265" font-size="11">— Protocol Operating System · evaluates readiness · verifies trust · NEVER certifies · NEVER defines rules</text>

  <!-- Depend on arrow -->
  <text x="400" y="511" text-anchor="middle" fill="#6B6265" font-size="11">↑  depend on</text>

  <!-- BANZA box -->
  <rect x="36" y="516" width="728" height="32" rx="5" fill="url(#hG-P001)"/>
  <text x="56" y="537" fill="white" font-size="12" font-weight="700">BANZA</text>
  <text x="110" y="537" fill="rgba(255,255,255,0.88)" font-size="11">— open protocol · issues certificates · defines invariants · owns conformance · no operator above it</text>

  <!-- Footer -->
  <text x="400" y="558" text-anchor="middle" fill="#6B6265" font-size="10">SVG-P-001 · v1.0 · BANZA_REFERENCE.md §1 · ADR-025 · 2026-06-01</text>

</svg>
