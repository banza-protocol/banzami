<?xml version="1.0" encoding="UTF-8"?>
<!--
  id:        SVG-P-010
  diagram:   Inter-Operator Payment Flow
  version:   1.0
  source:    BANZA_REFERENCE.md §5 Federation (step-by-step example)
  updated:   2026-06-01
  author:    BANZA Protocol
  style:     protocol
-->
<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P010 desc-P010"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">

  <title id="title-P010">BANZA Inter-Operator Payment Flow — Cross-Operator Payment Lifecycle</title>
  <desc id="desc-P010">The seven-step cross-operator payment flow showing Consumer Ana (Operator A) paying Merchant Bento (Operator B) 2,000 AOA. Shows trust verification, routing request, credit execution, atomic debit and obligation recording, and end-of-cycle bilateral settlement. The trace_id tr-xyz links all artifacts across both operators.</desc>

  <defs>
    <linearGradient id="hG-P010" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#990011"/>
      <stop offset="100%" stop-color="#B11226"/>
    </linearGradient>
    <linearGradient id="opAGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#DDE3FF"/>
    </linearGradient>
    <linearGradient id="opBGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <filter id="sh-P010" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000014"/>
    </filter>
    <marker id="arr-P010" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B6265"/>
    </marker>
    <marker id="arr-right" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3730A3"/>
    </marker>
    <marker id="arr-left" viewBox="0 0 10 10" refX="0" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#15803D"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="900" height="640" fill="#FCF6F5"/>

  <!-- Header -->
  <rect x="16" y="12" width="868" height="54" rx="8" fill="url(#hG-P010)" filter="url(#sh-P010)"/>
  <text x="450" y="38" text-anchor="middle" fill="white" font-size="15" font-weight="700">Inter-Operator Payment Flow</text>
  <text x="450" y="56" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="10" letter-spacing="0.8">CONSUMER ANA (OPERATOR A) → MERCHANT BENTO (OPERATOR B) · 2,000 AOA · BANZA_REFERENCE.md §5</text>

  <!-- Column headers -->
  <rect x="16" y="78" width="270" height="34" rx="5" fill="url(#opAGrad)" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="151" y="100" text-anchor="middle" fill="#1D4ED8" font-size="12" font-weight="700">Operator A</text>

  <rect x="316" y="78" width="268" height="34" rx="5" fill="#EAE0DF" stroke="#D4C9C7" stroke-width="1"/>
  <text x="450" y="100" text-anchor="middle" fill="#6B6265" font-size="11" font-weight="600">BANZA Protocol</text>

  <rect x="614" y="78" width="270" height="34" rx="5" fill="url(#opBGrad)" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="749" y="100" text-anchor="middle" fill="#15803D" font-size="12" font-weight="700">Operator B</text>

  <!-- Vertical lane lines -->
  <line x1="151" y1="112" x2="151" y2="570" stroke="#A5B4FC" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="450" y1="112" x2="450" y2="570" stroke="#D4C9C7" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="749" y1="112" x2="749" y2="570" stroke="#86EFAC" stroke-width="0.5" stroke-dasharray="4,3"/>

  <!-- Step 1 -->
  <rect x="16" y="118" width="270" height="54" rx="5" fill="url(#opAGrad)" stroke="#C7D2FE" stroke-width="1" filter="url(#sh-P010)"/>
  <text x="26" y="136" fill="#3730A3" font-size="10" font-weight="700">① Ana initiates payment</text>
  <text x="26" y="151" fill="#6B6265" font-size="10">Operator A identifies that Bento</text>
  <text x="26" y="163" fill="#6B6265" font-size="10">is on Operator B.</text>

  <!-- Step 1 arrow to protocol -->
  <line x1="286" y1="145" x2="314" y2="145" stroke="#3730A3" stroke-width="1.5" marker-end="url(#arr-right)"/>

  <!-- Step 2: Trust verification in protocol lane -->
  <rect x="316" y="118" width="268" height="54" rx="5" fill="#EAE0DF" stroke="#D4C9C7" stroke-width="1" filter="url(#sh-P010)"/>
  <text x="450" y="136" text-anchor="middle" fill="#374151" font-size="10" font-weight="700">② Trust verification</text>
  <text x="450" y="151" text-anchor="middle" fill="#6B6265" font-size="10">9-step protocol · certificate verified</text>
  <text x="450" y="163" text-anchor="middle" fill="#6B6265" font-size="10">Operator B not revoked in BRL</text>

  <!-- Step 2 result arrow to OpA -->
  <line x1="316" y1="160" x2="288" y2="160" stroke="#15803D" stroke-width="1.5" marker-end="url(#arr-left)"/>
  <text x="302" y="156" text-anchor="middle" fill="#15803D" font-size="8" font-weight="600">valid</text>

  <!-- Down arrow in OpA -->
  <line x1="151" y1="172" x2="151" y2="182" stroke="#6B6265" stroke-width="1.5" marker-end="url(#arr-P010)"/>

  <!-- Step 3: Routing request -->
  <rect x="16" y="184" width="270" height="58" rx="5" fill="url(#opAGrad)" stroke="#C7D2FE" stroke-width="1" filter="url(#sh-P010)"/>
  <text x="26" y="202" fill="#3730A3" font-size="10" font-weight="700">③ Routing request (signed)</text>
  <text x="26" y="217" fill="#6B6265" font-size="10">"Request rr-abc: pay 2,000 AOA</text>
  <text x="26" y="229" fill="#6B6265" font-size="10"> to Bento (trace: tr-xyz)"</text>
  <text x="26" y="240" fill="#3730A3" font-size="9">Signed with Operator A private key</text>

  <!-- Arrow from OpA to OpB -->
  <line x1="286" y1="213" x2="612" y2="213" stroke="#3730A3" stroke-width="1.5" marker-end="url(#arr-right)"/>
  <rect x="350" y="204" width="200" height="16" rx="3" fill="#FCF6F5"/>
  <text x="450" y="216" text-anchor="middle" fill="#3730A3" font-size="9" font-style="italic">POST /federation/route</text>

  <!-- Step 4: OpB execution -->
  <rect x="614" y="184" width="270" height="68" rx="5" fill="url(#opBGrad)" stroke="#86EFAC" stroke-width="1" filter="url(#sh-P010)"/>
  <text x="624" y="202" fill="#15803D" font-size="10" font-weight="700">④ Verify A · Credit Bento</text>
  <text x="624" y="217" fill="#6B6265" font-size="10">Verifies Operator A's certificate.</text>
  <text x="624" y="229" fill="#6B6265" font-size="10">Identifies Bento's wallet.</text>
  <text x="624" y="241" fill="#6B6265" font-size="10">Credits 2,000 AOA. Immediately.</text>
  <text x="624" y="251" fill="#15803D" font-size="9" font-weight="600">Responds: "Accepted. itx-def"</text>

  <!-- Arrow from OpB back to OpA -->
  <line x1="614" y1="234" x2="288" y2="234" stroke="#15803D" stroke-width="1.5" marker-end="url(#arr-left)"/>
  <rect x="350" y="225" width="210" height="16" rx="3" fill="#FCF6F5"/>
  <text x="455" y="237" text-anchor="middle" fill="#15803D" font-size="9" font-style="italic">200 OK · "accepted" · trace: tr-xyz</text>

  <!-- Bento notification -->
  <rect x="614" y="256" width="270" height="24" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="749" y="273" text-anchor="middle" fill="#15803D" font-size="10" font-weight="600">Bento: +2,000 AOA ·  notification sent</text>

  <!-- Down arrow in OpA -->
  <line x1="151" y1="242" x2="151" y2="288" stroke="#6B6265" stroke-width="1.5" marker-end="url(#arr-P010)"/>

  <!-- Step 5: Atomic operation in OpA -->
  <rect x="16" y="290" width="270" height="62" rx="5" fill="url(#opAGrad)" stroke="#C7D2FE" stroke-width="1" filter="url(#sh-P010)"/>
  <text x="26" y="308" fill="#3730A3" font-size="10" font-weight="700">⑤ Atomic debit + obligation</text>
  <text x="26" y="323" fill="#6B6265" font-size="10">DEBIT Ana: −2,000 AOA</text>
  <text x="26" y="335" fill="#6B6265" font-size="10">RECORD obligation: "Operator A owes</text>
  <text x="26" y="347" fill="#6B6265" font-size="10"> 2,000 AOA to Operator B (rr-abc)"</text>
  <text x="260" y="327" text-anchor="end" fill="#990011" font-size="9" font-weight="600">ATOMIC</text>

  <!-- Obligation arrow to protocol lane -->
  <line x1="286" y1="335" x2="314" y2="335" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-right)"/>
  <rect x="316" y="314" width="268" height="44" rx="5" fill="#FEF9F5" stroke="#F5E0C8" stroke-width="1" filter="url(#sh-P010)"/>
  <text x="450" y="332" text-anchor="middle" fill="#D97706" font-size="10" font-weight="700">Obligation recorded</text>
  <text x="450" y="347" text-anchor="middle" fill="#6B6265" font-size="10">pending → in-compensation → settled</text>
  <text x="450" y="357" text-anchor="middle" fill="#6B6265" font-size="9">INV-FED-002 · INV-FED-005</text>

  <!-- Down arrow in OpA -->
  <line x1="151" y1="352" x2="151" y2="368" stroke="#6B6265" stroke-width="1.5" marker-end="url(#arr-P010)"/>

  <!-- Step 6: Confirmations -->
  <rect x="16" y="370" width="270" height="38" rx="5" fill="url(#opAGrad)" stroke="#C7D2FE" stroke-width="1" filter="url(#sh-P010)"/>
  <text x="26" y="387" fill="#3730A3" font-size="10" font-weight="700">⑥ Ana: −2,000 AOA · confirmed</text>
  <text x="26" y="401" fill="#6B6265" font-size="10">Notification sent. Payment complete.</text>

  <!-- trace_id banner -->
  <rect x="16" y="420" width="868" height="28" rx="5" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="450" y="439" text-anchor="middle" fill="#3730A3" font-size="11">trace_id: tr-xyz — appears on every artifact across both operators · reconstructible by any auditor independently</text>

  <!-- Step 7: Settlement -->
  <rect x="16" y="460" width="868" height="80" rx="7" fill="#EAE0DF" stroke="#D4C9C7" stroke-width="1" filter="url(#sh-P010)"/>
  <text x="30" y="480" fill="#1A1A1A" font-size="11" font-weight="700">⑦ End-of-cycle settlement (every 24h) — bilateral netting</text>
  <text x="30" y="498" fill="#6B6265" font-size="10">Both operators independently calculate net position. Example: Operator A → B: 4,210,000 AOA gross · Operator B → A: 1,590,000 AOA gross</text>
  <text x="30" y="514" fill="#6B6265" font-size="10">Net position: 2,620,000 AOA (Operator A owes Operator B). Bank transfers executed: 1 (not one per payment).</text>
  <text x="30" y="530" fill="#6B6265" font-size="10">Both must agree on net amount. If positions diverge, settlement is suspended until discrepancy is resolved.</text>
  <text x="838" y="514" text-anchor="end" fill="#374151" font-size="9" font-weight="600">INV-FED-RECON-001</text>

  <!-- Footer -->
  <text x="450" y="568" text-anchor="middle" fill="#6B6265" font-size="10">SVG-P-010 · v1.0 · BANZA_REFERENCE.md §5 · ADR-026 · 2026-06-01</text>

  <!-- Bottom invariant note -->
  <line x1="16" y1="555" x2="884" y2="555" stroke="#D4C9C7" stroke-width="0.5"/>
  <text x="450" y="568" text-anchor="middle" fill="#6B6265" font-size="10">SVG-P-010 · v1.0 · BANZA_REFERENCE.md §5 · ADR-026 · trace_id: INV-FED-001 · 2026-06-01</text>

</svg>
