<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P021 desc-P021"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">

  <title id="title-P021">BanzAI Positioning — BANZA Certifies, BanzAI Evaluates</title>
  <desc id="desc-P021">The frozen authority boundary between BANZA and BanzAI from BANZA_REFERENCE.md §7. BANZA runs the authoritative conformance suite, issues production certificates, signs Key Manifests and BRLs, and holds production private keys. BanzAI analyzes certification readiness, guides operators, simulates protocol scenarios, explains rules, and assesses federation compatibility. This boundary is an architectural invariant.</desc>

  <defs>
    <linearGradient id="hG-P021" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#990011"/>
      <stop offset="100%" stop-color="#B11226"/>
    </linearGradient>
    <linearGradient id="banzaHdr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="banzaiHdr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="sh-P021" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="900" height="620" fill="#FCF6F5"/>

  <!-- Header -->
  <rect x="16" y="12" width="868" height="54" rx="8" fill="url(#hG-P021)" filter="url(#sh-P021)"/>
  <text x="450" y="38" text-anchor="middle" fill="white" font-size="15" font-weight="700">BanzAI Positioning — Authority Boundary</text>
  <text x="450" y="56" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="10" letter-spacing="0.8">BANZA CERTIFIES · BANZAI EVALUATES · THIS BOUNDARY IS AN ARCHITECTURAL INVARIANT</text>

  <!-- Two-column authority boundary -->
  <!-- BANZA column header -->
  <rect x="16" y="78" width="420" height="42" rx="6" fill="url(#banzaHdr)" filter="url(#sh-P021)"/>
  <text x="226" y="98" text-anchor="middle" fill="white" font-size="14" font-weight="700">BANZA</text>
  <text x="226" y="113" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="10" letter-spacing="0.5">Protocol Authority — Defines · Certifies · Issues</text>

  <!-- BanzAI column header -->
  <rect x="464" y="78" width="420" height="42" rx="6" fill="url(#banzaiHdr)" filter="url(#sh-P021)"/>
  <text x="674" y="98" text-anchor="middle" fill="white" font-size="14" font-weight="700">BanzAI</text>
  <text x="674" y="113" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="10" letter-spacing="0.5">Protocol Operating System — Evaluates · Explains · Guides</text>

  <!-- Authority rows: y=128 to y=390 -->
  <!-- Row height: 36px, 8 rows -->

  <!-- Row labels on left (gray divider col removed — full-width rows) -->

  <!-- Row 1 -->
  <rect x="16" y="128" width="420" height="34" rx="3" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="226" y="144" text-anchor="middle" fill="#DC2626" font-size="11" font-weight="700">YES — Run authoritative conformance suite</text>
  <text x="226" y="157" text-anchor="middle" fill="#6B6265" font-size="9">Deterministic tests · not AI inference · results are binding</text>
  <rect x="464" y="128" width="420" height="34" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="674" y="150" text-anchor="middle" fill="#6B6265" font-size="11">No — cannot run the authoritative suite</text>

  <!-- Row 2 -->
  <rect x="16" y="166" width="420" height="34" rx="3" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="226" y="182" text-anchor="middle" fill="#DC2626" font-size="11" font-weight="700">YES — Issue production certificates</text>
  <text x="226" y="195" text-anchor="middle" fill="#6B6265" font-size="9">ed25519 signed · binding certification record · L0–L4</text>
  <rect x="464" y="166" width="420" height="34" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="674" y="188" text-anchor="middle" fill="#6B6265" font-size="11">No — cannot issue production certificates</text>

  <!-- Row 3 -->
  <rect x="16" y="204" width="420" height="34" rx="3" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="226" y="220" text-anchor="middle" fill="#DC2626" font-size="11" font-weight="700">YES — Sign Key Manifests and BRLs</text>
  <text x="226" y="233" text-anchor="middle" fill="#6B6265" font-size="9">Root signs manifests · issuing keys sign BRLs · ADR-029</text>
  <rect x="464" y="204" width="420" height="34" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="674" y="226" text-anchor="middle" fill="#6B6265" font-size="11">No — cannot sign manifests or BRLs</text>

  <!-- Row 4 -->
  <rect x="16" y="242" width="420" height="34" rx="3" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="226" y="258" text-anchor="middle" fill="#DC2626" font-size="11" font-weight="700">YES — Hold production private keys</text>
  <text x="226" y="271" text-anchor="middle" fill="#6B6265" font-size="9">Root key offline · issuing keys HSM-protected · INV-ROOT-001</text>
  <rect x="464" y="242" width="420" height="34" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="674" y="264" text-anchor="middle" fill="#6B6265" font-size="11">No — must not hold production private keys</text>

  <!-- Divider -->
  <line x1="16" y1="278" x2="884" y2="278" stroke="#D4C9C7" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Row 5 -->
  <rect x="16" y="282" width="420" height="34" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="226" y="304" text-anchor="middle" fill="#6B6265" font-size="11">No — does not analyze readiness (that's BanzAI)</text>
  <rect x="464" y="282" width="420" height="34" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="674" y="298" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="700">YES — Analyze certification readiness</text>
  <text x="674" y="311" text-anchor="middle" fill="#6B6265" font-size="9">Score 0–100 · gap assessment · effort estimate · not a certificate</text>

  <!-- Row 6 -->
  <rect x="16" y="320" width="420" height="34" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="226" y="342" text-anchor="middle" fill="#6B6265" font-size="11">No — does not guide operators</text>
  <rect x="464" y="320" width="420" height="34" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="674" y="336" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="700">YES — Guide operators toward compliance</text>
  <text x="674" y="349" text-anchor="middle" fill="#6B6265" font-size="9">Readiness roadmap · effort estimates · next actions</text>

  <!-- Row 7 -->
  <rect x="16" y="358" width="420" height="34" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="226" y="380" text-anchor="middle" fill="#6B6265" font-size="11">No — does not simulate or explain</text>
  <rect x="464" y="358" width="420" height="34" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="674" y="374" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="700">YES — Simulate protocol scenarios</text>
  <text x="674" y="387" text-anchor="middle" fill="#6B6265" font-size="9">Protocol Simulator · Digital Twin · Federation Intelligence</text>

  <!-- Row 8 -->
  <rect x="16" y="396" width="420" height="34" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="226" y="418" text-anchor="middle" fill="#6B6265" font-size="11">No — does not assess federation compatibility</text>
  <rect x="464" y="396" width="420" height="34" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="674" y="412" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="700">YES — Assess federation compatibility</text>
  <text x="674" y="425" text-anchor="middle" fill="#6B6265" font-size="9">Operator-to-operator compatibility · conflict detection · gap analysis</text>

  <!-- Invariant statement -->
  <rect x="16" y="440" width="868" height="30" rx="6" fill="#FEF9F5" stroke="#F5E0C8" stroke-width="1.5"/>
  <text x="450" y="460" text-anchor="middle" fill="#D97706" font-size="12" font-weight="700">When BanzAI says readiness is 87%, that is guidance — not a certificate. Only BANZA issues certificates.</text>

  <!-- Ecosystem chain -->
  <rect x="16" y="482" width="868" height="96" rx="7" fill="#EAE0DF" stroke="#D4C9C7" stroke-width="1"/>
  <text x="32" y="500" fill="#1A1A1A" font-size="11" font-weight="700" letter-spacing="0.5">ECOSYSTEM DEPENDENCY — BANZA_REFERENCE.md §7</text>

  <rect x="32" y="508" width="828" height="26" rx="4" fill="url(#hG-P021)"/>
  <text x="446" y="526" text-anchor="middle" fill="white" font-size="11" font-weight="600">BANZA (Protocol Authority) — issues certificates · maintains BRL · approves certification · defines rules</text>

  <text x="446" y="545" text-anchor="middle" fill="#6B6265" font-size="10">↓ evaluates readiness · verifies trust assertions · audits traces · NEVER decides</text>

  <rect x="32" y="548" width="828" height="26" rx="4" fill="url(#banzaiHdr)"/>
  <text x="446" y="566" text-anchor="middle" fill="white" font-size="11" font-weight="600">BanzAI (Protocol OS) — evaluates readiness · guides operators · simulates · explains · NEVER certifies</text>

  <!-- Footer -->
  <text x="450" y="610" text-anchor="middle" fill="#6B6265" font-size="10">SVG-P-021 · v1.0 · BANZA_REFERENCE.md §7 · BANZA_VALIDATION_STUDIO_DECOUPLING_REPORT.md · 2026-06-01</text>

</svg>
