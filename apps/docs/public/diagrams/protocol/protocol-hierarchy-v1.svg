<?xml version="1.0" encoding="UTF-8"?>
<!--
  id:        SVG-P-002
  diagram:   Protocol Hierarchy
  version:   1.0
  source:    ADR-025 (ecosystem naming and dependency graph), ADR-018, ADR-019
  updated:   2026-06-01
  author:    BANZA Protocol
  style:     protocol
-->
<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P002 desc-P002"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">

  <title id="title-P002">BANZA Protocol Hierarchy — Canonical Dependency Graph</title>
  <desc id="desc-P002">The canonical ADR-025 dependency graph showing that operators depend on BanzAI, BanzAI depends on BANZA, and BANZA never depends on any operator. The dependency direction is permanent and non-negotiable.</desc>

  <defs>
    <linearGradient id="hG-P002" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#990011"/>
      <stop offset="100%" stop-color="#B11226"/>
    </linearGradient>
    <linearGradient id="banzaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#990011"/>
      <stop offset="100%" stop-color="#B11226"/>
    </linearGradient>
    <linearGradient id="banzaiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#DDE3FF"/>
    </linearGradient>
    <linearGradient id="opGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <filter id="sh-P002" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B6265"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="700" height="500" fill="#FCF6F5"/>

  <!-- Header -->
  <rect x="20" y="16" width="660" height="56" rx="8" fill="url(#hG-P002)" filter="url(#sh-P002)"/>
  <text x="350" y="42" text-anchor="middle" fill="white" font-size="16" font-weight="700">Protocol Hierarchy</text>
  <text x="350" y="61" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="10" letter-spacing="1.0">CANONICAL DEPENDENCY GRAPH — ADR-025</text>

  <!-- Operators layer -->
  <rect x="60" y="98" width="580" height="86" rx="8" fill="url(#opGrad)" stroke="#15803D" stroke-width="1.5" filter="url(#sh-P002)"/>
  <text x="350" y="126" text-anchor="middle" fill="#15803D" font-size="15" font-weight="700">Operators</text>
  <text x="350" y="146" text-anchor="middle" fill="#166534" font-size="11">Any certified entity implementing the BANZA protocol</text>
  <text x="350" y="162" text-anchor="middle" fill="#6B6265" font-size="10">· process payments · settle obligations · hold their own keypairs ·</text>
  <text x="350" y="175" text-anchor="middle" fill="#6B6265" font-size="10">certification required at L0–L4</text>

  <!-- Arrow: Operators depend on BanzAI (upward arrow = depends-on direction upward) -->
  <line x1="350" y1="184" x2="350" y2="216" stroke="#6B6265" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <rect x="270" y="195" width="160" height="18" rx="4" fill="#FCF6F5"/>
  <text x="350" y="208" text-anchor="middle" fill="#6B6265" font-size="10" font-style="italic">depend on ↑</text>

  <!-- BanzAI layer -->
  <rect x="60" y="218" width="580" height="86" rx="8" fill="url(#banzaiGrad)" stroke="#1D4ED8" stroke-width="1.5" filter="url(#sh-P002)"/>
  <text x="350" y="246" text-anchor="middle" fill="#1D4ED8" font-size="15" font-weight="700">BanzAI</text>
  <text x="350" y="266" text-anchor="middle" fill="#1E40AF" font-size="11">Protocol Operating System</text>
  <text x="350" y="282" text-anchor="middle" fill="#6B6265" font-size="10">· evaluates readiness · verifies trust assertions · audits payment traces ·</text>
  <text x="350" y="295" text-anchor="middle" fill="#6B6265" font-size="10">NEVER certifies · NEVER signs production artifacts · NEVER defines protocol rules</text>

  <!-- Arrow: BanzAI depends on BANZA -->
  <line x1="350" y1="304" x2="350" y2="336" stroke="#6B6265" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <rect x="270" y="315" width="160" height="18" rx="4" fill="#FCF6F5"/>
  <text x="350" y="328" text-anchor="middle" fill="#6B6265" font-size="10" font-style="italic">depend on ↑</text>

  <!-- BANZA layer -->
  <rect x="60" y="338" width="580" height="86" rx="8" fill="url(#banzaGrad)" filter="url(#sh-P002)"/>
  <text x="350" y="366" text-anchor="middle" fill="white" font-size="15" font-weight="700">BANZA</text>
  <text x="350" y="386" text-anchor="middle" fill="rgba(255,255,255,0.92)" font-size="11">Open Financial Infrastructure Protocol</text>
  <text x="350" y="402" text-anchor="middle" fill="rgba(255,255,255,0.80)" font-size="10">· defines rules · issues certificates · approves certification · owns conformance ·</text>
  <text x="350" y="415" text-anchor="middle" fill="rgba(255,255,255,0.80)" font-size="10">no operator is above BANZA · no operator governs BANZA</text>

  <!-- Rule box -->
  <rect x="20" y="438" width="660" height="44" rx="6" fill="#EAE0DF" stroke="#D4C9C7" stroke-width="1"/>
  <text x="350" y="457" text-anchor="middle" fill="#1A1A1A" font-size="11" font-weight="700">Invariant: BANZA and BanzAI never depend on operators.</text>
  <text x="350" y="473" text-anchor="middle" fill="#6B6265" font-size="10">This dependency direction is permanent, non-negotiable, and enforced architecturally. — ADR-018 · ADR-019 · ADR-025</text>

  <!-- Footer -->
  <text x="350" y="495" text-anchor="middle" fill="#6B6265" font-size="10">SVG-P-002 · v1.0 · ADR-025 · ADR-018 · ADR-019 · 2026-06-01</text>

</svg>
