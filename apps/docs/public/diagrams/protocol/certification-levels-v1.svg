  <title id="title-P006">BANZA Certification Levels — L0 through L4</title>
  <desc id="desc-P006">The five BANZA certification levels (L0 Sandbox through L4 Infrastructure) with their capability matrices. Each level is cumulative. L3 Federation is the eligibility gate for cross-operator routing. L4 Infrastructure requires EMIS card acquiring (v1.1 scope).</desc>

  <defs>
    <linearGradient id="hG-P006" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#990011"/>
      <stop offset="100%" stop-color="#B11226"/>
    </linearGradient>
    <filter id="sh-P006" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000012"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="900" height="580" fill="#FCF6F5"/>

  <!-- Header -->
  <rect x="20" y="14" width="860" height="56" rx="8" fill="url(#hG-P006)" filter="url(#sh-P006)"/>
  <text x="450" y="40" text-anchor="middle" fill="white" font-size="16" font-weight="700">Certification Levels</text>
  <text x="450" y="59" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="10" letter-spacing="1.0">BANZA_REFERENCE.md §4 · ADR-028 · LEVELS ARE CUMULATIVE — EACH INCLUDES ALL PRIOR LEVELS</text>

