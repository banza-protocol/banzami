<!DOCTYPE html>
<html lang="pt">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="App Banzami — pagamentos em Kwanza, de carteira para carteira. Sandbox.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="App Banzami">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon — the rounded Banzami mark, identical to banzami.com's tab icon. -->
  <link rel="icon" type="image/svg+xml" href="icon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"/>
  <link rel="icon" href="favicon.ico" sizes="any"/>

  <title>App Banzami</title>
  <link rel="manifest" href="manifest.json">
  <!--
    Transparent document background. Standalone is unaffected: the desktop
    device shell paints its own off-white canvas over the whole viewport. In the
    homepage embed (?embed=phone) the device shell canvas is transparent, so this
    lets the marketing hero show through around the floating phone — the app is
    reduced proportionally onto the hero, nothing behind it.
  -->
  <style>html,body{background:transparent;margin:0;}</style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <!-- Consistent SANDBOX corner ribbon (same as banzami.com and the other surfaces). -->
  <div role="status" style="position:fixed;top:0;left:0;z-index:2147483000;width:150px;height:150px;overflow:hidden;pointer-events:none">
    <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Ambiente SANDBOX — dinheiro fictício. O Financial Live está indisponível.</span>
    <div aria-hidden="true" style="position:absolute;top:12px;left:-52px;transform:rotate(-45deg);width:150px;padding:5px 0;text-align:center;background:linear-gradient(90deg,#FBE6A6,#F2CD6E);color:#7A4A06;font-size:9.5px;font-weight:900;letter-spacing:.16em;box-shadow:0 8px 18px -8px rgba(122,74,6,.5);font-family:'Nunito',system-ui,sans-serif">SANDBOX</div>
  </div>
</body>
</html>
