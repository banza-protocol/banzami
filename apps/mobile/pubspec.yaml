name: banzami_mobile
description: Banzami — pagamentos instantâneos para Angola
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Banzami SDK — screens, client, models, theme
  banzami_flutter:
    path: ../../sdk/flutter

  # HTTP client (pinned TLS)
  http: ^1.2.0

  # Session & security
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  crypto: ^3.0.5
  uuid: ^4.4.0

  # State management
  provider: ^6.1.2

  # Deep links (banzami://)
  app_links: ^6.3.3

  # QR generation (merchant flavor)
  qr_flutter: ^4.1.0

  # Sharing (merchant flavor)
  share_plus: ^10.0.0

  # App-private temp storage (merchant QR sharing) + app version display
  path_provider: ^2.1.4
  package_info_plus: ^8.0.2

  # Date formatting (history screen grouping)
  intl: ^0.19.0

  # Google Fonts (Inter) — font files bundled in assets/fonts/
  google_fonts: ^6.2.1

  # Firebase — core + push notifications + crash reporting
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.4
  firebase_crashlytics: ^4.3.0

  # Local notifications (foreground display + polling fallback)
  flutter_local_notifications: ^18.0.0

  # Native OS-level splash screen
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: "assets/banzami/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24

flutter_native_splash:
  color: "#B5101F"
  image: assets/banzami/splash_native.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#B5101F"
    image: assets/banzami/splash_native.png

flutter:
  uses-material-design: true
  assets:
    - assets/banzami/
    - assets/business/
    - assets/fonts/
    - assets/certs/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
