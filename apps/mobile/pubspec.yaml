name: banzami_mobile
description: Banzami — pagamentos instantâneos para Angola
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Banzami SDK — screens, client, models, theme
  banzami_sdk:
    path: ../../sdk/flutter

  # Session & security
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  crypto: ^3.0.5

  # State management
  provider: ^6.1.2

  # Deep links (banzami://)
  app_links: ^6.3.3

  # QR generation (merchant flavor)
  qr_flutter: ^4.1.0

  # Sharing (merchant flavor)
  share_plus: ^10.0.0

  # Google Fonts (Inter) — no font files needed
  google_fonts: ^6.2.1

  # Firebase — core + push notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.4

  # Local notifications (foreground display + polling fallback)
  flutter_local_notifications: ^18.0.0

  # Native OS-level splash screen
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: "assets/images/icon_master_1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#990011"
  image: assets/images/banzami_logo.png
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  android_12:
    color: "#990011"
    image: assets/images/banzami_logo.png
    icon_background_color: "#990011"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
