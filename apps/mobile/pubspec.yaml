name: banzami_mobile
description: Banzami — pagamentos instantâneos para Angola
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Banzami SDK — screens, client, models, theme
  banzami_sdk:
    path: ../../sdk/flutter

  # Session & security
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  crypto: ^3.0.5

  # State management
  provider: ^6.1.2

  # Deep links (banzami://)
  app_links: ^6.3.3

  # QR generation (merchant flavor)
  qr_flutter: ^4.1.0

  # Sharing (merchant flavor)
  share_plus: ^10.0.0

  # Google Fonts (Inter) — no font files needed
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: "assets/images/icon_master_1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
