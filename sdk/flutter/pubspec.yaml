name: banza_flutter
description: >
  Banzami Flutter SDK — payment widgets, API client, and screens for
  integrating instant P2P transfers and QR payments into Flutter applications.
version: 0.1.0
homepage: https://banzami.org

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  http: ^1.2.0

  # QR code display
  qr_flutter: ^4.1.0

  # QR code scanner (camera)
  mobile_scanner: ^6.0.0

  # Camera permission gate (iOS + Android)
  permission_handler: ^11.3.0

  # Number / currency formatting
  intl: ^0.19.0

  # UUID generation (idempotency keys)
  uuid: ^4.4.0

  # Deep link / URL launching (used by CheckoutScreen to open the Banzami app)
  url_launcher: ^6.3.0

  # Share files / images (used by BanzamiReceiveScreen QR share)
  share_plus: ^10.1.4

  # PDF generation
  pdf: ^3.11.0

  # Temp file path for PDF export
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/fonts/Inter-Regular.ttf
    - assets/fonts/Inter-Bold.ttf
