name: banzami_flutter
description: >
  Banzami's FIRST-PARTY Flutter application framework — the screens, client,
  models and theme the Banzami Consumer and Business apps are built from. Not a
  third-party SDK: see banzami_client on pub.dev for the public client SDK.
version: 0.1.0
homepage: https://banzami.com

# NOT PUBLISHABLE (Banzami ADR-053).
#
# This package is app internals: onboarding, KYB, merchant screens, theme. It is
# consumed by apps/mobile as a path dependency. Publishing it would present
# first-party application architecture as a public integration product, and
# would put a package on pub.dev whose surface no integrator needs.
#
# The public client SDK is `banzami_client` (sdk/dart-client) — publishable key,
# client-safe surface, money movement on the server.
#
# `publish_to: none` makes the mistake impossible rather than discouraged: pub
# refuses to publish this package at all.
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  http: ^1.2.0

  # QR code display
  qr_flutter: ^4.1.0

  # QR code scanner (camera)
  mobile_scanner: ^6.0.0

  # Camera permission gate (iOS + Android)
  permission_handler: ^11.3.0

  # Number / currency formatting
  intl: ^0.19.0

  # UUID generation (idempotency keys)
  uuid: ^4.4.0

  # Deep link / URL launching (used by CheckoutScreen to open the Banzami app)
  url_launcher: ^6.3.0

  # Share files / images (used by BanzamiReceiveScreen QR share)
  share_plus: ^10.1.4


  # Temp file path for PDF export
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/fonts/Inter-Regular.ttf
    - assets/fonts/Inter-Bold.ttf
