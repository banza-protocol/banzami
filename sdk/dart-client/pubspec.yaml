name: banzami_client
description: >-
  Public client SDK for the Banzami payment network — present a hosted checkout,
  read a payment's public status, and parse Banzami QR and deep links. Uses a
  publishable key; money movement stays on your server.
version: 0.1.0
homepage: https://developers.banzami.com
repository: https://github.com/banza-protocol/banzami
issue_tracker: https://github.com/banza-protocol/banzami/issues
documentation: https://developers.banzami.com/docs

topics:
  - payments
  - fintech
  - checkout
  - angola

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  http: ^1.2.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
