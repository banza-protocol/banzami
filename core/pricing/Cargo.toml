[package]
name        = "banzami-pricing"
description = "Operator Pricing Engine (Banzami ADR-021 / BANZA ADR-039). The ONE place fee percentages and pricing rules exist in the whole stack. Pure, deterministic resolution of a fee_minor + audit snapshot from operator-policy rules; performs NO ledger work and holds NO money."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true

[dependencies]
banzami-types = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
uuid          = { workspace = true }
chrono        = { workspace = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }
sqlx          = { workspace = true }
tokio         = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
