[package]
name        = "banzami-app-settlement"
description = "Application Settlement (Banzami ADR-021 / BANZA ADR-039) — the deferred, app-initiated settlement of accumulated NET value to a beneficiary after a business event (campaign close, delivery, sale, period end). Distinct from the per-payment Operator Fee. Posts balanced ledger entries; carries an optional application fee resolved by the Pricing Engine."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true

[dependencies]
banzami-types   = { workspace = true }
banzami-ledger  = { workspace = true }
banzami-pricing = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
uuid            = { workspace = true }
chrono          = { workspace = true }
thiserror       = { workspace = true }
tracing         = { workspace = true }
sqlx            = { workspace = true }
tokio           = { workspace = true }

[dev-dependencies]
sqlx       = { workspace = true }
uuid       = { workspace = true }
serde_json = { workspace = true }
chrono     = { workspace = true }
tokio      = { workspace = true, features = ["macros", "rt-multi-thread"] }
