[package]
name        = "banzami-collections"
description = "Payment Collections + PaymentIntent (BANZA ADR-036/037) — operator-side persistence and lifecycle. Holds no money; coordinates per-share settlement via PaymentIntent -> Transfer -> Ledger."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true

[dependencies]
banzami-types = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
uuid          = { workspace = true }
chrono        = { workspace = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }
sqlx          = { workspace = true }
tokio         = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
