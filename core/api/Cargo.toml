[[bin]]
name = "core-api"
path = "src/main.rs"

[package]
name        = "banzami-core-api"
description = "Internal HTTP service exposing the Rust financial core to the Go API gateway"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true

[dependencies]
banzami-types            = { workspace = true }
banzami-ledger           = { workspace = true }
banzami-wallets          = { workspace = true }
banzami-transactions     = { workspace = true }
banzami-pricing          = { workspace = true }
banzami-app-settlement   = { workspace = true }
banzami-merchants        = { workspace = true }
banzami-settlement       = { workspace = true }
banzami-routing          = { workspace = true }
banzami-risk             = { workspace = true }
banzami-payouts          = { workspace = true }
banzami-compliance       = { workspace = true }
banzami-reconciliation   = { workspace = true }
banzami-identity         = { workspace = true }
banzami-consumer-wallets = { workspace = true }
banzami-transfers        = { workspace = true }
banzami-qr               = { workspace = true }
banzami-payment-links    = { workspace = true }
banzami-acquiring        = { workspace = true }
banzami-collections      = { workspace = true }
base64               = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }
uuid                 = { workspace = true }
chrono               = { workspace = true }
thiserror            = { workspace = true }
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }
sqlx                 = { workspace = true }
tokio                = { workspace = true }
axum                 = { workspace = true }
tower                = { workspace = true }
tower-http           = { workspace = true }

[dev-dependencies]
# Test-only: `util` enables tower::util::ServiceExt::oneshot for route-level
# tests (e.g. the Split Sessions supersession router test). Not in the release
# binary — feature-unions onto the runtime `tower` dep only for test builds.
tower                = { workspace = true, features = ["util"] }
