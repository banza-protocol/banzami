banzami-routing        = { workspace = true }
banzami-risk           = { workspace = true }
banzami-payouts        = { workspace = true }
banzami-compliance     = { workspace = true }
banzami-reconciliation = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }
uuid                 = { workspace = true }
chrono               = { workspace = true }
thiserror            = { workspace = true }
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }
sqlx                 = { workspace = true }
