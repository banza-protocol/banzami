[workspace]
members = [
    "types",
    "ledger",
    "wallets",
    "transactions",
    "settlement",
    "routing",
    "reconciliation",
    "risk",
    "compliance",
    "payouts",
]
resolver = "2"

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "UNLICENSED"
repository = "https://github.com/banzami/banzami"
authors    = ["Banzami Engineering <engineering@banzami.ao>"]

# ---------------------------------------------------------------------------
# Shared dependency versions — crates opt-in with { workspace = true }
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Internal
banzami-types        = { path = "types" }
banzami-ledger       = { path = "ledger" }
banzami-wallets      = { path = "wallets" }
banzami-transactions = { path = "transactions" }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database — opt-in per crate when the persistence layer is implemented
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "rust_decimal",
] }

# Observability (CLAUDE.md §9)
tracing = "0.1"
