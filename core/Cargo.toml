[workspace]
members = [
    # "types" migrated to path dep on public banzami/banzami
    "ledger",
    "wallets",
    "transactions",
    "merchants",
    "settlement",
    "routing",
    "reconciliation",
    "risk",
    "compliance",
    "payouts",
    "identity",
    "consumer-wallets",
    "transfers",
    "qr",
    "payment-links",
    "acquiring",
    "collections",
    "pricing",
    "app-settlement",
    "api",
]
resolver = "2"

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "UNLICENSED"
# Migration note: generic crates (types, ledger, wallets, etc.) will be
# replaced with path dependencies on the public banzami/banzami repo.
# Target: banzami-ledger = { path = "../../Banzami/core/crates/banzami-ledger" }
# Until then, private copies are maintained here in sync with the public versions.
repository = "https://github.com/banza-protocol/banzami"
authors    = ["Banzami Engineering <engineering@banzami.com>"]

# ---------------------------------------------------------------------------
# Shared dependency versions — crates opt-in with { workspace = true }
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Internal
banzami-types           = { path = "types" }
banzami-ledger          = { path = "ledger" }
banzami-wallets         = { path = "wallets" }
banzami-transactions    = { path = "transactions" }
banzami-merchants       = { path = "merchants" }
banzami-settlement      = { path = "settlement" }
banzami-routing         = { path = "routing" }
banzami-risk            = { path = "risk" }
banzami-reconciliation  = { path = "reconciliation" }
banzami-payouts         = { path = "payouts" }
banzami-compliance      = { path = "compliance" }
banzami-identity        = { path = "identity" }
banzami-consumer-wallets = { path = "consumer-wallets" }
banzami-transfers       = { path = "transfers" }
banzami-qr              = { path = "qr" }
banzami-payment-links   = { path = "payment-links" }
banzami-acquiring       = { path = "acquiring" }
banzami-collections     = { path = "collections" }
banzami-pricing         = { path = "pricing" }
banzami-app-settlement  = { path = "app-settlement" }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database — opt-in per crate when the persistence layer is implemented
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "rust_decimal",
    "json",
] }

# Observability (CLAUDE.md §9)
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cryptography — API key hashing + QR signatures + PIN hashing
sha2   = "0.10"
hmac   = "0.12"
base64 = { version = "0.22", features = ["alloc"] }
argon2 = { version = "0.5", features = ["alloc"] }
rand   = "0.8"

# HTTP server — internal core-api
axum   = "0.7"
tower  = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# ---------------------------------------------------------------------------
# Release profile — financial-core hardening
# ---------------------------------------------------------------------------
# Rust disables integer overflow checks in release builds by default, so `+`
# WRAPS silently. In a ledger that turns an arithmetic mistake into silent
# monetary corruption: a sum that should be rejected can wrap to a value that
# passes an invariant check (see ledger/tests/balance_overflow.rs). Money moves
# here, so an overflow must abort the operation rather than produce a wrong
# number. Individual hot paths still use explicit checked_* arithmetic; this is
# the backstop for every path that does not.
[profile.release]
overflow-checks = true
debug-assertions = false
