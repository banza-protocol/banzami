[workspace]
members = [
    "types",
    "ledger",
    "wallets",
    "transactions",
    "merchants",
    "settlement",
    "routing",
    "reconciliation",
    "risk",
    "compliance",
    "payouts",
    "identity",
    "consumer-wallets",
    "transfers",
    "qr",
    "payment-links",
    "api",
]
resolver = "2"

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "UNLICENSED"
repository = "https://github.com/banzami/banzami"
authors    = ["Banzami Engineering <engineering@banzami.ao>"]

# ---------------------------------------------------------------------------
# Shared dependency versions — crates opt-in with { workspace = true }
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Internal
banzami-types           = { path = "types" }
banzami-ledger          = { path = "ledger" }
banzami-wallets         = { path = "wallets" }
banzami-transactions    = { path = "transactions" }
banzami-merchants       = { path = "merchants" }
banzami-settlement      = { path = "settlement" }
banzami-routing         = { path = "routing" }
banzami-risk            = { path = "risk" }
banzami-reconciliation  = { path = "reconciliation" }
banzami-payouts         = { path = "payouts" }
banzami-compliance      = { path = "compliance" }
banzami-identity        = { path = "identity" }
banzami-consumer-wallets = { path = "consumer-wallets" }
banzami-transfers       = { path = "transfers" }
banzami-qr              = { path = "qr" }
banzami-payment-links   = { path = "payment-links" }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database — opt-in per crate when the persistence layer is implemented
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "rust_decimal",
] }

# Observability (CLAUDE.md §9)
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cryptography — API key hashing + QR signatures
sha2   = "0.10"
hmac   = "0.12"
base64 = { version = "0.22", features = ["alloc"] }

# HTTP server — internal core-api
axum   = "0.7"
tower  = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
