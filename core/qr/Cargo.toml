[package]
name        = "banzami-qr"
description = "QR code generation, signing, and validation for consumer and merchant payments"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true

[dependencies]
banzami-types = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
uuid          = { workspace = true }
chrono        = { workspace = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }
sqlx          = { workspace = true }
tokio         = { workspace = true }
hmac          = { workspace = true }
sha2          = { workspace = true }
base64        = { workspace = true }

[dev-dependencies]
tokio  = { workspace = true, features = ["macros", "rt-multi-thread"] }
sqlx   = { workspace = true }
uuid   = { workspace = true }
chrono = { workspace = true }
# Cross-crate integration test for the QR payment invariant (INV-QR-002-1):
# QR amount == consumer ledger debit == merchant ledger credit.
banzami-ledger           = { workspace = true }
banzami-wallets          = { workspace = true }
banzami-consumer-wallets = { workspace = true }
banzami-transfers        = { workspace = true }
