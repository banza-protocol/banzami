<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 158" role="img" aria-label="Protocol-first flow" font-family="system-ui,-apple-system,sans-serif">
  <title>Protocol-first — structural concepts flow downward: BANZA → Banzami → SDK → Applications</title>
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B5101F"/><stop offset="100%" stop-color="#E03A43"/></linearGradient>
    <linearGradient id="banza" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7A0A14"/><stop offset="100%" stop-color="#A01020"/></linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="4.5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#9CA3AF"/></marker>
  </defs>
  <rect width="900" height="158" fill="#FFF7F6" rx="16"/>
  <rect x="0" y="0" width="900" height="64" fill="url(#hg)" rx="16"/>
  <rect x="0" y="48" width="900" height="16" fill="#B5101F"/>
  <text x="32" y="28" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FBD2D0" letter-spacing="2">SVG-BZ-014 · PROTOCOL-FIRST</text>
  <text x="32" y="50" font-size="17" font-weight="800" fill="#FFFFFF">Structural concepts flow downward — never the other way</text>
  <text x="868" y="50" text-anchor="end" font-size="10.5" fill="#FBD2D0">Protocol → Operator → SDK → Apps</text>

  <rect x="30" y="92" width="180" height="48" rx="10" fill="url(#banza)"/>
  <text x="120" y="121" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">BANZA Protocol</text>
  <line x1="210" y1="116" x2="250" y2="116" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="250" y="92" width="180" height="48" rx="10" fill="url(#hg)"/>
  <text x="340" y="121" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">Banzami Operator</text>
  <line x1="430" y1="116" x2="470" y2="116" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="470" y="92" width="180" height="48" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="560" y="121" text-anchor="middle" font-size="13" font-weight="800" fill="#374151">SDK</text>
  <line x1="650" y1="116" x2="690" y2="116" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="690" y="92" width="180" height="48" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="780" y="121" text-anchor="middle" font-size="13" font-weight="800" fill="#374151">Applications</text>
</svg>
