<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Banzami application integration engine" font-family="system-ui,-apple-system,sans-serif">
  <title>Application integration — the app creates intent, the operator moves the money</title>
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B5101F"/><stop offset="100%" stop-color="#E03A43"/></linearGradient>
    <linearGradient id="op" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#9A1B22"/><stop offset="100%" stop-color="#D7242E"/></linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="4.5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#9CA3AF"/></marker>
  </defs>

  <rect width="900" height="560" fill="#FFF7F6" rx="16"/>
  <rect x="0" y="0" width="900" height="64" fill="url(#hg)" rx="16"/>
  <rect x="0" y="48" width="900" height="16" fill="#B5101F"/>
  <text x="32" y="28" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FBD2D0" letter-spacing="2">SVG-BZ-016 · APPLICATION INTEGRATION ENGINE</text>
  <text x="32" y="50" font-size="17" font-weight="800" fill="#FFFFFF">The app creates intent · the operator moves the money</text>
  <text x="868" y="50" text-anchor="end" font-size="10.5" fill="#FBD2D0">App · SDK · Operator · Ledger</text>

  <!-- Application -->
  <text x="450" y="92" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9CA3AF" letter-spacing="1">THE APPLICATION (e.g. DOA)</text>
  <rect x="300" y="100" width="300" height="52" rx="12" fill="#374151"/>
  <text x="450" y="123" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">Application</text>
  <text x="450" y="141" text-anchor="middle" font-size="9.5" fill="#D1D5DB">UX · campanhas · catálogo · destino da taxa</text>

  <line x1="450" y1="152" x2="450" y2="184" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="464" y="172" font-size="9.5" fill="#6B7280">official SDK only (never raw HTTP)</text>

  <!-- SDK -->
  <rect x="300" y="186" width="300" height="40" rx="10" fill="#FEE2E2" stroke="#F3B4B8"/>
  <text x="450" y="211" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9A1B22">Banzami SDK · Flutter / TypeScript / REST</text>

  <line x1="450" y1="226" x2="450" y2="256" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="464" y="245" font-size="9.5" fill="#6B7280">API Key (bearer) · idempotency · signatures</text>

  <!-- Operator boundary -->
  <rect x="120" y="258" width="660" height="212" rx="14" fill="#FEF2F2" stroke="#F3B4B8"/>
  <text x="140" y="279" font-size="10.5" font-weight="700" fill="#9A1B22" letter-spacing="1">THE OPERATOR — Banzami (all money lives here)</text>

  <!-- Gateway -->
  <rect x="300" y="288" width="300" height="40" rx="10" fill="url(#hg)"/>
  <text x="450" y="313" text-anchor="middle" font-size="12.5" font-weight="800" fill="#FFFFFF">API Gateway · auth · rate limit · isolation</text>
  <line x1="450" y1="328" x2="450" y2="352" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Resolution engines row -->
  <rect x="150" y="354" width="176" height="46" rx="10" fill="url(#op)"/>
  <text x="238" y="374" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Business Resolution</text>
  <text x="238" y="390" text-anchor="middle" font-size="9" fill="#FBD2D0">who · status · wallet</text>

  <rect x="362" y="354" width="176" height="46" rx="10" fill="url(#op)"/>
  <text x="450" y="374" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Pricing Engine</text>
  <text x="450" y="390" text-anchor="middle" font-size="9" fill="#FBD2D0">profile → fee</text>

  <rect x="574" y="354" width="176" height="46" rx="10" fill="url(#op)"/>
  <text x="662" y="374" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Settlement Engine</text>
  <text x="662" y="390" text-anchor="middle" font-size="9" fill="#FBD2D0">taxas do operador</text>

  <line x1="450" y1="400" x2="450" y2="424" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Ledger -->
  <rect x="300" y="426" width="300" height="40" rx="10" fill="#111827"/>
  <text x="450" y="451" text-anchor="middle" font-size="12.5" font-weight="800" fill="#FFFFFF">Double-entry Ledger · single source of truth</text>

  <!-- Never band -->
  <rect x="120" y="486" width="660" height="52" rx="12" fill="#FFFFFF" stroke="#E7E2DE"/>
  <text x="140" y="507" font-size="10.5" font-weight="700" fill="#9A1B22">The application NEVER:</text>
  <text x="140" y="525" font-size="10" fill="#6B7280">moves money · owns a wallet · computes settlement · computes the operator fee · holds a ledger · runs KYB/compliance</text>
</svg>
