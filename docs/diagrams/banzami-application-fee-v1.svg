<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Application fee vs operator fee" font-family="system-ui,-apple-system,sans-serif">
  <title>Two independent fees — the operator fee funds the network, the application fee funds the app</title>
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B5101F"/><stop offset="100%" stop-color="#E03A43"/></linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="4.5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#9CA3AF"/></marker>
  </defs>

  <rect width="900" height="380" fill="#FFF7F6" rx="16"/>
  <rect x="0" y="0" width="900" height="64" fill="url(#hg)" rx="16"/>
  <rect x="0" y="48" width="900" height="16" fill="#B5101F"/>
  <text x="32" y="28" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FBD2D0" letter-spacing="2">SVG-BZ-017 · APPLICATION FEE vs OPERATOR FEE</text>
  <text x="32" y="50" font-size="17" font-weight="800" fill="#FFFFFF">Two independent fees · the operator computes both</text>
  <text x="868" y="50" text-anchor="end" font-size="10.5" fill="#FBD2D0">example: 100 000 Kz</text>

  <!-- Gross -->
  <rect x="40" y="150" width="150" height="80" rx="12" fill="#374151"/>
  <text x="115" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Pagamento</text>
  <text x="115" y="207" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">100 000 Kz</text>
  <text x="115" y="223" text-anchor="middle" font-size="9" fill="#D1D5DB">bruto (gross)</text>

  <line x1="190" y1="190" x2="236" y2="190" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Operator fee -->
  <rect x="238" y="150" width="180" height="80" rx="12" fill="url(#hg)"/>
  <text x="328" y="181" text-anchor="middle" font-size="11.5" font-weight="800" fill="#FFFFFF">Operator Fee</text>
  <text x="328" y="200" text-anchor="middle" font-size="9.5" fill="#FBD2D0">pricing rule · operador</text>
  <text x="328" y="217" text-anchor="middle" font-size="9.5" fill="#FBD2D0">a categoria decide</text>

  <line x1="418" y1="190" x2="464" y2="190" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Application fee -->
  <rect x="466" y="150" width="180" height="80" rx="12" fill="#9A1B22"/>
  <text x="556" y="181" text-anchor="middle" font-size="11.5" font-weight="800" fill="#FFFFFF">Application Fee</text>
  <text x="556" y="200" text-anchor="middle" font-size="9.5" fill="#FBD2D0">definida pela app (bps)</text>
  <text x="556" y="217" text-anchor="middle" font-size="9.5" fill="#FBD2D0">executada pelo operador</text>

  <line x1="646" y1="190" x2="692" y2="190" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Beneficiary -->
  <rect x="694" y="150" width="166" height="80" rx="12" fill="#065F46"/>
  <text x="777" y="185" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">Beneficiário</text>
  <text x="777" y="207" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">líquido</text>
  <text x="777" y="223" text-anchor="middle" font-size="9" fill="#A7F3D0">net · @handle / IBAN</text>

  <!-- captions -->
  <text x="328" y="270" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9A1B22">OPERATOR FEE</text>
  <text x="328" y="288" text-anchor="middle" font-size="9.5" fill="#6B7280">pertence ao operador · financia a rede</text>
  <text x="328" y="303" text-anchor="middle" font-size="9.5" fill="#6B7280">a aplicação nunca o calcula</text>

  <text x="556" y="270" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9A1B22">APPLICATION FEE</text>
  <text x="556" y="288" text-anchor="middle" font-size="9.5" fill="#6B7280">pertence à aplicação · a app escolhe os bps</text>
  <text x="556" y="303" text-anchor="middle" font-size="9.5" fill="#6B7280">o operador valida e executa a divisão</text>

  <text x="450" y="342" text-anchor="middle" font-size="10" fill="#374151">Regra: a aplicação define APENAS a application fee. Tudo o resto — operator fee, divisão, movimento — é do operador.</text>
</svg>
