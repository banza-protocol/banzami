<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" role="img" aria-label="DOA worked example" font-family="system-ui,-apple-system,sans-serif">
  <title>DOA — a worked example: campaign donations settle 2% to @doa and 98% to the beneficiary</title>
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B5101F"/><stop offset="100%" stop-color="#E03A43"/></linearGradient>
    <linearGradient id="banza" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7A0A14"/><stop offset="100%" stop-color="#A01020"/></linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="4.5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#9CA3AF"/></marker>
  </defs>
  <rect width="900" height="452" fill="#FFF7F6" rx="16"/>
  <rect x="0" y="0" width="900" height="64" fill="url(#hg)" rx="16"/>
  <rect x="0" y="48" width="900" height="16" fill="#B5101F"/>
  <text x="32" y="28" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FBD2D0" letter-spacing="2">SVG-BZ-013 · DOA WORKED EXAMPLE</text>
  <text x="32" y="50" font-size="17" font-weight="800" fill="#FFFFFF">DOA requests the settlement · the operator executes the split</text>
  <text x="868" y="50" text-anchor="end" font-size="10.5" fill="#FBD2D0">DOA never computes the balance</text>

  <!-- 1 Campaign -->
  <rect x="250" y="82" width="400" height="48" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="450" y="103" text-anchor="middle" font-size="13" font-weight="800" fill="#374151">Campaign</text>
  <text x="450" y="120" text-anchor="middle" font-size="9.5" fill="#6B7280">create a CAMPAIGN Wallet Account</text>
  <line x1="450" y1="130" x2="450" y2="148" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 2 Donations -->
  <rect x="250" y="148" width="400" height="48" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="450" y="169" text-anchor="middle" font-size="13" font-weight="800" fill="#374151">Donations</text>
  <text x="450" y="186" text-anchor="middle" font-size="9.5" fill="#6B7280">credit ONLY the campaign account</text>
  <line x1="450" y1="196" x2="450" y2="214" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 3 Campaign account balance -->
  <rect x="250" y="214" width="400" height="48" rx="10" fill="url(#banza)"/>
  <text x="450" y="235" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">Campaign account balance</text>
  <text x="450" y="252" text-anchor="middle" font-size="9.5" fill="#F3C9CD">kept by the operator — DOA never computes it</text>
  <line x1="450" y1="262" x2="450" y2="280" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 4 Settlement -->
  <rect x="250" y="280" width="400" height="48" rx="10" fill="url(#hg)"/>
  <text x="450" y="301" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">Settlement</text>
  <text x="450" y="318" text-anchor="middle" font-size="9.5" fill="#FBD2D0">DOA requests "execute this settlement" · no rate sent (ADR-057)</text>

  <!-- split -->
  <line x1="450" y1="328" x2="450" y2="348" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="280" y1="348" x2="620" y2="348" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="280" y1="348" x2="280" y2="368" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="620" y1="348" x2="620" y2="368" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 5a fee -->
  <rect x="150" y="370" width="260" height="64" rx="10" fill="#FBD2D0" stroke="#E8434B" stroke-width="1.5"/>
  <text x="280" y="397" text-anchor="middle" font-size="14" font-weight="800" fill="#9A1B22">2%  →  @doa</text>
  <text x="280" y="416" text-anchor="middle" font-size="9.5" fill="#9A1B22">at the operator-assigned 200 bps</text>

  <!-- 5b net -->
  <rect x="490" y="370" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="620" y="397" text-anchor="middle" font-size="14" font-weight="800" fill="#374151">98%  →  beneficiary</text>
  <text x="620" y="416" text-anchor="middle" font-size="9.5" fill="#6B7280">the net</text>
</svg>
