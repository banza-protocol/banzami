<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 324" role="img" aria-label="Wallet Accounts" font-family="system-ui,-apple-system,sans-serif">
  <title>Wallet Accounts — one wallet per currency, several segregated accounts inside</title>
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B5101F"/><stop offset="100%" stop-color="#E03A43"/></linearGradient>
  </defs>
  <rect width="900" height="324" fill="#FFF7F6" rx="16"/>
  <rect x="0" y="0" width="900" height="64" fill="url(#hg)" rx="16"/>
  <rect x="0" y="48" width="900" height="16" fill="#B5101F"/>
  <text x="32" y="28" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FBD2D0" letter-spacing="2">SVG-BZ-010 · WALLET ACCOUNTS</text>
  <text x="32" y="50" font-size="17" font-weight="800" fill="#FFFFFF">One Wallet per currency · several segregated accounts inside</text>
  <text x="868" y="50" text-anchor="end" font-size="10.5" fill="#FBD2D0">The operator keeps all balances</text>

  <!-- Wallet (parent) -->
  <rect x="56" y="128" width="210" height="72" rx="12" fill="url(#hg)"/>
  <text x="161" y="162" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">Wallet (Kz)</text>
  <text x="161" y="182" text-anchor="middle" font-size="9.5" fill="#FBD2D0">one per currency</text>

  <!-- spine -->
  <line x1="266" y1="164" x2="322" y2="164" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="322" y1="97" x2="322" y2="287" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- account stubs -->
  <line x1="322" y1="97" x2="356" y2="97" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="322" y1="135" x2="356" y2="135" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="322" y1="173" x2="356" y2="173" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="322" y1="211" x2="356" y2="211" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="322" y1="249" x2="356" y2="249" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="322" y1="287" x2="356" y2="287" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- PRIMARY (highlighted) -->
  <rect x="356" y="82" width="330" height="30" rx="8" fill="#FBD2D0" stroke="#E8434B" stroke-width="1.5"/>
  <text x="372" y="101" font-size="11.5" font-weight="800" fill="#9A1B22">PRIMARY</text>
  <text x="674" y="101" text-anchor="end" font-size="9" fill="#9A1B22">the default account</text>

  <rect x="356" y="120" width="330" height="30" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="372" y="139" font-size="11.5" font-weight="700" fill="#374151">CAMPAIGN A</text>
  <text x="674" y="139" text-anchor="end" font-size="9" fill="#9CA3AF">isolated balance (e.g. a DOA campaign)</text>

  <rect x="356" y="158" width="330" height="30" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="372" y="177" font-size="11.5" font-weight="700" fill="#374151">CAMPAIGN B</text>

  <rect x="356" y="196" width="330" height="30" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="372" y="215" font-size="11.5" font-weight="700" fill="#374151">ESCROW</text>

  <rect x="356" y="234" width="330" height="30" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="372" y="253" font-size="11.5" font-weight="700" fill="#374151">STORE</text>

  <rect x="356" y="272" width="330" height="30" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="372" y="291" font-size="11.5" font-weight="700" fill="#374151">PROJECT</text>

  <text x="744" y="173" font-size="9.5" fill="#6B7280" transform="rotate(90 744 173)">applications never hold sub-balances</text>
</svg>
