<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Developer Platform" font-family="system-ui,-apple-system,sans-serif">
  <title>Developer Platform</title>
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B5101F"/><stop offset="100%" stop-color="#E03A43"/></linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C2142B"/><stop offset="100%" stop-color="#E8434B"/></linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="4.5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#9CA3AF"/></marker>
  </defs>
  <rect width="900" height="360" fill="#FFF7F6" rx="16"/>
  <rect x="0" y="0" width="900" height="64" fill="url(#hg)" rx="16"/>
  <rect x="0" y="48" width="900" height="16" fill="#B5101F"/>
  <text x="32" y="28" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FBD2D0" letter-spacing="2">SVG-BZ-005 · DEVELOPER PLATFORM</text>
  <text x="32" y="50" font-size="17" font-weight="800" fill="#FFFFFF">Accept Kwanza in any application</text>
  <text x="868" y="50" text-anchor="end" font-size="10.5" fill="#FBD2D0">One API · five official SDKs</text>

  <g font-size="11.5" font-weight="700" fill="#9A1B22">
    <rect x="44" y="98" width="148" height="48" rx="10" fill="#FEF2F2" stroke="#FBCFCF" stroke-width="1.5"/><text x="118" y="127" text-anchor="middle">TypeScript</text>
    <rect x="204" y="98" width="148" height="48" rx="10" fill="#FEF2F2" stroke="#FBCFCF" stroke-width="1.5"/><text x="278" y="127" text-anchor="middle">Flutter</text>
    <rect x="364" y="98" width="148" height="48" rx="10" fill="#FEF2F2" stroke="#FBCFCF" stroke-width="1.5"/><text x="438" y="127" text-anchor="middle">Python</text>
    <rect x="524" y="98" width="148" height="48" rx="10" fill="#FEF2F2" stroke="#FBCFCF" stroke-width="1.5"/><text x="598" y="127" text-anchor="middle">PHP</text>
    <rect x="684" y="98" width="148" height="48" rx="10" fill="#FEF2F2" stroke="#FBCFCF" stroke-width="1.5"/><text x="758" y="127" text-anchor="middle">Go</text>
  </g>
  <g stroke="#9CA3AF" stroke-width="1.5">
    <line x1="118" y1="148" x2="430" y2="186"/><line x1="278" y1="148" x2="440" y2="186"/>
    <line x1="438" y1="148" x2="450" y2="186"/><line x1="598" y1="148" x2="460" y2="186"/>
    <line x1="758" y1="148" x2="470" y2="186" marker-end="url(#ar)"/>
  </g>

  <rect x="300" y="190" width="300" height="56" rx="12" fill="url(#band)"/>
  <text x="450" y="217" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">Banzami API</text>
  <text x="450" y="235" text-anchor="middle" font-size="9.5" fill="#FBD2D0">typed · idempotent · signed webhooks</text>

  <line x1="450" y1="248" x2="450" y2="278" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="240" y="282" width="420" height="56" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="450" y="309" text-anchor="middle" font-size="14" font-weight="800" fill="#9A1B22">Banzami Payment Network</text>
  <text x="450" y="327" text-anchor="middle" font-size="9.5" fill="#6B7280">wallets · instant settlement · Kwanza</text>
</svg>
