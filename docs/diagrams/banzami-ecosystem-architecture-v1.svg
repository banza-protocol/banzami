<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="BANZA ecosystem architecture" font-family="system-ui,-apple-system,sans-serif">
  <title>BANZA ecosystem — the protocol defines, the operator executes, the applications use</title>
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B5101F"/><stop offset="100%" stop-color="#E03A43"/></linearGradient>
    <linearGradient id="banza" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7A0A14"/><stop offset="100%" stop-color="#A01020"/></linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="4.5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#9CA3AF"/></marker>
  </defs>

  <rect width="900" height="470" fill="#FFF7F6" rx="16"/>
  <rect x="0" y="0" width="900" height="64" fill="url(#hg)" rx="16"/>
  <rect x="0" y="48" width="900" height="16" fill="#B5101F"/>
  <text x="32" y="28" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FBD2D0" letter-spacing="2">SVG-BZ-009 · ECOSYSTEM ARCHITECTURE</text>
  <text x="32" y="50" font-size="17" font-weight="800" fill="#FFFFFF">BANZA defines · Banzami executes · applications use</text>
  <text x="868" y="50" text-anchor="end" font-size="10.5" fill="#FBD2D0">Protocol · Operator · Applications</text>

  <!-- Layer 1 — Protocol -->
  <text x="450" y="86" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9CA3AF" letter-spacing="1">THE PROTOCOL</text>
  <rect x="300" y="92" width="300" height="56" rx="12" fill="url(#banza)"/>
  <text x="450" y="118" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">BANZA Protocol</text>
  <text x="450" y="136" text-anchor="middle" font-size="9.5" fill="#F3C9CD">standards · contracts · interoperability</text>

  <line x1="450" y1="148" x2="450" y2="184" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="464" y="170" font-size="9.5" fill="#6B7280">defines the standards</text>

  <!-- Layer 2 — Operator (the heart) -->
  <text x="450" y="200" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9CA3AF" letter-spacing="1">THE OPERATOR</text>
  <rect x="222" y="206" width="456" height="74" rx="12" fill="url(#hg)"/>
  <text x="450" y="232" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">Banzami Operator</text>
  <text x="450" y="251" text-anchor="middle" font-size="9.5" fill="#FBD2D0">executes money · ledger · compliance · pricing</text>
  <text x="450" y="267" text-anchor="middle" font-size="9.5" fill="#FBD2D0">settlement · proofs · webhooks</text>

  <line x1="450" y1="280" x2="450" y2="316" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="464" y="302" font-size="9.5" fill="#6B7280">validates · settles · audits · protects</text>
  <!-- split to the two applications -->
  <line x1="300" y1="316" x2="600" y2="316" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="300" y1="316" x2="300" y2="340" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="600" y1="316" x2="600" y2="340" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Layer 3 — Applications -->
  <text x="450" y="334" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9CA3AF" letter-spacing="1">THE APPLICATIONS</text>

  <rect x="180" y="344" width="240" height="98" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="300" y="370" text-anchor="middle" font-size="14" font-weight="800" fill="#374151">DOA</text>
  <text x="300" y="390" text-anchor="middle" font-size="9.5" fill="#6B7280">defines campaigns</text>
  <text x="300" y="406" text-anchor="middle" font-size="9.5" fill="#6B7280">defines fees</text>
  <text x="300" y="422" text-anchor="middle" font-size="9.5" fill="#6B7280">defines its business</text>

  <rect x="480" y="344" width="240" height="98" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="600" y="370" text-anchor="middle" font-size="14" font-weight="800" fill="#374151">Mongo</text>
  <text x="600" y="390" text-anchor="middle" font-size="9.5" fill="#6B7280">defines deliveries</text>
  <text x="600" y="406" text-anchor="middle" font-size="9.5" fill="#6B7280">defines rules</text>
  <text x="600" y="422" text-anchor="middle" font-size="9.5" fill="#6B7280">defines its business</text>

  <text x="450" y="460" text-anchor="middle" font-size="10.5" fill="#6B7280">applications use the Banzami APIs — they never implement financial logic</text>
</svg>
