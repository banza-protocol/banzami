<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="Business Resolution Engine" font-family="system-ui,-apple-system,sans-serif">
  <title>Business Resolution — one API key in, a fully-resolved business out</title>
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B5101F"/><stop offset="100%" stop-color="#E03A43"/></linearGradient>
    <linearGradient id="op" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#9A1B22"/><stop offset="100%" stop-color="#D7242E"/></linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="4.5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#9CA3AF"/></marker>
  </defs>

  <rect width="900" height="470" fill="#FFF7F6" rx="16"/>
  <rect x="0" y="0" width="900" height="64" fill="url(#hg)" rx="16"/>
  <rect x="0" y="48" width="900" height="16" fill="#B5101F"/>
  <text x="32" y="28" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FBD2D0" letter-spacing="2">SVG-BZ-018 · BUSINESS RESOLUTION ENGINE</text>
  <text x="32" y="50" font-size="17" font-weight="800" fill="#FFFFFF">GET /v1/integration · resolve everything at once</text>
  <text x="868" y="50" text-anchor="end" font-size="10.5" fill="#FBD2D0">API Key → Resolution</text>

  <!-- steps -->
  <rect x="360" y="90" width="180" height="40" rx="10" fill="#374151"/>
  <text x="450" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">API Key</text>
  <line x1="450" y1="130" x2="450" y2="152" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="330" y="154" width="240" height="40" rx="10" fill="url(#op)"/>
  <text x="450" y="179" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Resolve Business · status, KYB</text>
  <line x1="450" y1="194" x2="450" y2="216" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="330" y="218" width="240" height="40" rx="10" fill="url(#op)"/>
  <text x="450" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Resolve Wallet · accounts</text>
  <line x1="450" y1="258" x2="450" y2="280" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="330" y="282" width="240" height="40" rx="10" fill="url(#op)"/>
  <text x="450" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Resolve Pricing · category → rule</text>
  <line x1="450" y1="322" x2="450" y2="344" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="330" y="346" width="240" height="40" rx="10" fill="url(#op)"/>
  <text x="450" y="371" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Resolve Settlement · readiness</text>
  <line x1="450" y1="386" x2="450" y2="408" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="300" y="410" width="300" height="44" rx="10" fill="url(#hg)"/>
  <text x="450" y="431" text-anchor="middle" font-size="12.5" font-weight="800" fill="#FFFFFF">Business Resolution DTO</text>
  <text x="450" y="447" text-anchor="middle" font-size="9" fill="#FBD2D0">business · wallet · pricing · settlement · blockers</text>

  <!-- side note -->
  <rect x="620" y="154" width="250" height="232" rx="12" fill="#FFFFFF" stroke="#E7E2DE"/>
  <text x="636" y="176" font-size="10.5" font-weight="800" fill="#9A1B22">Blockers (why not ready)</text>
  <text x="636" y="198" font-size="9.5" fill="#374151">• BUSINESS_NOT_ACTIVE</text>
  <text x="636" y="216" font-size="9.5" fill="#374151">• KYB_NOT_APPROVED</text>
  <text x="636" y="234" font-size="9.5" fill="#374151">• WALLET_MISSING</text>
  <text x="636" y="252" font-size="9.5" fill="#374151">• WALLET_ACCOUNT_MISSING</text>
  <text x="636" y="270" font-size="9.5" fill="#374151">• PRICING_MISSING</text>
  <text x="636" y="298" font-size="9" fill="#6B7280">Empty blockers[] ⇒ the business can</text>
  <text x="636" y="313" font-size="9" fill="#6B7280">receive payments and settle.</text>
  <text x="636" y="345" font-size="9" fill="#6B7280">The app renders these; it never</text>
  <text x="636" y="360" font-size="9" fill="#6B7280">decides them — the operator does.</text>
</svg>
