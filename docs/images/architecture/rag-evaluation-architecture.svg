  <line x1="599" y1="298" x2="599" y2="318" stroke="#D4C9C7" stroke-width="1.5"/>
  <line x1="88" y1="318" x2="599" y2="318" stroke="#D4C9C7" stroke-width="1.5"/>
  <line x1="350" y1="318" x2="350" y2="330" stroke="#D4C9C7" stroke-width="1.5"/>
