<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="700" height="500" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="20" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="45" text-anchor="middle" fill="white" font-size="14" font-weight="700">Agentic Protocol Research — Multi-Step Reasoning</text>
  <text x="350" y="59" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">RECUPERAÇÃO MULTI-HOP · TRAVESSIA DE GRAFO · SÍNTESE</text>

  <!-- Step 1: Question -->
  <rect x="270" y="80" width="160" height="34" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="97" text-anchor="middle" fill="#1E293B" font-size="10" font-weight="600">Pergunta do Utilizador</text>
  <text x="350" y="108" text-anchor="middle" fill="#9CA3AF" font-size="8">Query string</text>

  <!-- Arrow down -->
  <line x1="350" y1="114" x2="350" y2="130" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2: Plan -->
  <rect x="230" y="132" width="240" height="34" rx="8" fill="#F5F1EE" stroke="#CBD5E1" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="240" y="138" width="14" height="14" rx="3" fill="#475569"/>
  <text x="330" y="148" text-anchor="middle" fill="#1E293B" font-size="10" font-weight="600">Etapa 1 — Plano</text>
  <text x="330" y="160" text-anchor="middle" fill="#9CA3AF" font-size="8">Decomposição da pergunta em sub-queries</text>

  <!-- Arrows down to retrieval + graph (parallel) -->
  <line x1="295" y1="166" x2="200" y2="192" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="405" y1="166" x2="500" y2="192" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3a: Qdrant retrieval -->
  <rect x="80" y="194" width="240" height="52" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#sh)"/>
  <text x="200" y="214" text-anchor="middle" fill="#1D4ED8" font-size="10" font-weight="600">Etapa 2 — Recuperação Primária</text>
  <text x="200" y="227" text-anchor="middle" fill="#3B82F6" font-size="8">Qdrant: top-10 por similaridade</text>
  <text x="200" y="239" text-anchor="middle" fill="#3B82F6" font-size="8">Autoridade × Semântica × Frescura</text>

  <!-- Step 3b: Graph traversal -->
  <rect x="380" y="194" width="240" height="52" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="500" y="214" text-anchor="middle" fill="#92400E" font-size="10" font-weight="600">Etapa 3 — Travessia de Grafo</text>
  <text x="500" y="227" text-anchor="middle" fill="#B45309" font-size="8">findNodeByPath → getNeighbours</text>
  <text x="500" y="239" text-anchor="middle" fill="#B45309" font-size="8">getRelated BFS (profundidade 2)</text>

  <!-- Arrows to secondary retrieval -->
  <line x1="200" y1="246" x2="270" y2="274" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="246" x2="430" y2="274" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4: secondary retrieval -->
  <rect x="180" y="276" width="340" height="40" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="295" text-anchor="middle" fill="#166534" font-size="10" font-weight="600">Etapa 4 — Recuperação Secundária</text>
  <text x="350" y="308" text-anchor="middle" fill="#16A34A" font-size="8">Top 3 nós de grafo → nova query Qdrant · merge + dedup</text>

  <!-- Arrow to contradiction -->
  <line x1="350" y1="316" x2="350" y2="332" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 5: contradiction detection -->
  <rect x="200" y="334" width="300" height="34" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="352" text-anchor="middle" fill="#92400E" font-size="10" font-weight="600">Etapa 5 — Detecção de Contradições</text>
  <text x="350" y="364" text-anchor="middle" fill="#B45309" font-size="8">Verifica conformance_result vs validation_result</text>

  <!-- Arrow to synthesis -->
  <line x1="350" y1="368" x2="350" y2="384" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 6: Synthesis -->
  <rect x="175" y="386" width="350" height="44" rx="8" fill="#990011" filter="url(#sh)"/>
  <text x="350" y="406" text-anchor="middle" fill="white" font-size="11" font-weight="700">Etapa 6 — Síntese</text>
  <text x="350" y="420" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="8">Modelo LLM · Evidências + Grafo → Resposta fundamentada</text>

  <!-- Outputs -->
  <line x1="280" y1="430" x2="200" y2="454" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="430" x2="350" y2="454" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="430" x2="500" y2="454" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="100" y="456" width="160" height="26" rx="6" fill="white" stroke="#E2D9D7" stroke-width="1"/>
  <text x="180" y="473" text-anchor="middle" fill="#64748B" font-size="9">Resposta sintetizada</text>

  <rect x="270" y="456" width="160" height="26" rx="6" fill="white" stroke="#E2D9D7" stroke-width="1"/>
  <text x="350" y="473" text-anchor="middle" fill="#64748B" font-size="9">Evidências citadas</text>

  <rect x="440" y="456" width="160" height="26" rx="6" fill="white" stroke="#E2D9D7" stroke-width="1"/>
  <text x="520" y="473" text-anchor="middle" fill="#64748B" font-size="9">Nós de grafo relevantes</text>

  <!-- Bottom label -->
  <text x="350" y="494" text-anchor="middle" fill="#9CA3AF" font-size="8">BanzAI · Protocol Research Agent · banzami.org</text>
</svg>
