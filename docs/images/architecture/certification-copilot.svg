<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 490" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="700" height="490" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="20" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="45" text-anchor="middle" fill="white" font-size="14" font-weight="700">Certification Copilot — Readiness Analysis</text>
  <text x="350" y="59" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">ANÁLISE DE CONFORMIDADE · ROADMAP DE CERTIFICAÇÃO</text>

  <!-- Inputs (top row) -->
  <rect x="40" y="82" width="190" height="60" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="135" y="104" text-anchor="middle" fill="#64748B" font-size="9" font-weight="700" letter-spacing="0.5">MANIFESTO DO OPERADOR</text>
  <text x="135" y="118" text-anchor="middle" fill="#9CA3AF" font-size="8">operator_id, environment</text>
  <text x="135" y="130" text-anchor="middle" fill="#9CA3AF" font-size="8">protocol_version, capabilities</text>

  <rect x="255" y="82" width="190" height="60" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="104" text-anchor="middle" fill="#64748B" font-size="9" font-weight="700" letter-spacing="0.5">CAPACIDADES DECLARADAS</text>
  <text x="350" y="118" text-anchor="middle" fill="#9CA3AF" font-size="8">supports_wallets, supports_transfers</text>
  <text x="350" y="130" text-anchor="middle" fill="#9CA3AF" font-size="8">supports_qr, supports_federation…</text>

  <rect x="470" y="82" width="190" height="60" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="565" y="104" text-anchor="middle" fill="#64748B" font-size="9" font-weight="700" letter-spacing="0.5">NÍVEL ALVO</text>
  <text x="565" y="118" text-anchor="middle" fill="#990011" font-size="22" font-weight="700">2</text>
  <text x="565" y="135" text-anchor="middle" fill="#9CA3AF" font-size="8">Trace-compatible</text>

  <!-- Arrows to copilot -->
  <line x1="135" y1="142" x2="260" y2="172" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="142" x2="350" y2="172" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="565" y1="142" x2="440" y2="172" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Copilot engine -->
  <rect x="180" y="174" width="340" height="44" rx="10" fill="#990011" filter="url(#sh)"/>
  <text x="350" y="197" text-anchor="middle" fill="white" font-size="12" font-weight="700">analyzeCertificationReadiness()</text>
  <text x="350" y="210" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="8">Avalia L0–L4 · Compara requisitos · Calcula score</text>

  <!-- Arrows to outputs -->
  <line x1="280" y1="218" x2="175" y2="244" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="218" x2="350" y2="244" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="218" x2="525" y2="244" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Output 1: Level statuses -->
  <rect x="40" y="246" width="260" height="100" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="264" text-anchor="middle" fill="#64748B" font-size="9" font-weight="700" letter-spacing="0.5">STATUS POR NÍVEL</text>
  <!-- Level bars -->
  <rect x="56" y="270" width="8" height="8" rx="2" fill="#374151"/>
  <text x="70" y="278" fill="#1E293B" font-size="8" font-weight="600">L0 — Reference-compatible</text>
  <rect x="56" y="282" width="176" height="5" rx="2" fill="#374151"/>
  <text x="238" y="287" fill="#16A34A" font-size="8">✓</text>

  <rect x="56" y="292" width="8" height="8" rx="2" fill="#2A3A8C"/>
  <text x="70" y="300" fill="#1E293B" font-size="8" font-weight="600">L1 — Protocol-compatible</text>
  <rect x="56" y="305" width="176" height="5" rx="2" fill="#2A3A8C"/>
  <text x="238" y="310" fill="#16A34A" font-size="8">✓</text>

  <rect x="56" y="316" width="8" height="8" rx="2" fill="#0E7490"/>
  <text x="70" y="324" fill="#1E293B" font-size="8" font-weight="600">L2 — Trace-compatible</text>
  <rect x="56" y="328" width="100" height="5" rx="2" fill="#0E7490"/>
  <text x="238" y="334" fill="#F59E0B" font-size="8">partial</text>

  <!-- Output 2: Readiness score -->
  <rect x="240" y="246" width="220" height="100" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="264" text-anchor="middle" fill="#64748B" font-size="9" font-weight="700" letter-spacing="0.5">READINESS SCORE</text>
  <text x="350" y="308" text-anchor="middle" fill="#990011" font-size="36" font-weight="700">67%</text>
  <!-- Progress bar -->
  <rect x="258" y="320" width="184" height="8" rx="4" fill="#F1F5F9"/>
  <rect x="258" y="320" width="123" height="8" rx="4" fill="#990011"/>
  <text x="350" y="340" text-anchor="middle" fill="#9CA3AF" font-size="8">Nível actual: 1 → Alvo: 2</text>

  <!-- Output 3: Missing + roadmap -->
  <rect x="420" y="246" width="240" height="100" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="540" y="264" text-anchor="middle" fill="#64748B" font-size="9" font-weight="700" letter-spacing="0.5">EM FALTA PARA L2</text>
  <rect x="436" y="270" width="208" height="16" rx="4" fill="#FEF3C7"/>
  <text x="436" y="267" fill="#92400E" font-size="7.5" font-family="ui-monospace, monospace">L2-001</text>
  <text x="454" y="282" fill="#92400E" font-size="8">Suporte a trace IDs em respostas</text>
  <rect x="436" y="290" width="208" height="16" rx="4" fill="#FEF3C7"/>
  <text x="436" y="287" fill="#92400E" font-size="7.5" font-family="ui-monospace, monospace">L2-002</text>
  <text x="454" y="302" fill="#92400E" font-size="8">Correlação de eventos por trace</text>
  <rect x="436" y="310" width="208" height="16" rx="4" fill="#FEF3C7"/>
  <text x="436" y="307" fill="#92400E" font-size="7.5" font-family="ui-monospace, monospace">L2-003</text>
  <text x="454" y="322" fill="#92400E" font-size="8">Webhook com trace_id</text>

  <!-- Roadmap section -->
  <rect x="40" y="360" width="620" height="100" rx="8" fill="white" stroke="#E2D9D7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="378" text-anchor="middle" fill="#64748B" font-size="9" font-weight="700" letter-spacing="0.5">ROADMAP DE CERTIFICAÇÃO</text>

  <!-- L0 -->
  <circle cx="90" cy="410" r="16" fill="#374151"/>
  <text x="90" y="415" text-anchor="middle" fill="white" font-size="12" font-weight="700">0</text>
  <line x1="106" y1="410" x2="174" y2="410" stroke="#374151" stroke-width="2"/>
  <text x="140" y="404" text-anchor="middle" fill="#64748B" font-size="7">✓ completo</text>

  <!-- L1 -->
  <circle cx="190" cy="410" r="16" fill="#2A3A8C"/>
  <text x="190" y="415" text-anchor="middle" fill="white" font-size="12" font-weight="700">1</text>
  <line x1="206" y1="410" x2="294" y2="410" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="250" y="404" text-anchor="middle" fill="#64748B" font-size="7">em progresso</text>

  <!-- L2 -->
  <circle cx="310" cy="410" r="16" fill="#0E7490" opacity="0.4"/>
  <text x="310" y="415" text-anchor="middle" fill="white" font-size="12" font-weight="700">2</text>
  <line x1="326" y1="410" x2="414" y2="410" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="370" y="404" text-anchor="middle" fill="#CBD5E1" font-size="7">2–3 semanas</text>

  <!-- L3 -->
  <circle cx="430" cy="410" r="16" fill="#7C3AED" opacity="0.3"/>
  <text x="430" y="415" text-anchor="middle" fill="white" font-size="12" font-weight="700">3</text>
  <line x1="446" y1="410" x2="534" y2="410" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- L4 -->
  <circle cx="550" cy="410" r="16" fill="#990011" opacity="0.3"/>
  <text x="550" y="415" text-anchor="middle" fill="white" font-size="12" font-weight="700">4</text>

  <text x="350" y="448" text-anchor="middle" fill="#9CA3AF" font-size="8">Esforço estimado: L1→L2 = 2–3 semanas · L2→L3 = 6–8 semanas · L3→L4 = 10–14 semanas</text>

  <!-- Bottom label -->
  <text x="350" y="476" text-anchor="middle" fill="#9CA3AF" font-size="8">BanzAI · Certification Copilot · banzami.org</text>
</svg>
