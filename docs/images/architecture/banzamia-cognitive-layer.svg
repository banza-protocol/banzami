<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 370" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000014"/>
    </filter>
  </defs>

  <rect width="700" height="370" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="22" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="47" text-anchor="middle" fill="white" font-size="14" font-weight="700">BanzamIA como Camada Cognitiva</text>
  <text x="350" y="61" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">ARQUITECTURA EM QUATRO CAMADAS</text>

  <!-- Connector line on left showing stack -->
  <line x1="54" y1="90" x2="54" y2="340" stroke="#D4C9C7" stroke-width="2"/>
  <polygon points="50,340 58,340 54,346" fill="#D4C9C7"/>

  <!-- ─── LAYER 4 (top): COGNITIVE — BanzamIA ─── -->
  <rect x="68" y="82" width="602" height="66" rx="10" fill="#FFF7F0" stroke="#FDBA74" stroke-width="1.5" filter="url(#sh)"/>
  <!-- Left label bar -->
  <rect x="68" y="82" width="148" height="66" rx="10" fill="#EA580C"/>
  <rect x="194" y="82" width="22" height="66" fill="#EA580C"/>
  <text x="142" y="111" text-anchor="middle" fill="white" font-size="9" font-weight="700" letter-spacing="1">CAMADA</text>
  <text x="142" y="126" text-anchor="middle" fill="white" font-size="9" font-weight="700" letter-spacing="1">COGNITIVA</text>
  <!-- Modules text -->
  <text x="232" y="108" fill="#C2410C" font-size="9" font-weight="700">BanzamIA — AI-native Protocol Agent</text>
  <text x="232" y="124" fill="#9A3412" font-size="9">Chat · Operator Builder · Conformance · Manifest Validator</text>
  <text x="232" y="138" fill="#9A3412" font-size="9">Trace Explainer · SDK Assistant · RFC/ADR Explorer · Knowledge Search</text>
  <!-- Pulse dot -->
  <circle cx="646" cy="115" r="5" fill="#EA580C" opacity="0.8"/>
  <circle cx="646" cy="115" r="8" fill="none" stroke="#EA580C" stroke-width="1" opacity="0.4"/>

  <!-- Connector -->
  <line x1="54" y1="148" x2="68" y2="148" stroke="#D4C9C7" stroke-width="1.5"/>

  <!-- ─── LAYER 3: GOVERNANCE ─── -->
  <rect x="68" y="158" width="602" height="52" rx="10" fill="#EEF2FF" stroke="#9BA8D4" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="68" y="158" width="148" height="52" rx="10" fill="#2A3A8C"/>
  <rect x="194" y="158" width="22" height="52" fill="#2A3A8C"/>
  <text x="142" y="181" text-anchor="middle" fill="white" font-size="9" font-weight="700" letter-spacing="1">CAMADA DE</text>
  <text x="142" y="196" text-anchor="middle" fill="white" font-size="9" font-weight="700" letter-spacing="1">GOVERNANÇA</text>
  <text x="232" y="184" fill="#2A3A8C" font-size="9" font-weight="700">Certificação · Conformidade · Federação</text>
  <text x="232" y="200" fill="#4B5A9C" font-size="9">RFCs · ADRs · Validation Matrix · Operator Manifests</text>

  <!-- Connector -->
  <line x1="54" y1="210" x2="68" y2="210" stroke="#D4C9C7" stroke-width="1.5"/>

  <!-- ─── LAYER 2: FINANCIAL ─── -->
  <rect x="68" y="220" width="602" height="52" rx="10" fill="#FEF9F5" stroke="#DBBCB2" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="68" y="220" width="148" height="52" rx="10" fill="#990011"/>
  <rect x="194" y="220" width="22" height="52" fill="#990011"/>
  <text x="142" y="243" text-anchor="middle" fill="white" font-size="9" font-weight="700" letter-spacing="1">CAMADA</text>
  <text x="142" y="258" text-anchor="middle" fill="white" font-size="9" font-weight="700" letter-spacing="1">FINANCEIRA</text>
  <text x="232" y="245" fill="#990011" font-size="9" font-weight="700">Kernel Banzami — Rust Financial Core</text>
  <text x="232" y="261" fill="#6B6265" font-size="9">Ledger · Wallets · Transactions · Settlement · QR · Payouts</text>

  <!-- Connector -->
  <line x1="54" y1="272" x2="68" y2="272" stroke="#D4C9C7" stroke-width="1.5"/>

  <!-- ─── LAYER 1 (bottom): PHYSICAL ─── -->
  <rect x="68" y="282" width="602" height="52" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="68" y="282" width="148" height="52" rx="10" fill="#475569"/>
  <rect x="194" y="282" width="22" height="52" fill="#475569"/>
  <text x="142" y="305" text-anchor="middle" fill="white" font-size="9" font-weight="700" letter-spacing="1">CAMADA</text>
  <text x="142" y="320" text-anchor="middle" fill="white" font-size="9" font-weight="700" letter-spacing="1">FÍSICA</text>
  <text x="232" y="305" fill="#475569" font-size="9" font-weight="700">Infraestrutura de Liquidação Angola</text>
  <text x="232" y="321" fill="#64748B" font-size="9">Banks · EMIS · Settlement Rails · Central Bank</text>

  <!-- Caption -->
  <text x="350" y="356" text-anchor="middle" fill="#9B8E8C" font-size="9">O Kernel move valor. BanzamIA move compreensão. O Kernel executa regras. BanzamIA explica regras.</text>

</svg>
