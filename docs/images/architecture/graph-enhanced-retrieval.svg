<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 510" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/>
    </filter>
  </defs>

  <rect width="700" height="510" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="22" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="47" text-anchor="middle" fill="white" font-size="14" font-weight="700">Graph-Enhanced Retrieval Pipeline</text>
  <text x="350" y="61" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">QDRANT VECTOR SEARCH + PROTOCOL GRAPH ENRICHMENT — BANZAI</text>

  <!-- STEP 1: User Question -->
  <rect x="245" y="86" width="210" height="36" rx="8" fill="white" stroke="#CBD5E1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="107" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">User Question</text>
  <text x="350" y="116" text-anchor="middle" fill="#94A3B8" font-size="7.5">natural language · any protocol topic</text>

  <!-- arrow -->
  <line x1="350" y1="122" x2="350" y2="136" stroke="#D4C9C7" stroke-width="1.5"/>
  <polygon points="345,136 355,136 350,142" fill="#D4C9C7"/>

  <!-- STEP 2: Embedding -->
  <rect x="245" y="142" width="210" height="32" rx="8" fill="white" stroke="#CBD5E1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="158" text-anchor="middle" fill="#475569" font-size="9" font-weight="600">Embedding Provider</text>
  <text x="350" y="168" text-anchor="middle" fill="#94A3B8" font-size="7.5">mock · local BGE-large · remote OpenAI-compat</text>

  <!-- arrow -->
  <line x1="350" y1="174" x2="350" y2="188" stroke="#D4C9C7" stroke-width="1.5"/>
  <polygon points="345,188 355,188 350,194" fill="#D4C9C7"/>

  <!-- STEP 3: Qdrant Vector Search -->
  <rect x="155" y="194" width="390" height="52" rx="8" fill="#2A3A8C" filter="url(#sh)"/>
  <text x="350" y="214" text-anchor="middle" fill="white" font-size="10" font-weight="700">Qdrant Vector Search</text>
  <text x="350" y="230" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="8">Cosine similarity · limit × 3 candidates · keyword fallback if score &lt; 0.45</text>
  <text x="350" y="241" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="7.5">source_type · status · language filters available</text>

  <!-- fork: left = authority ranking, right = graph enrichment -->
  <line x1="350" y1="246" x2="350" y2="258" stroke="#D4C9C7" stroke-width="1.5"/>
  <line x1="175" y1="258" x2="525" y2="258" stroke="#D4C9C7" stroke-width="1.5"/>
  <line x1="175" y1="258" x2="175" y2="268" stroke="#D4C9C7" stroke-width="1.5"/>
  <line x1="525" y1="258" x2="525" y2="268" stroke="#D4C9C7" stroke-width="1.5"/>

  <!-- LEFT: Authority Ranking -->
  <rect x="50" y="268" width="250" height="98" rx="8" fill="white" stroke="#9BA8D4" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="50" y="268" width="250" height="22" rx="8" fill="#2A3A8C"/>
  <rect x="50" y="281" width="250" height="9" fill="#2A3A8C"/>
  <text x="175" y="283" text-anchor="middle" fill="white" font-size="9" font-weight="700">Authority Ranking</text>
  <text x="175" y="300" text-anchor="middle" fill="#4B5A9C" font-size="7.5">final = semantic × authority × freshness</text>
  <rect x="60" y="305" width="230" height="14" rx="4" fill="#EFF2FF"/>
  <text x="175" y="315" text-anchor="middle" fill="#2A3A8C" font-size="7.5" font-weight="600">15 source types · reference 1.00 → draft_rfc 0.50</text>
  <rect x="60" y="322" width="230" height="14" rx="4" fill="#EFF2FF"/>
  <text x="175" y="332" text-anchor="middle" fill="#2A3A8C" font-size="7.5" font-weight="600">Freshness decay · half-life 180 days · floor 0.80</text>
  <rect x="60" y="339" width="230" height="14" rx="4" fill="#EFF2FF"/>
  <text x="175" y="349" text-anchor="middle" fill="#2A3A8C" font-size="7.5" font-weight="600">Dedup by path:startLine</text>

  <!-- RIGHT: Graph Enrichment -->
  <rect x="400" y="268" width="250" height="98" rx="8" fill="white" stroke="#FED7AA" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="400" y="268" width="250" height="22" rx="8" fill="#EA580C"/>
  <rect x="400" y="281" width="250" height="9" fill="#EA580C"/>
  <text x="525" y="283" text-anchor="middle" fill="white" font-size="9" font-weight="700">Protocol Graph Enrichment</text>
  <text x="525" y="300" text-anchor="middle" fill="#9A3412" font-size="7.5">Top-5 results → find graph nodes → get neighbours</text>
  <rect x="410" y="305" width="230" height="14" rx="4" fill="#FFF7F0"/>
  <text x="525" y="315" text-anchor="middle" fill="#9A3412" font-size="7.5" font-weight="600">IMPLEMENTS · SUPERSEDES · VALIDATES · REQUIRES</text>
  <rect x="410" y="322" width="230" height="14" rx="4" fill="#FFF7F0"/>
  <text x="525" y="332" text-anchor="middle" fill="#9A3412" font-size="7.5" font-weight="600">Max 2 neighbours per node · limit 3 added total</text>
  <rect x="410" y="339" width="230" height="14" rx="4" fill="#FFF7F0"/>
  <text x="525" y="349" text-anchor="middle" fill="#9A3412" font-size="7.5" font-weight="600">Added at score 0.4 · no duplicates</text>

  <!-- converge arrows -->
  <line x1="175" y1="366" x2="175" y2="386" stroke="#D4C9C7" stroke-width="1.5"/>
  <line x1="525" y1="366" x2="525" y2="386" stroke="#D4C9C7" stroke-width="1.5"/>
  <line x1="175" y1="386" x2="525" y2="386" stroke="#D4C9C7" stroke-width="1.5"/>
  <line x1="350" y1="386" x2="350" y2="398" stroke="#D4C9C7" stroke-width="1.5"/>
  <polygon points="345,398 355,398 350,404" fill="#D4C9C7"/>

  <!-- STEP 4: Context Builder -->
  <rect x="155" y="404" width="390" height="40" rx="8" fill="#EA580C" filter="url(#sh)"/>
  <text x="350" y="421" text-anchor="middle" fill="white" font-size="10" font-weight="700">Context Builder + Citation Model</text>
  <text x="350" y="435" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="8">Ranked chunks → prompt block → citations with path · section · authority · score</text>

  <!-- arrow -->
  <line x1="350" y1="444" x2="350" y2="456" stroke="#D4C9C7" stroke-width="1.5"/>
  <polygon points="345,456 355,456 350,462" fill="#D4C9C7"/>

  <!-- STEP 5: Answer -->
  <rect x="155" y="462" width="390" height="34" rx="8" fill="white" stroke="#CBD5E1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="477" text-anchor="middle" fill="#475569" font-size="9" font-weight="600">Grounded Answer + Inline Citations</text>
  <text x="350" y="489" text-anchor="middle" fill="#94A3B8" font-size="7.5">answer · citations[] · task_type · model · weak_retrieval · retrieval_mode</text>

  <!-- Analytics note -->
  <rect x="30" y="464" width="116" height="32" rx="6" fill="white" stroke="#D4C9C7" stroke-width="1"/>
  <text x="88" y="477" text-anchor="middle" fill="#64748B" font-size="7.5" font-weight="600">Analytics Tracker</text>
  <text x="88" y="489" text-anchor="middle" fill="#94A3B8" font-size="7">latency · task · sources</text>

  <rect x="554" y="464" width="116" height="32" rx="6" fill="white" stroke="#D4C9C7" stroke-width="1"/>
  <text x="612" y="477" text-anchor="middle" fill="#64748B" font-size="7.5" font-weight="600">GET /rag/stats</text>
  <text x="612" y="489" text-anchor="middle" fill="#94A3B8" font-size="7">live query analytics</text>
</svg>
