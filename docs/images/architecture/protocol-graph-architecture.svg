  <text x="524" y="456" fill="#64748B" font-size="7.5" font-weight="600">REFERENCES</text>
  <text x="350" y="472" text-anchor="middle" fill="#94A3B8" font-size="7.5">Graph indexed from markdown cross-references · npm run graph:index · stored in .banzamia-graph.json</text>
