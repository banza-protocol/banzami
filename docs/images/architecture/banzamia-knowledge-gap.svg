<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/>
    </filter>
  </defs>

  <rect width="700" height="460" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="22" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="47" text-anchor="middle" fill="white" font-size="14" font-weight="700">O Fosso de Conhecimento do Protocolo</text>
  <text x="350" y="61" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">ANTES E DEPOIS DA BANZAI</text>

  <!-- ─── LEFT: SEM BANZAI ─── -->
  <rect x="30" y="80" width="305" height="362" rx="12" fill="white" stroke="#DBBCB2" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="30" y="80" width="305" height="36" rx="12" fill="#7F1D1D"/>
  <rect x="30" y="102" width="305" height="14" fill="#7F1D1D"/>
  <text x="182" y="103" text-anchor="middle" fill="white" font-size="11" font-weight="700" letter-spacing="1">SEM BANZAI</text>

  <!-- Steps -->
  <rect x="46" y="126" width="273" height="36" rx="7" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="182" y="149" text-anchor="middle" fill="#991B1B" font-size="10" font-weight="600">Programador começa</text>

  <text x="182" y="172" text-anchor="middle" fill="#9CA3AF" font-size="11">↓</text>

  <rect x="46" y="178" width="273" height="36" rx="7" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="182" y="201" text-anchor="middle" fill="#991B1B" font-size="10" font-weight="600">Lê centenas de páginas de documentação</text>

  <text x="182" y="224" text-anchor="middle" fill="#9CA3AF" font-size="11">↓</text>

  <rect x="46" y="230" width="273" height="36" rx="7" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="182" y="253" text-anchor="middle" fill="#991B1B" font-size="10" font-weight="600">Pesquisa RFCs e ADRs manualmente</text>

  <text x="182" y="276" text-anchor="middle" fill="#9CA3AF" font-size="11">↓</text>

  <rect x="46" y="282" width="273" height="36" rx="7" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="182" y="305" text-anchor="middle" fill="#991B1B" font-size="10" font-weight="600">Tenta implementação → comete erros</text>

  <text x="182" y="328" text-anchor="middle" fill="#9CA3AF" font-size="11">↓</text>

  <rect x="46" y="334" width="273" height="36" rx="7" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="182" y="357" text-anchor="middle" fill="#991B1B" font-size="10" font-weight="600">Falha na validação → recomeça</text>

  <text x="182" y="378" text-anchor="middle" fill="#9CA3AF" font-size="11">↓</text>

  <!-- Outcome -->
  <rect x="46" y="384" width="273" height="48" rx="8" fill="#7F1D1D"/>
  <text x="182" y="406" text-anchor="middle" fill="white" font-size="11" font-weight="700">Semanas perdidas</text>
  <text x="182" y="422" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Onboarding lento · Custo elevado · Mais erros</text>

  <!-- ─── RIGHT: COM BANZAI ─── -->
  <rect x="365" y="80" width="305" height="362" rx="12" fill="white" stroke="#FED7AA" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="365" y="80" width="305" height="36" rx="12" fill="#EA580C"/>
  <rect x="365" y="102" width="305" height="14" fill="#EA580C"/>
  <text x="517" y="103" text-anchor="middle" fill="white" font-size="11" font-weight="700" letter-spacing="1">COM BANZAI</text>

  <!-- Steps -->
  <rect x="381" y="126" width="273" height="36" rx="7" fill="#FFF7F0" stroke="#FED7AA" stroke-width="1"/>
  <text x="517" y="149" text-anchor="middle" fill="#9A3412" font-size="10" font-weight="600">Programador começa</text>

  <text x="517" y="172" text-anchor="middle" fill="#9CA3AF" font-size="11">↓</text>

  <rect x="381" y="178" width="273" height="36" rx="7" fill="#FFF7F0" stroke="#FED7AA" stroke-width="1"/>
  <text x="517" y="201" text-anchor="middle" fill="#9A3412" font-size="10" font-weight="600">Pergunta à BanzAI</text>

  <text x="517" y="224" text-anchor="middle" fill="#9CA3AF" font-size="11">↓</text>

  <rect x="381" y="230" width="273" height="36" rx="7" fill="#FFF7F0" stroke="#FED7AA" stroke-width="1"/>
  <text x="517" y="248" text-anchor="middle" fill="#9A3412" font-size="10" font-weight="600">Recebe resposta contextual</text>
  <text x="517" y="261" text-anchor="middle" fill="#C2410C" font-size="8">fundamentada em RFCs e ADRs</text>

  <text x="517" y="276" text-anchor="middle" fill="#9CA3AF" font-size="11">↓</text>

  <rect x="381" y="282" width="273" height="36" rx="7" fill="#FFF7F0" stroke="#FED7AA" stroke-width="1"/>
  <text x="517" y="305" text-anchor="middle" fill="#9A3412" font-size="10" font-weight="600">Recebe orientação de implementação</text>

  <text x="517" y="328" text-anchor="middle" fill="#9CA3AF" font-size="11">↓</text>

  <!-- Outcome (taller — more space to show benefits) -->
  <rect x="381" y="334" width="273" height="98" rx="8" fill="#EA580C"/>
  <text x="517" y="363" text-anchor="middle" fill="white" font-size="13" font-weight="700">Implementação correcta</text>
  <text x="517" y="382" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9">Onboarding rápido · Custo reduzido</text>
  <text x="517" y="398" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9">Certificação mais rápida · Menos erros</text>
  <text x="517" y="420" text-anchor="middle" fill="white" font-size="12" font-weight="800" letter-spacing="0.5">Semanas → Minutos</text>

</svg>
