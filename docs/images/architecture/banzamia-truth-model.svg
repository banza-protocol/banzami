<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 374" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990011"/>
      <stop offset="100%" style="stop-color:#B11226"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/>
    </filter>
  </defs>

  <rect width="700" height="374" fill="#F5F1EE"/>

  <!-- Title -->
  <rect x="30" y="22" width="640" height="44" rx="10" fill="url(#hG)" filter="url(#sh)"/>
  <text x="350" y="47" text-anchor="middle" fill="white" font-size="14" font-weight="700">Modelo de Verdade do Protocolo</text>
  <text x="350" y="61" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" letter-spacing="1">FERRAMENTAS DETERMINAM A VERDADE · IA EXPLICA A VERDADE</text>

  <!-- SECTION 1: Protocol Truth Sources (background) -->
  <rect x="30" y="76" width="640" height="86" rx="10" fill="#EEF2FF" stroke="#9BA8D4" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="90" text-anchor="middle" fill="#2A3A8C" font-size="9" font-weight="700" letter-spacing="0.5">FONTES DE VERDADE DO PROTOCOLO — determinísticas · não inferidas</text>

  <!-- 7 source boxes (x: 31, 123, 215, 307, 399, 491, 583 — w=86, h=46, y=98) -->
  <rect x="31" y="98" width="86" height="46" rx="6" fill="white" stroke="#9BA8D4" stroke-width="1" filter="url(#sh)"/>
  <text x="74" y="117" text-anchor="middle" fill="#2A3A8C" font-size="9" font-weight="700">RFCs</text>
  <text x="74" y="132" text-anchor="middle" fill="#4B5A9C" font-size="7.5">Especificações</text>

  <rect x="123" y="98" width="86" height="46" rx="6" fill="white" stroke="#9BA8D4" stroke-width="1" filter="url(#sh)"/>
  <text x="166" y="117" text-anchor="middle" fill="#2A3A8C" font-size="9" font-weight="700">ADRs</text>
  <text x="166" y="132" text-anchor="middle" fill="#4B5A9C" font-size="7.5">Decisões técnicas</text>

  <rect x="215" y="98" width="86" height="46" rx="6" fill="white" stroke="#9BA8D4" stroke-width="1" filter="url(#sh)"/>
  <text x="258" y="117" text-anchor="middle" fill="#2A3A8C" font-size="9" font-weight="700">Schemas</text>
  <text x="258" y="132" text-anchor="middle" fill="#4B5A9C" font-size="7.5">JSON · YAML</text>

  <rect x="307" y="98" width="86" height="46" rx="6" fill="white" stroke="#9BA8D4" stroke-width="1" filter="url(#sh)"/>
  <text x="350" y="117" text-anchor="middle" fill="#2A3A8C" font-size="9" font-weight="700">Validators</text>
  <text x="350" y="132" text-anchor="middle" fill="#4B5A9C" font-size="7.5">Motores</text>

  <rect x="399" y="98" width="86" height="46" rx="6" fill="white" stroke="#9BA8D4" stroke-width="1" filter="url(#sh)"/>
  <text x="442" y="117" text-anchor="middle" fill="#2A3A8C" font-size="9" font-weight="700">Conformance</text>
  <text x="442" y="132" text-anchor="middle" fill="#4B5A9C" font-size="7.5">Testes</text>

  <rect x="491" y="98" width="86" height="46" rx="6" fill="white" stroke="#9BA8D4" stroke-width="1" filter="url(#sh)"/>
  <text x="534" y="117" text-anchor="middle" fill="#2A3A8C" font-size="9" font-weight="700">Traces</text>
  <text x="534" y="132" text-anchor="middle" fill="#4B5A9C" font-size="7.5">Registos</text>

  <rect x="583" y="98" width="86" height="46" rx="6" fill="white" stroke="#9BA8D4" stroke-width="1" filter="url(#sh)"/>
  <text x="626" y="117" text-anchor="middle" fill="#2A3A8C" font-size="9" font-weight="700">Contratos</text>
  <text x="626" y="132" text-anchor="middle" fill="#4B5A9C" font-size="7.5">OpenAPI</text>

  <!-- Converging lines from section bottom to truth layer -->
  <line x1="74"  y1="162" x2="74"  y2="172" stroke="#9BA8D4" stroke-width="1"/>
  <line x1="166" y1="162" x2="166" y2="172" stroke="#9BA8D4" stroke-width="1"/>
  <line x1="258" y1="162" x2="258" y2="172" stroke="#9BA8D4" stroke-width="1"/>
  <line x1="350" y1="162" x2="350" y2="172" stroke="#9BA8D4" stroke-width="1.5"/>
  <line x1="442" y1="162" x2="442" y2="172" stroke="#9BA8D4" stroke-width="1"/>
  <line x1="534" y1="162" x2="534" y2="172" stroke="#9BA8D4" stroke-width="1"/>
  <line x1="626" y1="162" x2="626" y2="172" stroke="#9BA8D4" stroke-width="1"/>
  <line x1="74"  y1="172" x2="626" y2="172" stroke="#9BA8D4" stroke-width="1"/>

  <!-- TRUTH LAYER BAR -->
  <rect x="30" y="174" width="640" height="30" rx="8" fill="#166534" filter="url(#sh)"/>
  <text x="350" y="187" text-anchor="middle" fill="white" font-size="10" font-weight="700">CAMADA DE VERDADE DETERMINÍSTICA</text>
  <text x="350" y="199" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="8">Ferramentas verificam · Sem alucinação possível · Resultados auditáveis</text>

  <!-- Arrow down from truth layer -->
  <line x1="350" y1="204" x2="350" y2="214" stroke="#D4C9C7" stroke-width="1.5"/>
  <polygon points="345,214 355,214 350,220" fill="#D4C9C7"/>

  <!-- SECTION 2: AI Explanation (background) -->
  <rect x="30" y="220" width="640" height="82" rx="10" fill="#FFF7F0" stroke="#FED7AA" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="234" text-anchor="middle" fill="#C2410C" font-size="9" font-weight="700" letter-spacing="0.5">CAMADA DE EXPLICAÇÃO — IA transforma verdade verificada em orientação humana</text>

  <!-- 3 AI role boxes (x: 30, 250, 470 — w=200, h=54, y=240) -->
  <rect x="40" y="240" width="190" height="54" rx="7" fill="white" stroke="#FED7AA" stroke-width="1" filter="url(#sh)"/>
  <text x="135" y="258" text-anchor="middle" fill="#C2410C" font-size="9" font-weight="700">Recebe factos verificados</text>
  <text x="135" y="274" text-anchor="middle" fill="#6B6265" font-size="7.5">Resultado de ferramentas</text>
  <text x="135" y="286" text-anchor="middle" fill="#6B6265" font-size="7.5">determinísticas e RAG</text>

  <rect x="255" y="240" width="190" height="54" rx="7" fill="white" stroke="#FED7AA" stroke-width="1" filter="url(#sh)"/>
  <text x="350" y="258" text-anchor="middle" fill="#C2410C" font-size="9" font-weight="700">Traduz para linguagem humana</text>
  <text x="350" y="274" text-anchor="middle" fill="#6B6265" font-size="7.5">Contexto · orientação</text>
  <text x="350" y="286" text-anchor="middle" fill="#6B6265" font-size="7.5">exemplos · próximos passos</text>

  <rect x="470" y="240" width="190" height="54" rx="7" fill="white" stroke="#FED7AA" stroke-width="1" filter="url(#sh)"/>
  <text x="565" y="258" text-anchor="middle" fill="#C2410C" font-size="9" font-weight="700">Cita fontes · declara incerteza</text>
  <text x="565" y="274" text-anchor="middle" fill="#6B6265" font-size="7.5">Resposta fundamentada</text>
  <text x="565" y="286" text-anchor="middle" fill="#6B6265" font-size="7.5">e auditável</text>

  <!-- Arrow down to human answer -->
  <line x1="350" y1="302" x2="350" y2="312" stroke="#D4C9C7" stroke-width="1.5"/>
  <polygon points="345,312 355,312 350,318" fill="#D4C9C7"/>

  <!-- HUMAN ANSWER -->
  <rect x="185" y="318" width="330" height="36" rx="8" fill="#EDF7ED" stroke="#86EFAC" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="334" text-anchor="middle" fill="#166534" font-size="11" font-weight="700">Resposta Humana ✓</text>
  <text x="350" y="348" text-anchor="middle" fill="#4B7A51" font-size="8">Fundamentada · auditável · com citações de protocolo</text>

  <!-- Caption -->
  <text x="350" y="366" text-anchor="middle" fill="#9B8E8C" font-size="9">"Ferramentas determinam a verdade. A IA explica a verdade." — Princípio fundamental do BanzamIA</text>
</svg>
