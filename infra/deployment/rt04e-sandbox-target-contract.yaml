# RT04E Sandbox target contract (declarative, non-secret).
#
# The single authoritative allowlist + source-to-runtime mapping the RT04E runner
# MUST load and enforce. It contains no credentials, hostnames, URLs, database
# names or secret paths. The runner fails closed if the selected target is not
# sandbox, if any requested service is outside the allowlist, if a prohibited
# service resolves, if a required sandbox service is unmapped, or if the compose
# mapping is incomplete/ambiguous.
version: 1
rt04e_sandbox_target_contract:
  permitted_environment: sandbox            # the ONLY permitted environment
  canonical_source_root: /srv/banzami/src   # the ONLY permitted build source root

  # The exact RT04E sandbox service set — deploy these four and NO others.
  approved_service_allowlist:
    - core-api-staging
    - api-gateway-staging
    - developer-api
    - public-api-staging

  # Never deploy these (live/non-staging/out-of-scope). Also any name containing
  # prod/production/live is rejected by pattern, plus the bare non-staging names.
  prohibited_services:
    - core-api
    - api-gateway
    - public-api
    - admin-api
    - admin-api-staging
  prohibited_name_patterns:
    - prod
    - production
    - live

  # Explicit, reviewable source-to-runtime mapping. Each approved service names the
  # canonical build context category and the compose file/overlay it is deployed
  # into (structural categories only — no host paths beyond the canonical root).
  service_mapping:
    core-api-staging:
      build_context: canonical_source_root:/core
      compose_file: docker-compose.yml            # sandbox base stack
      deploy_op: staging_retag_and_up             # build :latest (labelled) -> retag :adr021-staging -> up
    public-api-staging:
      build_context: canonical_service_build_dir:public-api
      compose_file: docker-compose.yml
      deploy_op: staging_retag_and_up
    developer-api:
      build_context: canonical_service_build_dir:developer-api
      compose_file: docker-compose.yml
      deploy_op: build_and_up
    api-gateway-staging:
      build_context: canonical_service_build_dir:api-gateway
      compose_file: docker-compose.sandbox-gateway.yml   # canonical sandbox overlay
      deploy_op: overlay_build_and_up

  # Immutable provenance: every deployed image must carry this label = the required
  # canonical revision; the post-deploy gate fails otherwise, inspecting the ACTUAL
  # running container image (not merely a local tag).
  revision_label_key: org.opencontainers.image.revision

  # Build-to-runtime continuity: the adapter builds each service's OWN image repo
  # (below), labels it, and tags it to the EXACT Compose-declared image reference
  # (derived structurally at runtime). The pre-mutation attestation fails if any
  # Compose-declared image repo != the expected build repo.
  image_build_repo:
    core-api-staging: banzami/core-api
    public-api-staging: banzami/public-api
    developer-api: banzami/developer-api
    api-gateway-staging: banzami/api-gateway

  # IMMUTABLE release reference — the ONLY deployed reference. Never a mutable tag.
  immutable_release_reference_rule: "banzami/<image_build_repo>:rt04e-<canonical_release_revision>"
  prohibited_image_tags: [latest, adr021-staging, generic-staging-tags, service-name-derived-repos]
  canonical_release_revision_rule: "required; strict git revision; equals verified canonical HEAD; never inferred from an arbitrary directory; never shell-evaluated"

  # RT04E image override (source-controlled template → generated root-owned override).
  image_override_template: infra/deployment/rt04e-sandbox-images.override.template.yml
  image_override_required: true
  service_image_resolution: literal_after_semantic_compose_config   # docker compose config, not grep/awk

  # Fixed Compose file order per operation (never caller input) + mandatory isolation.
  compose_file_order: [docker-compose.yml, docker-compose.sandbox-gateway.yml, generated-rt04e-override]
  deploy_isolation_flags: ["--no-build", "--pull never", "--force-recreate", "--no-deps"]
  no_automatic_prune: true    # RT04E never prunes; pre-state rollback tags are retained

  # Only unauthenticated local liveness is permitted during RT04E.
  required_health_endpoint_categories:
    - unauthenticated_local_liveness           # /health, no auth, no mutation
  health_probe_mechanism: docker_healthcheck_status   # container's own /health probe
  health_path_category: local_health            # no host/URL/port stored here
  success_requires: [running_image_revision_label_match, local_health_pass]

  rollback:
    eligible_services:                          # rollback restores ONLY these
      - core-api-staging
      - api-gateway-staging
      - developer-api
      - public-api-staging
    application_image_rollback: allowed_sandbox_only
    database_migration_rollback: forbidden_forward_only

  # RT04E scope is provenance + deployment integrity ONLY.
  financial_e2e_in_scope: false
  scope_statement: >-
    RT04E proves canonical Sandbox runtime provenance and deployment integrity only.
    It does not prove feature release, authentication, developer-console access,
    payment, transfer, refund, webhook, QR, mobile or financial E2E behaviour.
