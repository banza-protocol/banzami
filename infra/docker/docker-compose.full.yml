# Full-stack Compose — all infrastructure + all application services.
#
# IMPORTANT: Database migrations must be applied before starting app services.
# Run `make stack-up` which handles the correct startup order automatically.
# Never run `docker compose -f docker-compose.full.yml up` directly on a fresh
# database without migrations applied first.
#
# Prerequisites:
#   - .env file at the repo root (copy from .env.example)
#   - For core-api: run `make sqlx-prepare` and commit .sqlx/ before building

services:

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     banzami
      POSTGRES_PASSWORD: banzami_dev
      POSTGRES_DB:       banzami_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U banzami -d banzami_dev"]
      interval: 5s
      timeout:  5s
      retries:  10
    restart: unless-stopped
    networks:
      - banzami_net

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test:     ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout:  3s
      retries:  10
    restart: unless-stopped
    networks:
      - banzami_net

  # ─── Observability stack ──────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v3.3.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../../infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - banzami_net

  grafana:
    image: grafana/grafana:12.0.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: banzami_dev
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - ../../infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - banzami_net

  # ─── Application services ────────────────────────────────────────────────────

  # Rust financial core — the single source of financial truth.
  # Only reachable from within the banzami_net Docker network.
  #
  # The published port is bound to 127.0.0.1 so it is reachable for local
  # debugging but NEVER from the network. A bare "8081:8081" binds 0.0.0.0 and
  # would publish core's entire /internal/v1 surface — merchant provisioning,
  # API-key minting, wallet credit, settlement, payouts, compliance decisions —
  # on the host's public interface, where almost none of those routes require a
  # credential (they trust the network boundary). Do not remove the 127.0.0.1
  # prefix; a host firewall is a second control, not a substitute for this one.
  core-api:
    build:
      context: ../../core
      dockerfile: Dockerfile
    environment:
      DATABASE_URL:       postgres://banzami:banzami_dev@postgres:5432/banzami_dev
      CORE_API_PORT:      "8081"
      TRANSIT_ACCOUNT_ID: ${TRANSIT_ACCOUNT_ID}
      BANK_ACCOUNT_ID:    ${BANK_ACCOUNT_ID}
      OPERATOR_FEE_REVENUE_ACCOUNT_ID: ${OPERATOR_FEE_REVENUE_ACCOUNT_ID}
      RUST_LOG:           core_api=info,warn
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:     ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout:  5s
      start_period: 20s
      retries:  5
    restart: unless-stopped
    networks:
      - banzami_net

  # Go public API gateway — the internet-facing service.
  #
  # Published on 127.0.0.1 only. Public traffic arrives through the nginx
  # container, which reaches every upstream over the banzami_net Docker network
  # by service name (see infra/nginx/*.conf) — never through a host port. A
  # 0.0.0.0 publication therefore adds no routing, but does add a plaintext
  # path straight to the API that bypasses nginx and its TLS termination.
  api-gateway:
    build:
      context: ../../services/api-gateway
      dockerfile: Dockerfile
    environment:
      PORT:                     "8080"
      JWT_SECRET:               ${JWT_SECRET}
      CORE_API_URL:             http://core-api:8081
      REDIS_URL:                redis://redis:6379
      DATABASE_URL:             postgres://banzami:banzami_dev@postgres:5432/banzami_dev
      LOG_LEVEL:                ${LOG_LEVEL:-info}
      OTLP_ENDPOINT:            ${OTLP_ENDPOINT:-}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      WEBHOOK_ENCRYPTION_KEY:   ${WEBHOOK_ENCRYPTION_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      core-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - banzami_net

  # Go admin API — internal only, never exposed to the internet.
  admin-api:
    build:
      context: ../../services/admin-api
      dockerfile: Dockerfile
    environment:
      ADMIN_API_PORT: "8082"
      CORE_API_URL:   http://core-api:8081
      ADMIN_API_KEY:  ${ADMIN_API_KEY}
      LOG_LEVEL:      ${LOG_LEVEL:-info}
      OTLP_ENDPOINT:  ${OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      core-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - banzami_net

  # Go public API — consumer-facing (mobile app, pay page).
  public-api:
    build:
      context: ../../services/public-api
      dockerfile: Dockerfile
    environment:
      PUBLIC_API_PORT:           "8083"
      CORE_API_URL:              http://core-api:8081
      DATABASE_URL:              postgres://banzami:banzami_dev@postgres:5432/banzami_dev
      JWT_SECRET:                ${JWT_SECRET}
      LOG_LEVEL:                 ${LOG_LEVEL:-info}
      OTLP_ENDPOINT:             ${OTLP_ENDPOINT:-}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test:     ["CMD", "curl", "-fsS", "http://localhost:8083/health"]
      interval: 10s
      timeout:  5s
      start_period: 15s
      retries:  5
    restart: unless-stopped
    networks:
      - banzami_net

  # ─── Sandbox / staging stack ──────────────────────────────────────────────────
  # DEPRECATED AS DEPLOYMENT AUTHORITY (Stage C Decision 1, 2026-07-10): the
  # rt04e sandbox project is the authoritative staging / Developer Platform
  # runtime on the server. The staging services below exist for LOCAL
  # DEVELOPMENT ONLY and must not be used as a server deploy path — the legacy
  # `./deploy.sh staging` path is retired (fails closed). See
  # docs/infra/BANZAMI_SERVICE_AUTHORITY_MATRIX.md.
  # Completely isolated from the live stack above.
  # Sandbox data NEVER touches the live database.
  # Reachable within banzami_net as: core-api-staging:8081, public-api-staging:8083

  postgres-sandbox:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     banzami
      POSTGRES_PASSWORD: banzami_sandbox
      POSTGRES_DB:       banzami_sandbox
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_sandbox_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U banzami -d banzami_sandbox"]
      interval: 5s
      timeout:  5s
      retries:  10
    restart: unless-stopped
    networks:
      - banzami_net

  core-api-staging:
    build:
      context: ../../core
      dockerfile: Dockerfile
    environment:
      DATABASE_URL:       postgres://banzami:banzami_sandbox@postgres-sandbox:5432/banzami_sandbox
      CORE_API_PORT:      "8081"
      TRANSIT_ACCOUNT_ID: ${TRANSIT_ACCOUNT_ID_SANDBOX:-${TRANSIT_ACCOUNT_ID}}
      BANK_ACCOUNT_ID:    ${BANK_ACCOUNT_ID_SANDBOX:-${BANK_ACCOUNT_ID}}
      OPERATOR_FEE_REVENUE_ACCOUNT_ID: ${OPERATOR_FEE_REVENUE_ACCOUNT_ID_SANDBOX:-${OPERATOR_FEE_REVENUE_ACCOUNT_ID}}
      RUST_LOG:           core_api=info,warn
    ports:
      - "127.0.0.1:8084:8081"
    depends_on:
      postgres-sandbox:
        condition: service_healthy
    healthcheck:
      test:     ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout:  5s
      start_period: 20s
      retries:  5
    restart: unless-stopped
    networks:
      - banzami_net

  public-api-staging:
    build:
      context: ../../services/public-api
      dockerfile: Dockerfile
    environment:
      PUBLIC_API_PORT:           "8083"
      CORE_API_URL:              http://core-api-staging:8081
      DATABASE_URL:              postgres://banzami:banzami_sandbox@postgres-sandbox:5432/banzami_sandbox
      JWT_SECRET:                ${SANDBOX_JWT_SECRET:-${JWT_SECRET}}
      LOG_LEVEL:                 ${LOG_LEVEL:-info}
      OTLP_ENDPOINT:             ${OTLP_ENDPOINT:-}
      ENVIRONMENT:               SANDBOX
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
    ports:
      - "127.0.0.1:8085:8083"
    depends_on:
      core-api-staging:
        condition: service_healthy
    healthcheck:
      test:     ["CMD", "curl", "-fsS", "http://localhost:8083/health"]
      interval: 10s
      timeout:  5s
      start_period: 15s
      retries:  5
    restart: unless-stopped
    networks:
      - banzami_net

  # ─── Sandbox operator (BANZA L0) ──────────────────────────────────────────────
  # Minimal, stateless BANZA L0 (Protocol Sandbox) runtime behind
  # sandbox-api.banzami.com. No database, no money movement, simulated=true,
  # production_allowed=false. Internal-only — nginx proxies to sandbox-operator:8085.
  sandbox-operator:
    build:
      context: ../../services/sandbox-operator
      dockerfile: Dockerfile
    environment:
      SANDBOX_OPERATOR_PORT: "8085"
    healthcheck:
      test:     ["CMD", "curl", "-fsS", "http://localhost:8085/health"]
      interval: 10s
      timeout:  5s
      start_period: 5s
      retries:  5
    restart: unless-stopped
    networks:
      - banzami_net

  # ─── Frontend applications ────────────────────────────────────────────────────

  # Next.js pay page — public payment link checkout (pay.banzami.com).
  pay-frontend:
    build:
      context: ../../apps/pay
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_GATEWAY_URL: https://api.banzami.com
      STAGING_GATEWAY_URL:     http://public-api-staging:8083
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - banzami_net

  # Next.js official website (banzami.com) — public marketing/institutional site.
  # Isolated from the payment runtime: no depends_on, makes no API calls. Port
  # 3000 is internal-only; the dedicated website-nginx below terminates TLS.
  website-frontend:
    build:
      context: ../../apps/website
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - banzami_net

  # Dedicated nginx for the website ONLY — owns origin port 8443 (kept off the
  # BANZA/payment nginx on :443). Cloudflare (separate Banzami zone) routes
  # banzami.com → origin 217.160.9.248:8443. Config: infra/nginx/website.conf.
  website-nginx:
    image: nginx:1.27-alpine
    ports:
      - "8443:443"
    volumes:
      - ../nginx/website.conf:/etc/nginx/conf.d/website.conf:ro
      - ./website-certs:/etc/nginx/certs:ro
    depends_on:
      - website-frontend
    restart: unless-stopped
    networks:
      - banzami_net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  postgres_sandbox_data:

networks:
  banzami_net:
    driver: bridge
