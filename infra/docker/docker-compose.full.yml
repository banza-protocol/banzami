# Full-stack Compose — all infrastructure + all application services.
#
# IMPORTANT: Database migrations must be applied before starting app services.
# Run `make stack-up` which handles the correct startup order automatically.
# Never run `docker compose -f docker-compose.full.yml up` directly on a fresh
# database without migrations applied first.
#
# Prerequisites:
#   - .env file at the repo root (copy from .env.example)
#   - For core-api: run `make sqlx-prepare` and commit .sqlx/ before building

services:

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     banzami
      POSTGRES_PASSWORD: banzami_dev
      POSTGRES_DB:       banzami_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U banzami -d banzami_dev"]
      interval: 5s
      timeout:  5s
      retries:  10
    restart: unless-stopped
    networks:
      - banzami_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  10
    restart: unless-stopped
    networks:
      - banzami_net

  # ─── Observability stack ──────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v3.3.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ../../infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - banzami_net

  grafana:
    image: grafana/grafana:12.0.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: banzami_dev
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - ../../infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - banzami_net

  # ─── Application services ────────────────────────────────────────────────────

  # Rust financial core — the single source of financial truth.
  # Only reachable from within the banzami_net Docker network.
  # Port 8081 is exposed here for local debugging only; in production
  # it should be firewalled and only accessible via loopback.
  core-api:
    build:
      context: ../../core
      dockerfile: Dockerfile
    environment:
      DATABASE_URL:       postgres://banzami:banzami_dev@postgres:5432/banzami_dev
      CORE_API_PORT:      "8081"
      TRANSIT_ACCOUNT_ID: ${TRANSIT_ACCOUNT_ID}
      BANK_ACCOUNT_ID:    ${BANK_ACCOUNT_ID}
      RUST_LOG:           core_api=info,warn
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:     ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout:  5s
      start_period: 20s
      retries:  5
    restart: unless-stopped
    networks:
      - banzami_net

  # Go public API gateway — the only internet-facing service.
  api-gateway:
    build:
      context: ../../services/api-gateway
      dockerfile: Dockerfile
    environment:
      PORT:                     "8080"
      JWT_SECRET:               ${JWT_SECRET}
      CORE_API_URL:             http://core-api:8081
      REDIS_URL:                redis://redis:6379
      DATABASE_URL:             postgres://banzami:banzami_dev@postgres:5432/banzami_dev
      LOG_LEVEL:                ${LOG_LEVEL:-info}
      OTLP_ENDPOINT:            ${OTLP_ENDPOINT:-}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
    ports:
      - "8080:8080"
    depends_on:
      core-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - banzami_net

  # Go admin API — internal only, never exposed to the internet.
  admin-api:
    build:
      context: ../../services/admin-api
      dockerfile: Dockerfile
    environment:
      ADMIN_API_PORT: "8082"
      CORE_API_URL:   http://core-api:8081
      ADMIN_API_KEY:  ${ADMIN_API_KEY}
      LOG_LEVEL:      ${LOG_LEVEL:-info}
      OTLP_ENDPOINT:  ${OTLP_ENDPOINT:-}
    ports:
      - "8082:8082"
    depends_on:
      core-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - banzami_net

  # Go public API — consumer-facing (mobile app, pay page).
  public-api:
    build:
      context: ../../services/public-api
      dockerfile: Dockerfile
    environment:
      PUBLIC_API_PORT:           "8083"
      CORE_API_URL:              http://core-api:8081
      DATABASE_URL:              postgres://banzami:banzami_dev@postgres:5432/banzami_dev
      JWT_SECRET:                ${JWT_SECRET}
      LOG_LEVEL:                 ${LOG_LEVEL:-info}
      OTLP_ENDPOINT:             ${OTLP_ENDPOINT:-}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
    ports:
      - "8083:8083"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test:     ["CMD", "curl", "-fsS", "http://localhost:8083/health"]
      interval: 10s
      timeout:  5s
      start_period: 15s
      retries:  5
    restart: unless-stopped
    networks:
      - banzami_net

  # ─── Sandbox / staging stack ──────────────────────────────────────────────────
  # Completely isolated from the live stack above.
  # Sandbox data NEVER touches the live database.
  # Reachable within banzami_net as: core-api-staging:8081, public-api-staging:8083

  postgres-sandbox:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     banzami
      POSTGRES_PASSWORD: banzami_sandbox
      POSTGRES_DB:       banzami_sandbox
    ports:
      - "5434:5432"
    volumes:
      - postgres_sandbox_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U banzami -d banzami_sandbox"]
      interval: 5s
      timeout:  5s
      retries:  10
    restart: unless-stopped
    networks:
      - banzami_net

  core-api-staging:
    build:
      context: ../../core
      dockerfile: Dockerfile
    environment:
      DATABASE_URL:       postgres://banzami:banzami_sandbox@postgres-sandbox:5432/banzami_sandbox
      CORE_API_PORT:      "8081"
      TRANSIT_ACCOUNT_ID: ${TRANSIT_ACCOUNT_ID_SANDBOX:-${TRANSIT_ACCOUNT_ID}}
      BANK_ACCOUNT_ID:    ${BANK_ACCOUNT_ID_SANDBOX:-${BANK_ACCOUNT_ID}}
      RUST_LOG:           core_api=info,warn
    ports:
      - "8084:8081"
    depends_on:
      postgres-sandbox:
        condition: service_healthy
    healthcheck:
      test:     ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout:  5s
      start_period: 20s
      retries:  5
    restart: unless-stopped
    networks:
      - banzami_net

  public-api-staging:
    build:
      context: ../../services/public-api
      dockerfile: Dockerfile
    environment:
      PUBLIC_API_PORT:           "8083"
      CORE_API_URL:              http://core-api-staging:8081
      DATABASE_URL:              postgres://banzami:banzami_sandbox@postgres-sandbox:5432/banzami_sandbox
      JWT_SECRET:                ${SANDBOX_JWT_SECRET:-${JWT_SECRET}}
      LOG_LEVEL:                 ${LOG_LEVEL:-info}
      OTLP_ENDPOINT:             ${OTLP_ENDPOINT:-}
      ENVIRONMENT:               SANDBOX
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
    ports:
      - "8085:8083"
    depends_on:
      core-api-staging:
        condition: service_healthy
    healthcheck:
      test:     ["CMD", "curl", "-fsS", "http://localhost:8083/health"]
      interval: 10s
      timeout:  5s
      start_period: 15s
      retries:  5
    restart: unless-stopped
    networks:
      - banzami_net

  # ─── Frontend applications ────────────────────────────────────────────────────

  # Next.js pay page — public payment link checkout (pay.banzami.org).
  pay-frontend:
    build:
      context: ../../apps/pay
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_GATEWAY_URL: https://api.banzami.org
      STAGING_GATEWAY_URL:     http://public-api-staging:8083
    ports:
      - "3002:3002"
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - banzami_net

  # Next.js checkout app — embedded checkout experience.
  checkout-frontend:
    build:
      context: ../../apps/checkout
      dockerfile: Dockerfile
    environment:
      PAY_API_URL: http://api-gateway:8080
    ports:
      - "3003:3003"
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - banzami_net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  postgres_sandbox_data:

networks:
  banzami_net:
    driver: bridge
