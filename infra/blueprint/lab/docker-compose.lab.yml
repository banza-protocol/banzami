# Banzami Environment Blueprint — disposable local PostgreSQL runtime lab (Increment 2A)
#
# LOCAL · DISPOSABLE · SYNTHETIC · non-Sandbox · non-LIVE · non-production.
# This is NOT the Banzami Sandbox and NOT LIVE. It never contacts the VM.
#
# Every resource is scoped to a per-run generated Compose project (`-p`), an
# isolated per-run bridge network, and a fresh per-run named volume, and carries
# the `com.banzami.blueprint.lab` label so teardown can remove ONLY this run's
# resources. PostgreSQL publishes NO host port. Credentials are provided only via
# read-only mounted secret files — never env values, argv, labels or image args.
#
# Names/paths (BZLAB_NETWORK, BZLAB_VOLUME, BZLAB_SECRET_DIR) are generated by
# lab.sh per run and exported into this file; they are never taken from
# uncontrolled ambient environment.

name: ${BZLAB_PROJECT:?lab.sh must set BZLAB_PROJECT}

secrets:
  lab_pg_superuser:
    file: ${BZLAB_SECRET_DIR:?lab.sh must set BZLAB_SECRET_DIR}/lab_pg_superuser
  lab_runtime_login:
    file: ${BZLAB_SECRET_DIR}/lab_runtime_login
  lab_control_login:
    file: ${BZLAB_SECRET_DIR}/lab_control_login

networks:
  labnet:
    name: ${BZLAB_NETWORK:?lab.sh must set BZLAB_NETWORK}
    driver: bridge
    labels:
      com.banzami.blueprint.lab: "1"
      com.banzami.blueprint.lab.kind: "network"

volumes:
  pgdata:
    name: ${BZLAB_VOLUME:?lab.sh must set BZLAB_VOLUME}
    labels:
      com.banzami.blueprint.lab: "1"
      com.banzami.blueprint.lab.kind: "volume"

services:
  # Disposable PostgreSQL 16 instance — no host port, private lab network only,
  # scram password auth (no trust), superuser password from a read-only file.
  postgres:
    image: postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    labels:
      com.banzami.blueprint.lab: "1"
      com.banzami.blueprint.lab.kind: "database"
    environment:
      POSTGRES_USER: labadmin
      POSTGRES_DB: blueprint_lab_local
      # value is an in-container FILE PATH, not a secret; the image reads the
      # secret from this read-only mounted file.
      POSTGRES_PASSWORD_FILE: /run/secrets/lab_pg_superuser
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    secrets:
      - lab_pg_superuser
    networks:
      - labnet
    volumes:
      - pgdata:/var/lib/postgresql/data
    # NO ports: — PostgreSQL is intentionally never published to a host port.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labadmin -d blueprint_lab_local -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 25
      start_period: 5s
    restart: "no"

  # One-shot role-bootstrap job: creates the stable owner / runtime / control-plane
  # roles and a synthetic owned object. Held in the `jobs` profile so `up` never
  # starts it; invoked via `compose run --rm bootstrap`.
  bootstrap:
    image: postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    profiles: ["jobs"]
    labels:
      com.banzami.blueprint.lab: "1"
      com.banzami.blueprint.lab.kind: "bootstrap"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      LAB_ADMIN_USER: labadmin
      LAB_DB: blueprint_lab_local
    secrets:
      - lab_pg_superuser
      - lab_runtime_login
      - lab_control_login
    networks:
      - labnet
    volumes:
      - ./scripts/bootstrap-roles.sh:/lab/bootstrap-roles.sh:ro
    entrypoint: ["/bin/bash", "/lab/bootstrap-roles.sh"]
    restart: "no"

  # One-shot role-model verifier: asserts the runtime role attributes, ownership
  # and negative capabilities. Emits only sanitised PASS/FAIL lines.
  verify:
    image: postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    profiles: ["jobs"]
    labels:
      com.banzami.blueprint.lab: "1"
      com.banzami.blueprint.lab.kind: "verify"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      LAB_ADMIN_USER: labadmin
      LAB_DB: blueprint_lab_local
    secrets:
      - lab_pg_superuser
      - lab_runtime_login
      - lab_control_login
    networks:
      - labnet
    volumes:
      - ./scripts/verify-roles.sh:/lab/verify-roles.sh:ro
    entrypoint: ["/bin/bash", "/lab/verify-roles.sh"]
    restart: "no"
