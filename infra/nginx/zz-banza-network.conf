# The client address comes from nginx's own real_ip resolution (website.conf
# sets set_real_ip_from for Cloudflare's ranges and real_ip_header
# CF-Connecting-IP), never from the raw CF-Connecting-IP header: anything
# reaching the origin directly can write that header itself (A9-09).
# banza.network — site do protocolo BANZA (Cloudflare proxied, SSL Full).
# Ficheiro ADITIVO. Carrega depois de banzami.conf (zz-) p/ nao alterar o default :443.
server {
    listen 443 ssl;
    server_name www.banza.network;
    ssl_certificate     /etc/nginx/certs/banza-network.pem;
    ssl_certificate_key /etc/nginx/certs/banza-network.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 301 https://banza.network$request_uri;
}
server {
    listen 443 ssl;
    server_name banza.network;
    ssl_certificate     /etc/nginx/certs/banza-network.pem;
    ssl_certificate_key /etc/nginx/certs/banza-network.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    client_max_body_size 10m;
    location / {
        proxy_pass         http://banza-docs:3005;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
