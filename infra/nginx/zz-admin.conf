# admin.banzami.com — BANZADMIN, the Sandbox operator control plane (Stage D).
#
# Why this vhost is here rather than on the sandbox edge.
#
# Cloudflare routes each hostname to an origin port with an Origin Rule:
# banzami.com -> 8443, the Sandbox hosts -> 2053 (sandbox-edge). A hostname with
# no rule lands on the default origin port 443, which this container owns — so
# admin.banzami.com already arrives here, and answered the maintenance 503.
# Moving it to the sandbox edge needs a new Origin Rule, and the only Cloudflare
# credential on this host is a DNS-01 token that cannot read a zone, let alone
# write a ruleset. This is the routing that exists.
#
# Stage C Decision 3 said the website edge must never gain sandbox/payment/admin
# upstreams. This amends that for one hostname, and the amendment is bounded so
# the reason behind Decision 3 still holds:
#
#   * the banzami.com / www block is untouched and keeps zero non-website
#     upstreams — asserted by tests/ops/website-edge-isolation.test.sh;
#   * every upstream below is held in a VARIABLE and resolved at request time.
#     nginx resolves a literal proxy_pass host at CONFIG LOAD time, so one absent
#     container would stop the whole proxy — including banzami.com — from
#     starting. Through a variable, a missing admin container is a 502 on
#     admin.banzami.com and nothing else.
#
# The console is Sandbox-scoped: admin-api runs with ENVIRONMENT=SANDBOX against
# the Sandbox database. There is no LIVE database for it to reach.
server {
    listen 443 ssl;
    server_name admin.banzami.com;

    ssl_certificate     /etc/nginx/certs/banzami-wildcard.pem;
    ssl_certificate_key /etc/nginx/certs/banzami-wildcard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    client_max_body_size 8m;

    # Docker's embedded DNS, so the variables below resolve per request.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # The container names carry the Sandbox project's deploy timestamp, so they
    # are supplied rather than guessed. A wrong name is a 502 here and is caught
    # by the runtime gate, not a silent fallback to something else.
    set $bzadmin_api  "bzsandbox-20260708184104-1708617-23807-admin-api:8082";
    set $bzadmin_app  "bzsandbox-20260708184104-1708617-23807-admin-frontend:3002";

    # The browser calls the API on the same origin it loaded from, so no CORS
    # preflight and no second hostname to keep in step.
    location /api/ {
        # When proxy_pass carries a VARIABLE, nginx does not perform its usual
        # URI replacement, so the trailing slash does not strip the prefix — the
        # request arrives at admin-api still spelled /api/… and 404s. The rewrite
        # does the stripping explicitly. Same trap the sandbox edge documents.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://$bzadmin_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass         http://$bzadmin_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
