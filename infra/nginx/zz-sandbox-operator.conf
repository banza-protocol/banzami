# sandbox-operator.banzami.com — Banzami sandbox OPERATOR host (identity only).
# Serves ONLY the BANZA L0 operator endpoints (manifest + health) from the
# sandbox-operator service; everything else is 404. The sandbox API/gateway lives
# separately on sandbox-api.banzami.com — no hybrid host.
server {
    listen 443 ssl;
    server_name sandbox-operator.banzami.com;
    ssl_certificate     /etc/nginx/certs/banzami-com.pem;
    ssl_certificate_key /etc/nginx/certs/banzami-com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location = /health {
        proxy_pass         http://sandbox-operator:8085/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /.well-known/banza/operator.json {
        proxy_pass         http://sandbox-operator:8085;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location / { return 404; }
}
