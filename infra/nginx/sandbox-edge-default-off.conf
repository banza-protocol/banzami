# Intentionally empty — mounted over the nginx:alpine stock conf.d/default.conf.
#
# The stock file serves the nginx welcome page on :80. That port is not published
# to the host, but this container joins the shared rt04e sandbox app network, so
# every other sandbox container could reach that welcome page. It is an
# unintended surface with no purpose here: this proxy serves TLS on 443 and a
# loopback-only health endpoint, and nothing else.
