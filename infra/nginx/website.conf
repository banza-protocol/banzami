# Banzami official website (banzami.com) — dedicated, isolated origin vhost.
#
# This is the SOURCE copy of the website nginx config. On the server it lives at
# /srv/banzami/website-nginx/conf.d/website.conf and is mounted into a dedicated
# `website-nginx` container (nginx:1.27-alpine) that owns host port 8443.
#
# Architecture (ADR-style summary):
#   - Public HTTPS is terminated at Cloudflare (separate Banzami zone/account).
#   - Cloudflare routes banzami.com origin traffic to 217.160.9.248:8443
#     (Origin Rule → origin port 8443).
#   - host 8443 -> this container :443 -> proxy to website-frontend:3000.
#   - The BANZA/payment nginx (banza-nginx) keeps :443 and is never touched.
#
# TLS: serves the Cloudflare Origin CA wildcard (banzami-wildcard.pem, SAN
# *.banzami.com + banzami.com), which is what SSL/TLS mode "Full (strict)"
# requires. Do not point this block back at banzami-com.pem.
#
# banzami-com.pem is SELF-SIGNED (subject == issuer == CN=banzami.com, expires
# 2028-09-23). It was served here until 2026-08-30 and was the ONLY origin path
# in the zone that failed strict validation — it covers the right hostnames and
# is in date, so only chain verification fails, which is the shape that survives
# casual inspection. Under strict it would return 526 on banzami.com and www.
#
# The correction needed no new certificate: this same wildcard was already
# mounted in this container and already serving developers.banzami.com on this
# same port. Evidence and rollback:
# evidence/ops/STAGE_D1_CLOUDFLARE_FULL_STRICT_PREFLIGHT.md

# ─── access log without proof references ─────────────────────────────────────
# A proof reference is a bearer capability: whoever holds it reads the payment.
# nginx's default format logged the request line whole — and the Referer, which
# carries the verification page's URL — so every lookup of /v1/public/proofs/<ref>
# or /r/<ref> wrote the full reference to the access log. This format keeps at
# most the first 8 characters of the path segment — whatever they are, so an
# altered spelling (a leading space, a BOM, "%20BZM-…") is cut like a canonical
# one — and drops the Referer. Used by the servers that carry references.
# Guard: tests/ops/nginx-proof-log-redaction.test.mjs.
map $request $bz_request_redacted {
    "~^(?<bz_head>\S+ /+(?:v1/public/proofs|r)/[^\s/?]{0,8}).*?(?<bz_tail>(?: HTTP/[0-9.]+)?)$" "${bz_head}...${bz_tail}";
    default $request;
}
log_format bz_redacted '$remote_addr [$time_local] "$bz_request_redacted" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 443 ssl;
    server_name banzami.com www.banzami.com;
    access_log /var/log/nginx/access.log bz_redacted;

    ssl_certificate     /etc/nginx/certs/banzami-wildcard.pem;
    ssl_certificate_key /etc/nginx/certs/banzami-wildcard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    if ($host = www.banzami.com) {
        return 301 https://banzami.com$request_uri;
    }

    location / {
        proxy_pass         http://website-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
