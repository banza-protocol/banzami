# Banzami official website (banzami.com) — dedicated, isolated origin vhost.
#
# This is the SOURCE copy of the website nginx config. On the server it lives at
# /srv/banzami/website-nginx/conf.d/website.conf and is mounted into a dedicated
# `website-nginx` container (nginx:1.27-alpine) that owns host port 8443.
#
# Architecture (ADR-style summary):
#   - Public HTTPS is terminated at Cloudflare (separate Banzami zone/account).
#   - Cloudflare routes banzami.com origin traffic to 217.160.9.248:8443
#     (Origin Rule → origin port 8443).
#   - host 8443 -> this container :443 -> proxy to website-frontend:3000.
#   - The BANZA/payment nginx (banza-nginx) keeps :443 and is never touched.
#
# TLS: serves the Cloudflare Origin CA wildcard (banzami-wildcard.pem, SAN
# *.banzami.com + banzami.com), which is what SSL/TLS mode "Full (strict)"
# requires. Do not point this block back at banzami-com.pem.
#
# banzami-com.pem is SELF-SIGNED (subject == issuer == CN=banzami.com, expires
# 2028-09-23). It was served here until 2026-08-30 and was the ONLY origin path
# in the zone that failed strict validation — it covers the right hostnames and
# is in date, so only chain verification fails, which is the shape that survives
# casual inspection. Under strict it would return 526 on banzami.com and www.
#
# The correction needed no new certificate: this same wildcard was already
# mounted in this container and already serving developers.banzami.com on this
# same port. Evidence and rollback:
# evidence/ops/STAGE_D1_CLOUDFLARE_FULL_STRICT_PREFLIGHT.md

# ─── who the client is ──────────────────────────────────────────────────────
# The same rule as the Sandbox edge: $remote_addr becomes Cloudflare's
# CF-Connecting-IP only when the connection really comes from Cloudflare (the
# list below is the sandbox-edge's, kept identical by the guard); a direct
# connection to the origin keeps its own address, so a forged header counts for
# nothing. Every proxy on this edge then forwards $remote_addr in X-Real-IP and
# X-Forwarded-For, replacing what the caller sent. It forwarded the raw
# $http_cf_connecting_ip, which a caller reaching the origin directly writes
# itself (A9-09) — and banzami.com/r/{ref} now hands that address to the
# gateway as the reader's (A9-08).
# Guard: tests/ops/client-ip-trust.test.mjs.
real_ip_header CF-Connecting-IP;
real_ip_recursive off;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# ─── proof verification: one reader's allowance, not everyone's ─────────────
# /r/{ref} is rendered on the website's server, which asks the gateway on the
# reader's behalf. Without a limit here one client could keep the website busy
# asking; behind it the gateway limits per reader (the website forwards the
# reader's address, A9-08). Keyed on the client, and on its /64 for IPv6 — an
# IPv6 subscriber holds a whole /64 (A9-04). nginx prints IPv6 in RFC 5952 form:
# the first rule takes four explicit leading groups, the second a shorter prefix
# whose "::" lies inside the /64.
map $remote_addr $bz_client_key {
    "~^(?<bz_p64>[0-9a-f]{1,4}(?::[0-9a-f]{1,4}){3}):" "${bz_p64}::/64";
    "~^(?<bz_p64z>[0-9a-f]{1,4}(?::[0-9a-f]{1,4}){0,2})::(?:[0-9a-f]{1,4}(?::[0-9a-f]{1,4}){0,3})?$" "${bz_p64z}::/64";
    default $remote_addr;
}
limit_req_zone $bz_client_key zone=bz_proof_readers:10m rate=20r/m;

# ─── access log without proof references ─────────────────────────────────────
# A proof reference is a bearer capability: whoever holds it reads the payment.
# nginx's default format logged the request line whole — and the Referer, which
# carries the verification page's URL — so every lookup of /v1/public/proofs/<ref>
# or /r/<ref> wrote the full reference to the access log. The mask keys on the
# TOKEN, not the route: any request line containing "bzm" (any case) — on any
# path, in the query, after a stray escape — or six hyphen-separated groups of
# four (a reference without its prefix) is cut after at most its first group.
# A 404 on a mistyped route (/V1/…, /R/…, /v1//…) carries the reference as
# surely as the real route does. The Referer is dropped. Every server on this
# proxy logs with it — any host can be sent a reference.
# Guard: tests/ops/nginx-proof-log-redaction.test.mjs.
map $request $bz_request_redacted {
    "~*^(?<bz_head>\S+ .*?(?:bzm[^ ]{0,5}|(?=[0-9a-z%]{4}(?:-[0-9a-z%]{4}){5}))).*?(?<bz_tail>(?: HTTP/[0-9.]+)?)$" "${bz_head}...${bz_tail}";
    default $request;
}
# Second stage: a Business application id — the applicant's capability on the
# public onboarding routes (/v1/merchant/applications/{id}/…: status, KYB
# documents, resubmission) — keeps its first 8 hex digits, in any spelling a
# UUID parser accepts. Same rule as obs.RedactPath in the Go services.
map $bz_request_redacted $bz_request_logged {
    "~*^(?<bz_app_head>\S+ .*?applications/(?:%7b|\{|urn(?::|%3a)uuid(?::|%3a))?[0-9a-f]{8})[^/ ?]*(?<bz_app_tail>.*)$" "${bz_app_head}...${bz_app_tail}";
    default $bz_request_redacted;
}
# Third stage: no query string is logged. Queries carry capabilities — an
# operator's invite or reset token (/reset-password?token=, a full operator
# takeover for 72 h), a Business activation token (/comerciantes/activar?token=,
# it sets the PIN), an applicant's status reference (?ref=<application id>) —
# and personal data (?email=). A path is enough to debug; the query is cut to
# "?…" whatever it holds (A6-01/A6-02/A9-07).
map $bz_request_logged $bz_request_final {
    "~^(?<bz_q_head>\S+ [^? ]*)\?[^ ]*(?<bz_q_tail>(?: HTTP/[0-9.]+)?)$" "${bz_q_head}?...${bz_q_tail}";
    default $bz_request_logged;
}
log_format bz_redacted '$remote_addr [$time_local] "$bz_request_final" $status $body_bytes_sent $upstream_status "$http_user_agent"';
# nginx's own error lines copy the request line and the Referer unredacted, so
# only critical conditions are written there; an upstream failure is still
# visible, redacted, as $upstream_status in the access log (A6-03).
error_log /var/log/nginx/error.log crit;

server {
    listen 443 ssl;
    server_name banzami.com www.banzami.com;
    access_log /var/log/nginx/access.log bz_redacted;

    ssl_certificate     /etc/nginx/certs/banzami-wildcard.pem;
    ssl_certificate_key /etc/nginx/certs/banzami-wildcard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    if ($host = www.banzami.com) {
        return 301 https://banzami.com$request_uri;
    }

    # /r/<reference> has ONE public spelling: /r/ followed by the reference exactly
    # as issued. A percent-escape (%30 for 0, %2D for -), a trailing or repeated
    # slash, or any other transport-level spelling is not that URL. nginx sees the
    # raw request line ($request_uri, before any decoding or slash merging) and
    # hands the app /r/_, which can never be a reference: the page says
    # "invalid" without a lookup. Never a redirect to the canonical page — Next
    # would otherwise 308 /r/<ref>/ and //r/<ref> to it. The app applies the same
    # rule behind this (middleware.ts); the query string is not part of the
    # reference and is left to ordinary URL parsing.
    # Guard: tests/ops/proof-url-one-spelling.test.mjs.
    location ~ ^/r/ {
        if ($request_uri !~ "^/r/BZM(?:-[0-9A-Z]{4}){2}(?:(?:-[0-9A-Z]{4}){4})?(?:\?[^#]*)?$") {
            rewrite ^ /r/_? break;
        }
        limit_req          zone=bz_proof_readers burst=10 nodelay;
        limit_req_status   429;
        proxy_pass         http://website-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # The verification form. It asks nothing itself (it navigates to /r/{ref}),
    # but it is the same reader's surface and shares the allowance.
    location = /verificar {
        limit_req          zone=bz_proof_readers burst=10 nodelay;
        limit_req_status   429;
        proxy_pass         http://website-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://website-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
