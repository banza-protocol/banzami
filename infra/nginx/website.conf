# Banzami official website (banzami.com) — dedicated, isolated origin vhost.
#
# This is the SOURCE copy of the website nginx config. On the server it lives at
# /srv/banzami/website-nginx/conf.d/website.conf and is mounted into a dedicated
# `website-nginx` container (nginx:1.27-alpine) that owns host port 8443.
#
# Architecture (ADR-style summary):
#   - Public HTTPS is terminated at Cloudflare (separate Banzami zone/account).
#   - Cloudflare routes banzami.com origin traffic to 217.160.9.248:8443
#     (Origin Rule → origin port 8443).
#   - host 8443 -> this container :443 -> proxy to website-frontend:3000.
#   - The BANZA/payment nginx (banza-nginx) keeps :443 and is never touched.
#
# TLS: a Cloudflare Origin Certificate for banzami.com (+ www) should live at
# /etc/nginx/certs/banzami-com.pem and .key for SSL/TLS mode "Full (strict)".
# A self-signed cert + mode "Full" also works.
#
# CURRENT REALITY (verified 2026-08-30, Stage D.1) — the deployed
# banzami-com.pem is SELF-SIGNED (subject == issuer == CN=banzami.com, expires
# 2028-09-23), so the zone is on mode "Full" and this is the ONLY origin path
# that blocks "Full (strict)". Every other proxied hostname already presents the
# Origin CA wildcard and chain-verifies.
#
# The fix is not a new certificate: banzami-wildcard.pem is already mounted in
# this container, already serves developers.banzami.com on this same port, and
# its SAN covers *.banzami.com AND banzami.com. Pointing this server block at it
# makes the whole zone strict-ready. Production TLS change — do it deliberately,
# with the before/after checks in the Stage D.1 evidence record.

server {
    listen 443 ssl;
    server_name banzami.com www.banzami.com;

    ssl_certificate     /etc/nginx/certs/banzami-com.pem;
    ssl_certificate_key /etc/nginx/certs/banzami-com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    if ($host = www.banzami.com) {
        return 301 https://banzami.com$request_uri;
    }

    location / {
        proxy_pass         http://website-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
