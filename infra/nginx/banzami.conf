# Banzami operator — .com production edge (api / sandbox-api / pay).
# Served by the banzami stack on banzami_net.
# banzami.com / www → dedicated website-nginx on :8443 (NOT served here).

# ─── api.banzami.com — live API ──────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.banzami.com;

    ssl_certificate     /etc/nginx/certs/banzami-com.pem;
    ssl_certificate_key /etc/nginx/certs/banzami-com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    client_max_body_size 10m;

    # Consumer public API (live) — strip the /consumer prefix so
    #   api.banzami.com/consumer/v1/consumers/{h} → public-api /v1/consumers/{h}
    location /consumer/ {
        proxy_pass         http://public-api:8083/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Everything else → live gateway (auth, transactions, payment-links, …).
    location / {
        proxy_pass         http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ─── sandbox-api.banzami.com — sandbox API ──────────────────────────────────
server {
    listen 443 ssl;
    server_name sandbox-api.banzami.com;

    ssl_certificate     /etc/nginx/certs/banzami-com.pem;
    ssl_certificate_key /etc/nginx/certs/banzami-com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    client_max_body_size 10m;

    # Consumer public API (sandbox) — strip /consumer → public-api-staging.
    location /consumer/ {
        proxy_pass         http://public-api-staging:8083/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Sandbox gateway → api-gateway-staging (core-api-staging + banzami_staging DB).
    location / {
        proxy_pass         http://api-gateway-staging:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ─── pay.banzami.com — hosted checkout ──────────────────────────────────────
server {
    listen 443 ssl;
    server_name pay.banzami.com;

    ssl_certificate     /etc/nginx/certs/banzami-com.pem;
    ssl_certificate_key /etc/nginx/certs/banzami-com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    client_max_body_size 10m;

    location / {
        proxy_pass         http://pay-frontend:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ─── admin.banzami.com — Admin frontend + admin-api ─────────────────────────
# Official admin host (.com). Cloudflare-proxied; origin cert *.banzami.com.
server {
    listen 443 ssl;
    server_name admin.banzami.com;

    ssl_certificate     /etc/nginx/certs/banzami-com.pem;
    ssl_certificate_key /etc/nginx/certs/banzami-com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    client_max_body_size 10m;

    # Admin API — strip /api so admin.banzami.com/api/health → admin-api /health
    location /api/ {
        proxy_pass         http://admin-api:8082/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass         http://admin-frontend:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
