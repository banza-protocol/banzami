# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ─── api.banzami.com / sandbox-api.banzami.com — single public API ───────────
# api.banzami.com is the ONE public API host. Audiences (consumer/business/
# merchant/admin) are separated by scope/permission/auth/routing — NOT by DNS.
# api + sandbox share this gateway; environment is routed by the API-key prefix.
# banzami.com Origin Rule must scope :8443 to banzami.com/www only so these
# subdomains reach :443.
#
# DECOMMISSION — api.banzami.org (legacy, temporary, MUST NOT become permanent):
#   1. Keep serving (NO redirect — programmatic POST/auth don't survive 30x).
#   2. Migrate all first-party clients to api.banzami.com (done in-code).
#   3. Monitor api.banzami.org traffic.
#   4. When no active clients remain → return 410 Gone.
#   5. Then remove the host from server_name entirely.
server {
    listen 443 ssl;
    server_name api.banzami.org api.banzami.com sandbox-api.banzami.com;

    ssl_certificate     /etc/nginx/certs/banzami.pem;
    ssl_certificate_key /etc/nginx/certs/banzami.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;

    set $cors_origin "";
    if ($http_origin ~* "^https://(admin|business)\.banzami\.org$") {
        set $cors_origin $http_origin;
    }

    # Consumer public API — namespaced under /consumer/ so the consumer app
    # (handle lookup, login, /v1/me, …) shares the single api.banzami.com host
    # WITHOUT colliding with the gateway: both services define /v1/auth/token,
    # /v1/transfers, /v1/payment-links, /v1/consumers with different semantics.
    # The trailing slash on proxy_pass strips the /consumer prefix, so
    #   api.banzami.com/consumer/v1/consumers/{h} → public-api:8083/v1/consumers/{h}
    location /consumer/ {
        proxy_pass         http://public-api:8083/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Admin API — strip /admin prefix
    location /admin/ {
        if ($cors_origin != "") {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Admin-Key, X-Idempotency-Key' always;
            add_header 'Access-Control-Max-Age'       '86400' always;
        }
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Admin-Key, X-Idempotency-Key' always;
            add_header 'Content-Length' '0';
            return 204;
        }
        proxy_pass         http://admin-api:8082/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        if ($cors_origin != "") {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Idempotency-Key' always;
            add_header 'Access-Control-Max-Age'       '86400' always;
        }
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Idempotency-Key' always;
            add_header 'Content-Length' '0';
            return 204;
        }
        proxy_pass         http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ─── consumer.banzami.org — Public API ───────────────────────────────────────
server {
    listen 443 ssl;
    server_name consumer.banzami.org;

    ssl_certificate     /etc/nginx/certs/banzami.pem;
    ssl_certificate_key /etc/nginx/certs/banzami.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://public-api:8083;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ─── sandbox.banzami.org — BANZA L0 sandbox operator ─────────────────────────
# Minimal, stateless L0 (Protocol Sandbox) runtime. simulated=true,
# production_allowed=false. No money movement. Read-only endpoints only.
server {
    listen 443 ssl;
    server_name sandbox.banzami.org;

    ssl_certificate     /etc/nginx/certs/banzami.pem;
    ssl_certificate_key /etc/nginx/certs/banzami.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass         http://sandbox-operator:8085;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# ─── admin.banzami.org — Admin frontend ──────────────────────────────────────
server {
    listen 443 ssl;
    server_name admin.banzami.org;

    ssl_certificate     /etc/nginx/certs/banzami.pem;
    ssl_certificate_key /etc/nginx/certs/banzami.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /api/ {
        proxy_pass         http://admin-api:8082/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass         http://admin-frontend:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

# ─── business.banzami.org — Merchant Dashboard ───────────────────────────────
server {
    listen 443 ssl;
    server_name business.banzami.org;

    ssl_certificate     /etc/nginx/certs/banzami.pem;
    ssl_certificate_key /etc/nginx/certs/banzami.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass         http://dashboard-frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

# ─── pay.banzami.com — Hosted Checkout (canonical payment host) ──────────────
# .com is the ONLY official Banzami payment host. pay.banzami.org is reserved
# for the BANZA protocol and must not serve payment — it only 301-redirects to
# .com below so legacy links keep working without being canonical.
server {
    listen 443 ssl;
    server_name pay.banzami.com;

    ssl_certificate     /etc/nginx/certs/banzami.pem;
    ssl_certificate_key /etc/nginx/certs/banzami.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass         http://pay-frontend:3002;
        proxy_buffering    off;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ─── pay.banzami.org — DEPRECATED, redirects to the .com payment host ────────
# Transitional only: old WhatsApp/QR payment links on .org bounce to .com.
# Nothing generates pay.banzami.org anymore (SDK + mobile + app emit .com).
server {
    listen 443 ssl;
    server_name pay.banzami.org;

    ssl_certificate     /etc/nginx/certs/banzami.pem;
    ssl_certificate_key /etc/nginx/certs/banzami.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    return 301 https://pay.banzami.com$request_uri;
}

# ─── banzami.org — BANZA protocol site (docs) ────────────────────────────────
# banzami.org is reserved for the BANZA protocol and serves the protocol docs.
# The Banzami product website is banzami.com (separate nginx, see note below).
server {
    listen 443 ssl;
    server_name banzami.org www.banzami.org;

    ssl_certificate     /etc/nginx/certs/banzami.pem;
    ssl_certificate_key /etc/nginx/certs/banzami.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    if ($host = www.banzami.org) {
        return 301 https://banzami.org$request_uri;
    }

    location / {
        proxy_pass         http://docs-frontend:3005;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

# NOTE: banzami.com (the official Banzami website) is intentionally NOT served by
# this nginx. It is kept fully separate from the BANZA/payment stack and served by
# a dedicated website nginx on origin port 8443 — see infra/nginx/website.conf and
# apps/website/DEPLOYMENT.md.

# ─── staging.banzami.org — Staging / TestFlight sandbox API ──────────────────
server {
    listen 443 ssl;
    server_name staging.banzami.org;

    ssl_certificate     /etc/nginx/certs/banzami.pem;
    ssl_certificate_key /etc/nginx/certs/banzami.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;

    # Clearly identify sandbox responses so clients can verify environment.
    add_header X-Banza-Environment "sandbox" always;

    location / {
        proxy_pass         http://public-api-staging:8083;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
