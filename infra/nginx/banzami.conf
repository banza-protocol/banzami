# ─── banzami.org — Public website ─────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name banzami.org www.banzami.org;

    ssl_certificate     /etc/nginx/certs/banzami.pem;
    ssl_certificate_key /etc/nginx/certs/banzami.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    if ($host = www.banzami.org) {
        return 301 https://banzami.org$request_uri;
    }

    location / {
        proxy_pass         http://docs-frontend:3005;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

# ─── staging.banzami.org — Staging / TestFlight sandbox API ──────────────────
server {
    listen 443 ssl;
    server_name staging.banzami.org;

    ssl_certificate     /etc/nginx/certs/banzami.pem;
    ssl_certificate_key /etc/nginx/certs/banzami.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;

    # Clearly identify sandbox responses so clients can verify environment.
    add_header X-Banza-Environment "sandbox" always;

    location / {
        proxy_pass         http://public-api-staging:8083;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
