# Stage B public-routing guard — default-server maintenance response.
#
# Deployed into the website-only proxy's config directory (loaded alongside
# website.conf). Any host NOT explicitly served by this proxy — the offline
# production subdomains (api/admin/pay/sandbox-api/developer-api/
# sandbox-operator) and unknown hosts — receives an intentional
# 503 + Retry-After maintenance page instead of silently falling through to
# the banzami.com website HTML with HTTP 200 (the implicit-default behaviour
# that masked the outage from monitors and API clients).
#
# Properties:
#   - no upstream dependencies (static response only);
#   - website-only proxy independence preserved (banzami.com/www block untouched);
#   - one consistent behaviour for all offline/unknown hosts;
#   - rollback = delete this file from the proxy config directory + nginx reload.
#
# See evidence/ops/STAGE_B_PUBLIC_ROUTING_REPAIR.md.
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/banzami-wildcard.pem;
    ssl_certificate_key /etc/nginx/certs/banzami-wildcard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Retry-After 3600 always;
    add_header Cache-Control "no-store" always;
    default_type text/html;
    return 503 "<!doctype html><html lang=\"pt\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Banzami — serviço temporariamente indisponível</title></head><body style=\"font-family:system-ui,sans-serif;margin:4rem auto;max-width:36rem;padding:0 1rem;text-align:center;color:#111\"><h1 style=\"color:#B5101F\">503 — Serviço temporariamente indisponível</h1><p>Este serviço Banzami está temporariamente offline para manutenção.</p><p>O website institucional continua disponível em <a href=\"https://banzami.com\" style=\"color:#B5101F\">banzami.com</a>.</p></body></html>";
}
