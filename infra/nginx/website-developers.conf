# Deployed as /srv/banzami/website-nginx/conf.d/zz-developers.conf (loaded
# after website.conf, which defines the bz_redacted log format). Until
# 2026-09-11 this file existed only on the host.
# Developer Console SNI vhost (additive). Uses the *.banzami.com Cloudflare
# Origin CA cert so Cloudflare Full (strict) validates developers.banzami.com.
# NOT default_server; the banzami.com/www block + its narrow cert are untouched.
# Proxies to the same website-frontend; Next host-guarded middleware maps the
# clean console routes.
server {
    listen 443 ssl;
    server_name developers.banzami.com;
    access_log /var/log/nginx/access.log bz_redacted;

    ssl_certificate     /etc/nginx/certs/banzami-wildcard.pem;
    ssl_certificate_key /etc/nginx/certs/banzami-wildcard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass         http://website-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # $remote_addr is Cloudflare's CF-Connecting-IP only from Cloudflare's
        # ranges (real_ip in website.conf, loaded first); the raw header is the
        # caller's to write when it reaches the origin directly (A9-09).
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
