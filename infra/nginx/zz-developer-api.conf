# developer-api.banzami.com — SANDBOX Developer Platform API (ADR-033).
# Cloudflare-proxied; origin cert *.banzami.com; upstream is the SANDBOX
# developer-api container only (banzami_staging + isolated Redis). No prod path.
server {
    listen 443 ssl;
    server_name developer-api.banzami.com;

    ssl_certificate     /etc/nginx/certs/banzami-com.pem;
    ssl_certificate_key /etc/nginx/certs/banzami-com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    client_max_body_size 2m;

    location / {
        proxy_pass         http://developer-api:8086;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # Behind Cloudflare: real client IP is CF-Connecting-IP (per-IP rate limit).
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
