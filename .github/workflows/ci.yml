name: CI

# ─── Trigger: automatic ───────────────────────────────────────────────────────
# Automatic triggers were previously disabled because the banza-protocol org's
# GitHub Actions billing was blocked: every push went red within ~5s with jobs
# that never started. That block is resolved — a dispatched run now executes real
# steps — and the four genuine failures it exposed on main (rustfmt debt, a
# gofmt-unformatted file, a `go test -race` data race in a webhook test fixture,
# and a step invoking the retired sqlx-backfill script) have been fixed, so the
# suite can gate changes again.
#
# paths-ignore keeps docs-only commits from running the full suite. The deploy
# job below stays opt-in behind the ENABLE_CI_DEPLOY repository variable and is
# skipped unless it is explicitly set.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# Least privilege for GITHUB_TOKEN. Without an explicit block the workflow
# inherits the repository default, which on older repositories is read/write on
# every scope — so any compromised step or action could push code, publish
# packages or alter releases. No job here needs to write to the repository; the
# deploy job authenticates to the server with its own SSH key, not this token.
permissions:
  contents: read

# Every `run:` step uses bash with -e AND -o pipefail.
#
# GitHub's default shell is `bash -e {0}` — which has -e but NOT pipefail, so a
# pipeline takes the exit status of its LAST command and a failing producer is
# silently discarded:
#
#     false | head -1     # rc=0 under the default shell, rc=1 with pipefail
#
# That is not hypothetical here: a manual cross-build check in this repository
# reported "OK" for a `go build` that was failing, because its output was piped
# through `head`. A pipeline is only evidence if failures propagate to the gate.
#
# `shell: bash` resolves to `bash --noprofile --norc -eo pipefail {0}`.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Shared across all jobs that need a database
  DATABASE_URL: postgres://banzami:banzami_dev@localhost:5433/banzami_dev

jobs:
  # ─── Rust core ──────────────────────────────────────────────────────────────
  rust:
    name: Rust — build, lint, test
    # GitHub-hosted, deliberately.
    #
    # This job needs a checkout, a Rust toolchain, an ephemeral PostgreSQL and
    # the repository's own migrations — nothing that belongs to one particular
    # machine. It ran self-hosted for historical reasons, and the cost of that
    # showed up as a release dependency on a single runner's Docker state:
    # when the runner broke, financial correctness could not be verified at
    # all. Hosted infrastructure removes the coupling.
    #
    # See also .github/workflows/economic-gate.yml, which runs the same
    # DB-backed suites and can be dispatched against an exact commit.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     banzami
          POSTGRES_PASSWORD: banzami_dev
          POSTGRES_DB:       banzami_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U banzami -d banzami_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Records which machine actually executed this job. A conclusion with no
      # runner and no steps is not a pass; this makes the difference visible in
      # the log, not just in the API. Non-sensitive fields only — never the
      # environment block, which carries secrets.
      - name: Runner identity
        run: |
          echo "runner name : ${RUNNER_NAME:-unknown}"
          echo "runner os   : ${RUNNER_OS:-unknown} / ${RUNNER_ARCH:-unknown}"
          echo "kernel      : $(uname -srm)"
          echo "docker      : $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo unavailable)"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: rust-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked

      - name: Apply migrations
        working-directory: core
        run: sqlx migrate run --source ../db/migrations

      - name: Check formatting
        working-directory: core
        run: cargo fmt --all -- --check

      # The DB-backed operator guards: each migration contract, and each counter
      # of tools/assurance/sandbox-financial-assurance.sql (zero on a clean
      # database, moves for the defect it exists to catch). The TypeScript job
      # runs the rest — split by the same predicate.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Operator guards (tests/ops, DB-backed)
        run: node --test $(grep -l DATABASE_URL tests/ops/*.test.mjs)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Clippy (deny warnings)
        working-directory: core
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests (unit + integration)
        working-directory: core
        # See economic-gate.yml: one failing binary must not hide the rest.
        run: cargo test --workspace --no-fail-fast
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

  # ─── Go api-gateway ─────────────────────────────────────────────────────────
  go-gateway:
    name: Go api-gateway — vet, test
    runs-on: ubuntu-latest

    # The api-gateway owns webhook delivery and has DB-backed integration tests
    # (webhook_outbox_test.go). Provision the same Postgres as the Rust job and
    # apply the schema migrations so those tests run for real instead of failing
    # to connect (DATABASE_URL is set workflow-wide).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     banzami
          POSTGRES_PASSWORD: banzami_dev
          POSTGRES_DB:       banzami_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U banzami -d banzami_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/api-gateway/go.mod
          cache-dependency-path: services/api-gateway/go.sum

      - name: Apply migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: go vet
        working-directory: services/api-gateway
        run: go vet ./...

      - name: go test
        working-directory: services/api-gateway
        run: go test -race -count=1 ./...

  # ─── Go admin-api ───────────────────────────────────────────────────────────
  go-admin:
    name: Go admin-api — vet, test
    runs-on: ubuntu-latest
    # A database, so the DB-backed tests run instead of skipping (the MFA
    # one-code-one-login race, operator notifications). DATABASE_URL is set
    # workflow-wide.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     banzami
          POSTGRES_PASSWORD: banzami_dev
          POSTGRES_DB:       banzami_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U banzami -d banzami_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/admin-api/go.mod
          cache-dependency-path: services/admin-api/go.sum

      - name: Apply migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: go vet
        working-directory: services/admin-api
        run: go vet ./...

      - name: go test
        working-directory: services/admin-api
        run: go test -race -count=1 ./...

  # ─── Go developer-api + shared modules ─────────────────────────────────────
  # developer-api was only compiled here, never vetted or tested, and the shared
  # modules under services/common (proof references, log redaction, the
  # canonical environment, webhook signing, documents) were tested nowhere.
  # The gofmt check covers every Go file under services/.
  go-developer-common:
    name: Go developer-api + services/common — fmt, vet, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/developer-api/go.mod
          cache-dependency-path: |
            services/developer-api/go.sum
            services/common/*/go.sum

      - name: gofmt (every Go file under services/)
        run: |
          unformatted="$(gofmt -l services)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"; echo "$unformatted"; exit 1
          fi

      - name: go vet + go test
        run: |
          set -e
          for d in services/developer-api services/common/*/; do
            [ -f "$d/go.mod" ] || continue
            echo "::group::$d"
            (cd "$d" && go vet ./... && go test -race -count=1 ./...)
            echo "::endgroup::"
          done

  # ─── Go public-api ──────────────────────────────────────────────────────────
  go-public:
    name: Go public-api — vet, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/public-api/go.mod
          cache-dependency-path: services/public-api/go.sum

      - name: go vet
        working-directory: services/public-api
        run: go vet ./...

      - name: go test
        working-directory: services/public-api
        run: go test -race -count=1 ./...

  # ─── Go sandbox-operator ────────────────────────────────────────────────────
  # Gates the BANZA L0 sandbox operator and the (env-gated, simulated) L1
  # conformance-shaped adapter tests. Pure stdlib module, no DB, no secrets.
  # This is a CI quality gate only — it does not validate L1, certify Banzami,
  # deploy anything, or enable the L1 surface (SANDBOX_L1_ENABLED stays OFF).
  go-sandbox-operator:
    name: Go sandbox-operator — fmt, vet, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/sandbox-operator/go.mod
          # Stdlib-only module (no go.sum) — key the cache on go.mod.
          cache-dependency-path: services/sandbox-operator/go.mod

      - name: gofmt (check)
        working-directory: services/sandbox-operator
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        working-directory: services/sandbox-operator
        run: go vet ./...

      - name: go test
        working-directory: services/sandbox-operator
        run: go test -race -count=1 ./...

  # ─── BANZADMIN frontend ─────────────────────────────────────────────────────
  admin-frontend:
    name: BANZADMIN frontend — typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        working-directory: apps/admin
        run: npm ci

      - name: Type-check
        working-directory: apps/admin
        run: npm run typecheck

      # Operator attention badges: formatting, nav mapping, provider refresh /
      # failure / environment behaviour, accessibility (lib/attention.ts,
      # components/layout/*.test.*).
      - name: Run tests
        working-directory: apps/admin
        run: npm test

  # ─── Public website (banzami.com, developers.banzami.com) ──────────────────
  # /verificar and /r/<ref> — the public proof verifier — live here, as does
  # the Developers Console. Neither was typechecked or tested in CI; two type
  # errors sat in a test file unnoticed.
  website:
    name: Website — typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Install dependencies
        working-directory: apps/website
        run: npm ci

      - name: Type-check
        working-directory: apps/website
        run: npm run typecheck

      - name: Run tests
        working-directory: apps/website
        run: npm test

  # ─── TypeScript SDK ─────────────────────────────────────────────────────────
  typescript:
    name: TypeScript SDK — typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Type-check
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: Run tests
        working-directory: sdk/typescript
        run: npm test

      - name: Build distribution
        working-directory: sdk/typescript
        run: npm run build

      # The published tarball must load in both module systems on a runtime that
      # does not guess. The ESM half of the dual build shipped undeclared, so a
      # named import of constructEvent — the line the webhook documentation gives
      # — threw inside a serverless function while every check here stayed green,
      # because Node's syntax detection covered for it locally.
      - name: SDK dual-package loading guard
        run: node tools/check-sdk-dual-package.mjs

      # WS2 provenance guard — the built dist must honour the typed-source refund
      # contract (mandatory idempotency key, no auto-minted key, no transaction_id
      # input, no internal TRANSACTION token) at the version it claims. This is
      # what a re-vendor into DOA copies, so a green build here means a green
      # vendored copy. The same script runs in DOA's CI against the vendored dist.
      - name: Refund-contract drift guard
        run: node tools/check-sdk-refund-contract.mjs sdk/typescript/dist sdk/typescript/package.json

      - name: Drift-guard self-test (all violation classes caught)
        run: node tools/check-sdk-refund-contract.selftest.mjs

      # Canonical assurance manifest gate — every material capability must be
      # registered, environment-consistent, and never claim Live money movement
      # without explicit live-authorization evidence. The generated assurance
      # doc must match the manifest (no manual duplication of status).
      - name: Assurance manifest gate
        run: node tools/check-assurance-manifest.mjs

      - name: Repository layout gate
        run: node tools/check-repository-layout.mjs

      # BANZA is the protocol; Banzami is the operator. On the hosted checkout
      # the wordmark said BANZA — the protocol's name, on the one page whose
      # reader is a person about to pay.
      - name: Payer-surface naming gate
        run: node tools/check-payer-surface-naming.mjs

      # The gated Sandbox apply used to regenerate api_key_pepper on every run,
      # which silently invalidates every API key ever issued — including keys
      # installed in production environments that cannot read them back. No
      # Docker or network: the function is extracted and run against a scratch
      # directory.
      - name: Sandbox secret-preservation gate
        run: bash tests/ops/sandbox-secret-preservation.test.sh

      # ADR-057: the public Project contract held by counting — no /business
      # route, no caller pricing field, no SDK reader of the Business profile,
      # no branch on one application's identity, no self-service classification.
      - name: Project readiness contract guard
        run: node --test tests/ops/project-readiness-contract-guard.test.mjs

      # Internal routes and Prometheus metrics stay off the Sandbox perimeter:
      # the edge answers them 404 itself (admin-api metrics carry the operator
      # attention counts).
      - name: Sandbox edge perimeter guard
        run: node --test tests/ops/sandbox-edge-perimeter.test.mjs

      # A proof reference is a bearer capability: neither nginx edge may write
      # one whole to its access log, whatever spelling the client sent.
      - name: Proof reference log redaction guard
        run: node --test tests/ops/nginx-proof-log-redaction.test.mjs

      # Every operator guard in tests/ops — not only the ones named above. Only
      # four of twenty-five were wired here, so the rest (migration contracts,
      # the financial-assurance SQL, the proof namespace, the synthetic proof
      # register, one URL per proof…) were local-only gates. A new guard is
      # enforced the moment it lands.
      # The DB-backed guards (every file that reads DATABASE_URL: the migration
      # contracts and the financial-assurance SQL) need PostgreSQL and sqlx, so
      # they run in the Rust job, which has both. The same predicate splits the
      # set in both jobs, so no guard falls between them.
      - name: All operator guards (tests/ops, no database)
        run: node --test $(grep -L DATABASE_URL tests/ops/*.test.mjs)

      # Where this operator is allowed to charge money.
      #
      # Exactly three operations resolve an operator fee, and each was audited
      # for whether a caller could steer which rule applies. That audit is only
      # worth something while the list is complete — a fourth consumer added
      # quietly would inherit none of the review, and on current evidence would
      # inherit the defect: every consumer that predated this work treated
      # "no rule matched" as a fee of zero.
      - name: Pricing consumer inventory
        run: node tools/check-pricing-consumers.mjs

      # CLIENT-CONTROLLED ECONOMIC-POLICY AUTHORITY.
      #
      # A caller influencing what it is charged without ever sending an amount.
      # Every instance was defended as "reference only, never a fee" — true, and
      # beside the point, because choosing the reference chooses the rate. Three
      # fixes each looked complete; fee_policy_ref survived the first two
      # because the guard of the day checked one field by name.
      #
      # The self-test reintroduces each instance and requires the gate to fail
      # on it, so a gate that has never failed cannot be mistaken for one that
      # cannot.
      - name: Economic authority gate
        run: |
          node tools/check-economic-authority.mjs
          node tools/check-economic-authority.selftest.mjs

      # A new fee-bearing operation cannot ship without a policy.
      #
      # The wildcard model's failure was that an operation introduced tomorrow
      # inherited today's rate the day it shipped. V2 refuses to price an
      # operation no rule names — but refusing at runtime means discovering it
      # in production, on a real withdrawal. This moves the discovery to CI: the
      # enum, the database constraint and the completeness gate must agree.
      - name: Released fee-bearing operations
        run: node tools/check-released-operations.mjs

      # Every harness that mints operator authority must be able to give it
      # back. This is the static half — sources the cleanup library, records
      # what it creates, does not install a second EXIT trap that would replace
      # the run's cleanup handler. The dynamic half (run the suite, compare the
      # operator's inventory before and after) needs the deployed Sandbox and
      # deliberately does NOT run here: this runner executes repository code,
      # including code from a branch under review, and must never hold Sandbox
      # credentials. It runs on the operator's machine as
      # tests/phase0/fixture-hygiene-suite.sh.
      - name: E2E fixture hygiene gate
        run: |
          node tools/check-harness-hygiene.mjs
          node tools/check-harness-hygiene.selftest.mjs
          node tools/check-harness-hygiene.console.selftest.mjs

      # A proof that runs over ssh must report what happened on the far side.
      # Six assurance scripts and one deploy step were discarding it — the
      # remote command ended in a cleanup `rm`, whose status is what ssh
      # returns. This is the static half; the behavioural half needs the
      # Sandbox host and runs there as `make check-remote-contract`.
      - name: Remote exit-status contract
        run: |
          node tools/check-remote-wrappers.mjs
          node tools/check-remote-wrappers.selftest.mjs
          node tools/check-deploy-status-capture.mjs
          node tools/check-deploy-status-capture.selftest.mjs

      - name: Asset inventory gate (cleanup dispositions + secret hygiene)
        run: node tools/check-asset-inventory.mjs

      - name: Live fail-closed guard
        run: node tools/check-live-fail-closed.mjs

      - name: Mobile sandbox-config guard
        run: node tools/check-mobile-sandbox-config.mjs

      - name: Docs claim consistency guard
        run: node tools/check-docs-claims.mjs

      - name: SDK contract guard
        run: node tools/check-sdk-contract.mjs

      # A pin that cannot resolve is not a stricter pin — it is a job that
      # cannot run, wearing the appearance of one that is locked down.
      - name: Action pins resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/check-action-pins.mjs

  # ─── Migration governance ───────────────────────────────────────────────────
  # Fails the pipeline on any migration drift: an invalid/out-of-order sequence, a
  # migration that does not apply from scratch, leftover pending migrations, a
  # frozen (Phase 2 / ADR-036) migration leaking into the active source, or a
  # sqlx-backfill that no longer matches real sqlx tracking. This is the gate that
  # makes `sqlx migrate run` the single source of truth (audit Part 4).
  dart-client:
    name: Dart client SDK — format, analyze, test, publish-guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Dart
        # The previous pin (0a8a0fc8ab24c1a9e5ea6ba4c62b6bcbb08c8e14) does not
        # exist. It shares its first seven characters with the real v1.6.5 tag
        # and then diverges — a plausible-looking SHA that GitHub cannot
        # resolve, so this job failed at "Set up job" before running a step. It
        # went unnoticed because the self-hosted runner was offline and the job
        # had never actually been dispatched. This is v1.7.0's real commit.
        uses: dart-lang/setup-dart@e630b99d28a3b71860378cafdc2a067c71107f94 # v1.7.0

      - name: Install dependencies
        working-directory: sdk/dart-client
        run: dart pub get

      - name: Check formatting
        working-directory: sdk/dart-client
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: sdk/dart-client
        run: dart analyze --fatal-infos

      # The E2E tag needs a real Sandbox key, so it is excluded here; the unit,
      # link-safety and credential-safety suites all run.
      - name: Run tests
        working-directory: sdk/dart-client
        run: dart test -x e2e

      # A published client package must be publishable and must carry nothing
      # from the monorepo. The dry-run is the only check that sees the actual
      # archive contents.
      - name: Publish dry-run
        working-directory: sdk/dart-client
        run: dart pub publish --dry-run

      # The internal application framework must stay unpublishable. A comment
      # would not stop a `dart pub publish` typed in the wrong directory.
      - name: The internal Flutter framework is not publishable
        run: |
          grep -qE '^publish_to:[[:space:]]*none[[:space:]]*$' sdk/flutter/pubspec.yaml \
            || { echo 'sdk/flutter must declare publish_to: none (Banzami ADR-053)'; exit 1; }

      # Secret keys must never appear as a value in client software. Scoped to
      # lines that USE one — naming a secret key in order to forbid it is the
      # opposite of the hazard.
      - name: No secret key in client software
        run: |
          if grep -rnE "bz_(test|live)_sk_[A-Za-z0-9]{4}" sdk/dart-client/lib sdk/dart-client/example sdk/dart-client/README.md \
               | grep -viE 'never|must not|do not|forbidden|refuse'; then
            echo 'a secret key appears as a value in the client SDK'; exit 1
          fi
          echo 'no secret key in client software'

  migrations:
    name: Migrations — sequence, tracking, freeze
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     banzami
          POSTGRES_PASSWORD: banzami_dev
          POSTGRES_DB:       banzami_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U banzami -d banzami_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked

      - name: Active sequence applies cleanly from scratch (order + completeness)
        run: sqlx migrate run --source db/migrations

      # Authoritative physical-schema gate: the from-scratch DB must satisfy the
      # reviewable manifest (tools/schema-manifest.json). This is the same detector
      # deploy.sh runs pre-deploy — here it proves the manifest tracks the migrations
      # so a missing object (the 0090–0095 drift class) fails CI, not production.
      - name: Schema-manifest drift detector (authoritative, from-scratch)
        run: |
          psql "$DATABASE_URL" -tAc "$(cat tools/introspect-schema.sql)" > /tmp/inv.json
          node tools/check-schema-manifest.mjs tools/schema-manifest.json /tmp/inv.json

      - name: No pending migrations after run
        run: |
          if sqlx migrate info --source db/migrations | grep -qi pending; then
            echo "::error::pending migrations after run — sequence drift"; exit 1
          fi

      - name: Frozen migrations must NOT be in the active source
        run: |
          if ls db/migrations/0064_* db/migrations/0065_* db/migrations/0066_* 2>/dev/null; then
            echo "::error::a frozen Phase-2 migration (collections/payment_intents) is in the active source"; exit 1
          fi
          test -d db/migrations.phase2 || { echo "::error::db/migrations.phase2 (freeze) missing"; exit 1; }

      # The "sqlx-backfill matches real sqlx tracking" step was REMOVED.
      #
      # It validated tools/sqlx-backfill.sh, which has since been retired: the
      # backfill records migrations as applied WITHOUT running their DDL and was
      # the root cause of the banzami_staging schema drift. The script now refuses
      # to run at all, so the step could only ever fail. Retiring it here is step 2
      # of the plan in docs/refunds/drift-detector/README.md ("remove from all
      # runbooks; mark deprecated, then delete").
      #
      # The authoritative replacement already runs above: migrations are applied
      # from scratch with `sqlx migrate run`, then the physical schema-manifest
      # drift detector proves the resulting database matches the reviewed manifest.

  # ─── Security gate ──────────────────────────────────────────────────────────
  # Runs the repository's own aggregated security gate (`make security-check`):
  # the regression suites that encode each remediated finding, a secret scan over
  # tracked files, and the Rust/Go dependency vulnerability scanners. The gate
  # itself decides what is fatal — this job simply provides the tooling it needs
  # so nothing is silently reported as "skipped" in CI.
  amd64-artifacts:
    name: Production artefacts — linux/amd64 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # This job existed because CI ran on an arm64 self-hosted runner while
      # production runs on amd64: unit tests passing on arm64 were real evidence,
      # but not evidence that the shipped artefacts even compiled for the
      # architecture they run on.
      #
      # CI now runs on GitHub-hosted amd64, so this build is native rather than
      # cross, and the gap it was closing is closed by every other job instead.
      # It is kept because it is still the only job that builds EVERY deployable
      # artefact for the production target in one place — and because the runner
      # architecture is a CI detail that can change again.
      #
      # It remains a BUILD check, not an execution check.
      - name: Runner identity
        run: |
          echo "runner=$RUNNER_NAME host_arch=$(uname -m)"
          echo "target=x86_64-unknown-linux-gnu (production)"

      # Self-proving guard: this asserts the property the workflow relies on
      # rather than trusting the `defaults:` block to still be there. Under the
      # default `bash -e` shell `false | head -1` succeeds, so this step would
      # fail — which is exactly the false positive it exists to prevent.
      - name: Assert pipeline failures propagate
        run: |
          if (false | head -1); then
            echo "::error::pipefail is NOT active — a failing producer in a pipeline would pass silently"
            exit 1
          fi
          echo "pipefail active: a failing producer fails the step"

      # Go is installed per-job by setup-go, exactly as the other Go jobs do it —
      # the runner image deliberately does not ship a Go toolchain, so a job that
      # assumes one fails with "go: not found".
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/api-gateway/go.mod

      - name: Go services — linux/amd64 binaries
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          set -e
          # -o must be a DIRECTORY here: `./...` matches several packages, and
          # `go build -o <file> ./...` refuses to write multiple packages to a
          # non-directory. Each service's main package lands in OUT as its own
          # binary, whatever the cmd/ directory happens to be called.
          OUT=/tmp/amd64-bin
          rm -rf "$OUT" && mkdir -p "$OUT"
          for svc in api-gateway public-api admin-api developer-api sandbox-operator; do
            echo "::group::$svc"
            (cd "services/$svc" && go build -o "$OUT/" ./...)
            echo "::endgroup::"
          done
          ls -1 "$OUT"
          [ "$(ls -1 "$OUT" | wc -l)" -ge 5 ] \
            || { echo "expected at least 5 service binaries, got $(ls -1 "$OUT" | wc -l)"; exit 1; }

      - name: Rust core — linux/amd64 binary
        working-directory: core
        env:
          SQLX_OFFLINE: "true"
          CARGO_BUILD_JOBS: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --target x86_64-unknown-linux-gnu -p banzami-core-api --bin core-api

      # A build that silently produced arm64 output would pass the steps above
      # while proving nothing, so assert the machine type of the artefact itself.
      - name: Assert artefacts are x86-64
        run: |
          set -e
          BIN=core/target/x86_64-unknown-linux-gnu/debug/core-api
          readelf -h "$BIN" | grep -q 'Machine:.*X86-64' \
            || { echo "core-api is not x86-64"; readelf -h "$BIN" | grep Machine; exit 1; }
          echo "core-api: $(readelf -h "$BIN" | awk -F: '/Machine/{print $2}' | xargs)"
          for b in /tmp/amd64-bin/*; do
            readelf -h "$b" | grep -q 'Machine:.*X86-64' \
              || { echo "$(basename "$b") is not x86-64"; exit 1; }
            echo "$(basename "$b"): x86-64 OK"
          done

  security:
    name: Security — regressions, secrets, dependencies
    runs-on: ubuntu-latest

    # The regression suites include DB-backed tests (the proof-reference
    # collision regression seeds a real table). Without a database this job
    # reported them as a connection failure — the finding's regression never ran
    # here, and the job was red for a reason that said nothing about security.
    # Same Postgres and migrations as the go-gateway job, so they run for real.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     banzami
          POSTGRES_PASSWORD: banzami_dev
          POSTGRES_DB:       banzami_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U banzami -d banzami_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Apply migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/api-gateway/go.mod
          cache-dependency-path: services/api-gateway/go.sum

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05

      - name: Install scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cargo install cargo-audit --locked
          # Pick the asset matching this runner's architecture. This was hard-coded
          # to linux_x64, which silently does not run on an arm64 runner.
          case "$(uname -m)" in
            x86_64)  GL_ARCH=x64 ;;
            aarch64|arm64) GL_ARCH=arm64 ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_${GL_ARCH}.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: make security-check
        run: make security-check

  # ─── Deploy ─────────────────────────────────────────────────────────────────
  # OPT-IN, disabled by default. Production deployment is done manually with
  # `./deploy.sh` (see CLAUDE.md §19.4) — this CI job is a redundant alternative.
  # It is gated on the `ENABLE_CI_DEPLOY` repository variable so it is SKIPPED
  # (not failed) by default; skipping keeps CI green and consumes no Actions
  # minutes. To re-enable CI-driven deploys, set repository variable
  # ENABLE_CI_DEPLOY=true (Settings → Secrets and variables → Actions → Variables)
  # — and ensure GitHub Actions billing is current.
  # Secrets required when enabled:
  #   DEPLOY_HOST       — production server IP or hostname
  #   DEPLOY_USER       — SSH user (e.g. root)
  #   DEPLOY_SSH_KEY    — private SSH key (PEM format)
  deploy:
    name: Deploy to production
    # This is the only job that receives production credentials (DEPLOY_SSH_KEY /
    # DEPLOY_HOST / DEPLOY_USER). It ran on an ephemeral GitHub-hosted VM when
    # every other job ran on a persistent self-hosted runner, so that deployment
    # authority never sat on a long-lived machine executing repository code from
    # any branch under review.
    #
    # Every job is hosted now, so that no longer distinguishes this one — but the
    # reason still holds: an ephemeral VM that is destroyed after the run is
    # where a deployment key belongs. The job is opt-in (ENABLE_CI_DEPLOY) and
    # currently disabled.
    runs-on: ubuntu-latest
    needs: [rust, go-gateway, go-admin, go-public, go-sandbox-operator, typescript, admin-frontend, migrations, security]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_CI_DEPLOY == 'true' }}
    environment: production

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Write the SSH private key to a temp file for rsync + ssh commands.
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::DEPLOY_SSH_KEY secret not configured — skipping deploy"
            echo "DEPLOY_SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      # rsync the repo to the server, skipping generated directories.
      # --delete removes files on the server that no longer exist locally.
      - name: Sync source to server
        if: env.DEPLOY_SKIP != 'true'
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='**/node_modules/' \
            --exclude='**/target/' \
            --exclude='**/.next/' \
            --exclude='.env' \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new" \
            . "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/banzami/source/"

      # Run database migrations before restarting services.
      # Uses the sqlx-cli Docker image so the server needs no local Rust toolchain.
      - name: Run database migrations
        if: env.DEPLOY_SKIP != 'true'
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /srv/banzami/source && \
             source /srv/banzami/.env && \
             docker run --rm \
               --network host \
               -e DATABASE_URL=\"\$DATABASE_URL\" \
               -v \$(pwd)/db/migrations:/migrations \
               ghcr.io/launchbadge/sqlx-cli:0.7.4 \
               sqlx migrate run --source /migrations"

      # Enforced rollout gate: introspect the JUST-MIGRATED target database and run
      # the authoritative manifest drift detector. Runs AFTER migrate, BEFORE any
      # image build/restart — a drift here FAILS the job so no application is
      # deployed against a schema that does not satisfy the manifest.
      - name: Schema-manifest drift detector (target DB) — blocks deploy on drift
        if: env.DEPLOY_SKIP != 'true'
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /srv/banzami/source && source /srv/banzami/.env && \
             psql "$DATABASE_URL" -tAc "$(cat tools/introspect-schema.sql)"' > /tmp/inv.json
          node tools/check-schema-manifest.mjs tools/schema-manifest.json /tmp/inv.json

      # Rebuild application images on the server (uses Docker layer cache —
      # unchanged layers are fast). Then perform a rolling restart so at least
      # one replica is always serving traffic.
      - name: Build and restart services
        if: env.DEPLOY_SKIP != 'true'
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e
             cd /srv/banzami/source/infra/docker
             docker compose -f docker-compose.full.yml build \
               core-api api-gateway admin-api public-api pay-frontend
             docker compose -f docker-compose.full.yml up -d --no-deps \
               core-api api-gateway admin-api public-api pay-frontend"

      # Quick health check — fails the deploy if either service is not responding.
      - name: Verify health
        if: env.DEPLOY_SKIP != 'true'
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sleep 8
             curl -fsS http://localhost:8080/health > /dev/null && echo 'api-gateway OK'
             curl -fsS http://localhost:8081/health > /dev/null && echo 'core-api OK'"

      - name: Clean up SSH key
        if: always()
        run: rm -f /tmp/deploy_key
