name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Shared across all jobs that need a database
  DATABASE_URL: postgres://banzami:banzami_dev@localhost:5433/banzami_dev

jobs:
  # ─── Rust core ──────────────────────────────────────────────────────────────
  rust:
    name: Rust — build, lint, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     banzami
          POSTGRES_PASSWORD: banzami_dev
          POSTGRES_DB:       banzami_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U banzami -d banzami_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: rust-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked

      - name: Apply migrations
        working-directory: core
        run: sqlx migrate run --source ../db/migrations

      - name: Check formatting
        working-directory: core
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        working-directory: core
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests (unit + integration)
        working-directory: core
        run: cargo test --workspace
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

  # ─── Go api-gateway ─────────────────────────────────────────────────────────
  go-gateway:
    name: Go api-gateway — vet, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api-gateway/go.mod
          cache-dependency-path: services/api-gateway/go.sum

      - name: go vet
        working-directory: services/api-gateway
        run: go vet ./...

      - name: go test
        working-directory: services/api-gateway
        run: go test -race -count=1 ./...

  # ─── Go admin-api ───────────────────────────────────────────────────────────
  go-admin:
    name: Go admin-api — vet, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/admin-api/go.mod
          cache-dependency-path: services/admin-api/go.sum

      - name: go vet
        working-directory: services/admin-api
        run: go vet ./...

      - name: go test
        working-directory: services/admin-api
        run: go test -race -count=1 ./...

  # ─── Go public-api ──────────────────────────────────────────────────────────
  go-public:
    name: Go public-api — vet, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/public-api/go.mod
          cache-dependency-path: services/public-api/go.sum

      - name: go vet
        working-directory: services/public-api
        run: go vet ./...

      - name: go test
        working-directory: services/public-api
        run: go test -race -count=1 ./...

  # ─── TypeScript SDK ─────────────────────────────────────────────────────────
  typescript:
    name: TypeScript SDK — typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Type-check
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: Run tests
        working-directory: sdk/typescript
        run: npm test

  # ─── Deploy ─────────────────────────────────────────────────────────────────
  # Runs only on pushes to main, after every CI job passes.
  # Secrets required (Settings → Secrets and variables → Actions):
  #   DEPLOY_HOST       — production server IP or hostname
  #   DEPLOY_USER       — SSH user (e.g. root)
  #   DEPLOY_SSH_KEY    — private SSH key (PEM format)
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [rust, go-gateway, go-admin, go-public, typescript]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      # Write the SSH private key to a temp file for rsync + ssh commands.
      - name: Configure SSH
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      # rsync the repo to the server, skipping generated directories.
      # --delete removes files on the server that no longer exist locally.
      - name: Sync source to server
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='**/node_modules/' \
            --exclude='**/target/' \
            --exclude='**/.next/' \
            --exclude='.env' \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            . "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/banzami/source/"

      # Run database migrations before restarting services.
      # Uses the sqlx-cli Docker image so the server needs no local Rust toolchain.
      - name: Run database migrations
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /srv/banzami/source && \
             source /srv/banzami/.env && \
             docker run --rm \
               --network host \
               -e DATABASE_URL=\"\$DATABASE_URL\" \
               -v \$(pwd)/db/migrations:/migrations \
               ghcr.io/launchbadge/sqlx-cli:latest \
               sqlx migrate run --source /migrations"

      # Rebuild application images on the server (uses Docker layer cache —
      # unchanged layers are fast). Then perform a rolling restart so at least
      # one replica is always serving traffic.
      - name: Build and restart services
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e
             cd /srv/banzami/source/infra/docker
             docker compose -f docker-compose.full.yml build \
               core-api api-gateway admin-api public-api
             docker compose -f docker-compose.full.yml up -d --no-deps \
               core-api api-gateway admin-api public-api"

      # Quick health check — fails the deploy if either service is not responding.
      - name: Verify health
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sleep 8
             curl -fsS http://localhost:8080/health > /dev/null && echo 'api-gateway OK'
             curl -fsS http://localhost:8081/health > /dev/null && echo 'core-api OK'"

      - name: Clean up SSH key
        if: always()
        run: rm -f /tmp/deploy_key
