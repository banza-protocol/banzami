    # port to Cloudflare ranges so the origin is not directly reachable.
    # Lifecycle still records intended state only; operational truth comes from
    # `make assure-sandbox-runtime`, which now passes against the public
    # hostnames with no overrides.
    - { id: bzsbedge-sandbox-edge, image: nginx:1.27-alpine, port: "2053 origin (public via Cloudflare Origin Rule)", purpose: "Stage C sandbox public routing (sandbox-api + developer-api)", environment: sandbox, lifecycle: active-required, note: "no DB, no secrets, no writable volumes; reuses the Cloudflare Origin cert read-only; not on banzami_net so it cannot reach production services" }
