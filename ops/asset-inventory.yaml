    kind: vm
    location: 217.160.9.248 (IONOS)
    purpose: single production+sandbox host (Docker, nginx edge)
    environment: live + sandbox (two-stack topology on one host)
    owner: fm65
    lifecycle: active-required
    note: >
      2026-07-04 cleanup: disk 80%→10% (build cache pruned, RA-027; ~85GB
      freed); automated pg-backup.timer installed + enabled (6-hourly,
      14-day rotation, restore-verified, RA-006); fail2ban active; ufw
      allows 22/80/443 only (RA-005). Residual: :8443 static-site origin
