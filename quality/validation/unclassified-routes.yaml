# Unclassified route ledger — Banzami Validation Studio (owner decision D14)
#
# This is the COMPLEMENT of the capability registry, not part of it. It lives
# beside quality/operator-assurance-manifest.yaml rather than inside it because
# the manifest is a registry of capabilities, and every row here is by
# definition a route that is not yet one. Mixing them would make the capability
# count meaningless.
#
# Every externally reachable route must be claimed by exactly one capability's
# api_surface, or appear here with a class and a reason. A route that is
# neither is RUNTIME_EXTERNALLY_REACHABLE_BUT_UNREGISTERED: live, with no
# owner, no journey, no contract and no deprecation path.
#
# Enforced by tools/check-runtime-route-registration.mjs:
#   normal CI   this ledger MUST NOT GROW, and a NEW unregistered route fails
#   --golden    every 'pending-classification' entry must be gone
#
# Seeded 2026-09-18 at 337 entries. That number is the honest size of
# the gap the inverse check found; it is a baseline to shrink, not a target.

