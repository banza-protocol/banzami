# Assurance registry — Banzami Validation Studio.
#
# Two things an operator cannot discover from the product itself:
#
#   invariants    the guarantees the Studio makes, where each is ENFORCED, and
#                 what proves it. These currently live only in source and tests,
#                 which means the person authorising a run cannot see them.
#
#   known_issues  validation debt. Not repository TODOs — only things that
#                 change how much a Validation Run should be trusted.
#
# Reviewed as code, like every other registry. The Studio renders it; it does
# not restate it.

$schema: banzami.validation.assurance/1
registry_version: 1

invariants:
  - id: INV-VS-001
    title_pt: "Uma execução contra o Live não pode sequer ser representada"
    title: A Validation Run against Live cannot be represented
    enforced_by: database
    layer: "CHECK (environment = 'SANDBOX') — migration 0160"
    proof: tools/check-validation-run-model.mjs
    why: >-
      REAL_LIVE_TESTS_EXECUTED=0 is a schema property rather than a policy. A
      run against Live is not discouraged or hidden behind a UI gate; there is
      no row that could hold one.

  - id: INV-VS-002
    title_pt: "No máximo uma execução detém o Sandbox"
    title: At most one Validation Run may hold the Sandbox
    enforced_by: database
    layer: partial unique index validation_runs_one_active
    proof: tools/check-validation-run-model.mjs
    why: >-
      Two concurrent runs would spend the same rolling volume budget and
      interleave in the same nine actors' balances. Concurrency here is not a
      race to handle, it is a state to refuse.

  - id: INV-VS-003
    title_pt: "Só transições declaradas são possíveis, e um estado terminal é terminal"
    title: Only declared state transitions are possible, and a terminal state is terminal
    enforced_by: database
    layer: trigger validation_runs_legal_transition
    proof: tools/check-validation-run-model.mjs
    why: >-
      A state machine that lives only in the process currently writing is one
      crash away from being untrue.

  - id: INV-VS-004
    title_pt: "O histórico é append-only e uma execução não pode ser apagada"
    title: A run's history is append-only, and a run cannot be deleted
    enforced_by: database
    layer: trigger validation_run_events_immutable + non-cascading foreign key
    proof: tools/check-validation-run-model.mjs
    why: >-
      A run is evidence. Evidence that can be edited is not evidence, and
      evidence that can be deleted is a record of what someone chose to keep.

  - id: INV-VS-005
    title_pt: "Sem proveniência obrigatória completa não há READY"
    title: A run cannot reach READY without complete mandatory provenance
    enforced_by: application
    layer: requireCompleteProvenance, inside the preparation transaction
    proof: services/admin-api/internal/validation/store_test.go
    why: >-
      A run whose provenance is missing is unattributable, and an unattributable
      result is worse than a known-stale one. Either the provenance rows and the
      READY transition both commit, or neither does.

  - id: INV-VS-006
    title_pt: "A proveniência regista a revisão IMPLANTADA, nunca o HEAD do repositório"
    title: Provenance records the DEPLOYED revision, never the repository HEAD
    enforced_by: application
    layer: BANZAMI_BUILD_COMMIT and GET /health .build
    proof: services/admin-api/internal/validation/provenance_test.go
    why: >-
      The source tree and what is running are different things, and usually
      different commits. Substituting one for the other would silently
      re-describe what a run actually tested.

  - id: INV-VS-007
    title_pt: "O Studio nunca guarda o valor de uma credencial nem a sua referência"
    title: The Studio never holds a credential value or a secret reference
    enforced_by: application
    layer: Actor carries credential NAMES only; measured is map[string]int64
    proof: services/admin-api/internal/validation/registry_test.go
    why: >-
      An operator needs to know that A01 has a TOTP seed registered. Knowing
      where that seed lives is a service nobody needs and a hint an attacker
      would take. The measured type makes a credential unassignable, so the
      compiler refuses before any redactor would.

  - id: INV-VS-008
    title_pt: "A verificação prévia não consome quota"
    title: The preflight consumes no quota
    enforced_by: application
    layer: read-only by construction, proven structurally against the source
    proof: services/admin-api/internal/validation/preflight_test.go
    why: >-
      An operator must be able to ask whether the Sandbox is fit as often as
      they like without spending the budget the answer is about. Asserting
      afterwards that nothing changed cannot distinguish "wrote nothing" from
      "wrote something idempotent", so the guard reads the source instead.

  - id: INV-VS-009
    title_pt: "A folga é medida com a definição do próprio motor que a impõe"
    title: Headroom is measured with the enforcing engine's own definition
    enforced_by: build
    layer: pilot_gen.go, extracted from core/compliance/src/pilot{,_enforce}.rs
    proof: tools/gen-pilot-limits.mjs --check
    why: >-
      A preflight that measured headroom differently from the engine that
      enforces it would clear a run the ledger then refuses halfway through —
      worse than no preflight at all.

  - id: INV-VS-010
    title_pt: "O plano de controlo põe em fila; nunca executa"
    title: admin-api queues a run and never executes one
    enforced_by: build
    layer: tools/check-validation-execution-boundary.mjs
    proof: tools/check-validation-execution-boundary.mjs
    why: >-
      Until Phase D this invariant said no code path could START a run, and a
      guard enforced it so that adding a starter would be a deliberate act. It
      was: the owner authorised Phase D and the starter landed in the commit
      that deleted the guard. What remains, and always will, is the boundary —
      a request handler that runs a test suite times out halfway through one and
      leaves a run whose real state nobody knows. The control plane queues; the
      execution plane runs.

  - id: INV-VS-011
    title_pt: "Autoridade de orquestração é separada da autoridade de cenário"
    title: Orchestration authority is separate from scenario authority
    enforced_by: application
    layer: RBAC — validation.run is not held by COMPLIANCE
    proof: services/admin-api/internal/server/validation_routes_test.go
    why: >-
      An actor that can schedule the validation it participates in is an actor
      whose PASS means less, because nothing outside the scenario decided the
      scenario should happen. See doc 31.

  - id: INV-VS-012
    title_pt: "Um perfil pode promover uma suite a bloqueante, nunca despromover"
    title: A profile may escalate a suite to blocking, never demote one
    enforced_by: build
    layer: check-validation-registries.mjs, cross-checked against suites.yaml
    proof: tools/check-validation-registries.mjs
    why: >-
      A profile must not be able to make a failing invariant stop counting.

known_issues:
  - id: VD-001
    title_pt: "Só um percurso está populado no registo"
    title: Only one journey is populated in the registry
    status: resolved
    severity: high
    scope: the whole validation universe
    blocks_golden: false
    blocks_full: false
    first_observed: "2026-09-18"
    resolved: "2026-09-19"
    resolution: >-
      37 journeys are registered across 23 of 24 suites. GOLDEN resolves to 12,
      every one backed by a harness that exists and asserts. The number this
      issue named is no longer true, so it is closed rather than left standing.
    detail: >-
      24 suites are declared; one journey (S06-COL-001) is written. A GOLDEN or
      FULL run today would exercise almost nothing. The Studio reports suite
      implementation status so this cannot be mistaken for coverage.
    detail_pt: >-
      24 suites estão declaradas; um percurso (S06-COL-001) está escrito. Uma execução GOLDEN ou FULL hoje não exerceria quase nada. O Studio reporta o estado de implementação de cada suite para que isto não possa ser confundido com cobertura.

  - id: VD-002
    title_pt: "Não existe motor de execução"
    title: No execution runner exists
    status: open
    severity: high
    scope: execution
    blocks_golden: true
    blocks_full: true
    first_observed: "2026-09-18"
    detail: >-
      Phase C deliberately builds the control surface and not the runner. No run
      can be started, and the guard INV-VS-010 keeps it that way until the
      decision is taken explicitly.
    detail_pt: >-
      A Fase C constrói deliberadamente a superfície de controlo e não o motor. Nenhuma execução pode ser iniciada, e o guarda INV-VS-010 mantém-no assim até a decisão ser tomada explicitamente.

  - id: VD-003
    title_pt: "BZV-20260918-0001 não tem proveniência"
    title: BZV-20260918-0001 has no provenance
    status: closed-historical
    severity: medium
    scope: one historical run
    blocks_golden: false
    blocks_full: false
    first_observed: "2026-09-18"
    detail: >-
      The first real prepared run predates C.10's provenance capture. It is
      preserved exactly, not backfilled: its incompleteness is the evidence that
      the defect was real. BZV-20260918-0002 carries full provenance.
    detail_pt: >-
      A primeira execução realmente preparada é anterior à captura de proveniência do C.10. Fica preservada exactamente, sem preenchimento retroactivo: a sua incompletude é a evidência de que o defeito era real. A BZV-20260918-0002 já leva proveniência completa.

  - id: VD-004
    title_pt: "A chave de idempotência da UI deriva do minuto"
    title: The UI's idempotency key is derived from the minute
    status: open
    severity: low
    scope: run preparation
    blocks_golden: false
    blocks_full: false
    first_observed: "2026-09-18"
    detail: >-
      The server mechanism is correct — a unique index on (environment,
      idempotency_key), and a replay returns the existing run untouched. But the
      key the UI generates changes every minute, so two clicks a minute apart
      create two runs instead of replaying one.
    detail_pt: >-
      O mecanismo do servidor está correcto — índice único em (environment, idempotency_key), e um replay devolve a execução existente intacta. Mas a chave que a UI gera muda a cada minuto, por isso dois cliques com um minuto de intervalo criam duas execuções em vez de repetir uma.

  - id: VD-005
    title_pt: "Seis falhas TestReceipt_* pré-existentes no api-gateway"
    title: Six pre-existing TestReceipt_* failures in api-gateway
    status: open
    severity: low
    scope: local test database only
    blocks_golden: false
    blocks_full: false
    first_observed: "2026-09-18"
    detail: >-
      Proven pre-existing by stashing the entire Phase C change set: the
      identical six fail on the clean tree with the identical
      consumers_active_display_name_present error. Local test-database schema
      drift, not a product defect. Deliberately not repaired to produce a green
      report.
    detail_pt: >-
      Provadas pré-existentes ao guardar todo o conjunto de alterações da Fase C: as mesmas seis falham na árvore limpa com o mesmo erro consumers_active_display_name_present. É deriva do esquema da base de dados de teste local, não um defeito do produto. Deliberadamente não reparadas para produzir um relatório verde.

  - id: VD-006
    title_pt: "developer-api e website-frontend divergem da árvore"
    title: developer-api and website-frontend diverge from the tree
    status: open
    severity: low
    scope: unrelated components
    blocks_golden: false
    blocks_full: false
    first_observed: "2026-09-18"
    detail: >-
      Both predate Phase C and neither is on a Validation Studio path. Recorded
      rather than repaired: deploying a service to turn a parity line green is
      the substitution of appearance for correctness this programme exists to
      prevent.
    detail_pt: >-
      Ambos são anteriores à Fase C e nenhum está num caminho do Validation Studio. Registados em vez de reparados: implantar um serviço para tornar verde uma linha de paridade é a substituição de aparência por correcção que este programa existe para impedir.

  - id: VD-007
    title_pt: "O fluxo de doação do DOA não é provável sem autorização do terceiro"
    title: DOA's donation flow cannot be proven without the third party's authorisation
    status: open
    severity: medium
    scope: S14 — the donation flow, not the binding
    blocks_golden: false
    blocks_full: false
    first_observed: "2026-09-19"
    detail: >-
      S14's binding half IS proven at runtime (S14-DOA-001, read-only). The
      donation half is not: doa-public-donation-e2e and webhook-delivery-to-doa
      WRITE into DOA's live tenant — DOA production runs on this Sandbox — and
      the donation harness additionally needs a human to complete an email OTP on
      www.doadoa.app plus caller-supplied PAY_SLUG, ACC_A and ACC_B. The blocker
      is consent and a human step, not engineering. The integration SHAPE (a
      platform taking a public payment, receiving a signed event, and a
      redelivery changing nothing) is proven against a synthetic tenant in S11
      and S13; what is missing is that DOA SPECIFICALLY still works, which only
      DOA's owner can authorise for a named window.
    detail_pt: >-
      A metade da ligação do S14 ESTÁ provada em execução (S14-DOA-001, só-leitura). A metade da doação não: dois harnesses ESCREVEM no inquilino real do DOA — a produção do DOA corre neste Sandbox — e o da doação exige ainda que uma pessoa complete um código enviado por email em www.doadoa.app, mais três identificadores fornecidos por quem chama. O impedimento é consentimento e um passo humano, não engenharia. A FORMA da integração está provada com um inquilino sintético em S11 e S13; o que falta é que o DOA ESPECIFICAMENTE continua a funcionar, e só o dono do DOA pode autorizar isso para uma janela nomeada.

  - id: VD-010
    title_pt: "O GOLDEN aceite não provou limpeza de recursos"
    title: The accepted GOLDEN did not prove resource cleanliness
    status: recorded
    severity: informational
    scope: BZV-20260919-0001
    blocks_golden: false
    blocks_full: false
    first_observed: "2026-09-19"
    detail: >-
      RESOURCE_CLEANLINESS_NOT_PROVEN_BY_GOLDEN_0001.

      BZV-20260919-0001 remains GOLDEN_FUNCTIONAL_ACCEPTANCE = PASS under the
      acceptance model in force when it ran, and nothing about it is amended.
      But that model had no cleanup barrier, and the barrier later demonstrated
      what it could not see: S04-RCV-001 can be a clean FUNCTIONAL pass while
      leaking funded state. That run left 2 650 000 minor behind across three
      identities — two from S04-RCV-001 and one from S05-LNK-002.

      It is therefore NOT a post-0161 cleanup-proven run and must never be
      described as one. Its journeys' cleanup_result columns are NULL because
      they predate the barrier, which is the honest record: not clean, not
      dirty — unmeasured.
    remediation: >-
      The residual was recovered on 2026-09-19T21:13Z through the canonical
      balanced path, as a LATER remediation event that amends no run. Evidence:
      evidence/validation/remediation/vd009-residual-recovery-20260919.json.
      Book sum 0 before and after, 10 counterparty entries added, financial
      truth PASS. The leak itself remains historical evidence.

  - id: VD-008
    title_pt: "O adaptador assurance-json nunca correu contra um harness real"
    title: The assurance-json adapter has never run against a real harness
    status: closed
    closed: "2026-09-19"
    closed_by: >-
      tools/e2e/docs/quickstart-e2e.mjs was executed through the runner's own
      runHarness() with the S19-DOC-001 registry arguments, against the deployed
      Sandbox: twelve steps PASS, residue 0, @banzami/sdk 0.14.1 installed from
      the public npm registry into an empty directory. The adapter read that
      report — 12 gates, reconciled against the harness's own total, no gate
      manufactured. The report is pinned at
      evidence/assurance/docs-quickstart/vd008-real-report-20260919.json
      (sha256 d5f94e6644d0f24dfe73de33d24226294a5965f453fe49a812b7a0bec77510f7)
      and the harness that produced it at sha256
      4b187f7deaaf164847598a721a248272e3ba7d410be9fe27f82ac54e88176d80.
      make check-validation-assurance-adapter drives the shipping adapter over
      it and over mutations OF it — PENDING, NOT_RUN, SKIPPED, an empty verdict,
      an inflated total, a truncated file, a report filed under another stem —
      because the real run took only the all-PASS path and a branch no run
      exercised still has to be proven against the shape a run produces. It is
      mutation-proven: letting anything that is not an explicit FAIL count as a
      pass turns eight of those assertions red.
    also_found: >-
      The run cost ZERO application-submit slots, against a plan that declared
      one. The classifier was matching the substring /v1/merchant/applications,
      and the harness uploads a document to an application it has already
      created. FULL's declared budget drops from 12 to 11 (10 runner + 1 VM).
      The error was in the safe direction; it was still a number nothing had
      checked against a measurement.
    severity: medium
    scope: S19 — the only journey that uses it
    blocks_golden: false
    blocks_full: true
    first_observed: "2026-09-19"
    detail: >-
      S19-DOC-001 is registered EXECUTABLE on an adapter proven only against
      fixtures: the three report shapes, the reconciliation, and PENDING/NOT_RUN
      never counting as a pass. That is exactly how phase0-stdout looked finished
      while the runner could not start a phase-0 harness at all — no fixture can
      discover a missing staged dependency, and none did. quickstart-e2e costs
      one application-submit slot and moves money, and the current window is
      reserved for the GOLDEN acceptance run and its retry, so this is recorded
      rather than spent. It does not block GOLDEN (S19 is not in it) and it does
      block FULL until the adapter has read one real report.
    detail_pt: >-
      O S19-DOC-001 está registado como EXECUTÁVEL com base num adaptador provado apenas contra fixtures. Foi exactamente assim que o adaptador shell pareceu terminado enquanto o executor nem conseguia arrancar um harness — nenhuma fixture descobre uma dependência que falta no envio. Correr o harness real custa uma candidatura e move dinheiro, e a janela actual está reservada para a execução GOLDEN e a sua repetição. Não bloqueia o GOLDEN; bloqueia o FULL até o adaptador ter lido um relatório real.

  - id: VD-009
    title_pt: "O limite superior de fundos do FULL excede o tecto do Sandbox"
    title: FULL's upper-bound funded exposure exceeds the Sandbox cap
    status: owner_gated
    engineering_complete: "2026-09-19"
    resolution: >-
      The fix was never a larger cap: it is for the runner to VERIFY cleanup
      after every journey and stop when residue is not proven nil. With that
      barrier armed, no two journeys hold exposure at the same time, so FULL's
      operative bound stops being the SUM of declared ceilings and becomes the
      MAX of them:

        CUMULATIVE_EXPOSURE_BOUND  56 950 000   (no barrier — what VD-009 measured)
        NORMAL_PEAK_MAX             3 000 000   (barrier armed)
        FAILURE_RESIDUAL_MAX        3 000 000
        RETRY_PEAK_MAX              3 000 000
        REQUIRED_HEADROOM           6 000 000   (was 113 900 000)

      Both bounds are always returned by plannedPeakFunds and which one applies
      is a property of the RUNNER, passed in explicitly — reporting only the
      smaller one would make FULL look feasible on an executor that cannot
      deliver the premise, which is the invisible dependency this defect was
      opened about. FAILED and UNDECLARED both stop the run: the concurrent
      bound holds only while every journey is PROVEN back at baseline, and an
      unmeasured journey breaks the proof exactly as a leaking one does.
      Migration 0161 records FUNCTIONAL_RESULT and CLEANUP_RESULT separately and
      its CHECK refuses a PASSED journey whose cleanup failed, so the invariant
      does not depend on the executor — the thing most likely to be edited in a
      hurry during a failing run. make check-validation-cleanup-barrier is
      mutation-proven on four points: letting UNDECLARED pass, continuing past a
      failed cleanup, claiming before refusing, and dropping the schema CHECK.
    evidence_that_it_was_real: >-
      Measured on 2026-09-19 after the accepted GOLDEN run: aggregate funded
      value rose from 14 952 600 to 18 872 600, and the read-only synthetic
      audit attributes 2 650 000 of it to three RUN_OWNED_DISPOSABLE consumers
      created that day (e2ep0ybf9zztu, e2efcmu8ai4zc, e2efcmu8aj5xa). The run
      was a clean FUNCTIONAL pass and left funded value behind — which is
      precisely the distinction 0161 exists to record, and which nothing could
      express before it.
    blocked_on: >-
      OWNER — migration 0161 must be applied to the Sandbox through the operator
      TTY ceremony (never psql; that is what caused the 0090–0095 drift). Until
      it is, the runner REFUSES to claim a FULL run and says
      VALIDATION_CLEANUP_BARRIER_UNAVAILABLE, leaving the run QUEUED and unspent
      rather than burning an owner authorisation it cannot honour.
    severity: high
    scope: S-all — FULL readiness, not GOLDEN
    blocks_golden: false
    blocks_full: true
    first_observed: "2026-09-19"
    detail: >-
      With every journey now declaring max_synthetic_funds_exposure_minor, FULL's
      no-cleanup upper bound is 56 950 000 minor against a shared cap of
      50 000 000 — and the start gate, which must also survive a failed run plus
      one retry, needs 113 900 000. FULL is therefore feasible ONLY because
      cleanup works, and that dependency was invisible while the planner reported
      a heuristic 4 500 000. GOLDEN is unaffected: 14 500 000 peak, 29 000 000
      required, and the headroom exists. The fix is not a larger cap. It is for
      the runner to VERIFY cleanup after each journey and abort when residual
      accumulates, so the bound that matters becomes the per-journey maximum
      rather than the sum — which is a real change to how a FULL run is governed,
      not a number to adjust.
    detail_pt: >-
      Com todos os percursos a declarar a sua exposição máxima, o limite superior do FULL sem qualquer limpeza é 56 950 000 minor contra um tecto partilhado de 50 000 000 — e o portão de arranque, que tem de sobreviver a uma execução falhada mais uma repetição, exige 113 900 000. O FULL só é viável PORQUE a limpeza funciona, e essa dependência estava invisível enquanto o planeador reportava uns heurísticos 4 500 000. O GOLDEN não é afectado. A correcção não é um tecto maior: é o executor verificar a limpeza depois de cada percurso e abortar quando fica resíduo.

