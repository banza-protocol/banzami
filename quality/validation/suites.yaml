# Suite registry — Banzami Validation Studio.
#
# S00-S20 as specified in Phase A, plus three suites the audit showed are real
# and did not fit that taxonomy. Consumed by every control surface; no surface
# defines its own.

$schema: banzami.validation.suites/1
registry_version: 1

suite:
  fields:
    id:       {pattern: "^S[0-9]{2}$"}
    name:     string
    name_pt:  string          # BANZADMIN speaks Portuguese
    scope:    string
    existing_coverage: {enum: [strong, good, partial, weak, unit-only, none]}
    blocking: {type: bool, description: "does a FAIL here stop the run?"}
    # A FULL run must not quietly mean "the suites that happened to be easy".
    # A suite with no executable journey is NOT_PROVEN and must say why, in
    # terms a reviewer can check — never simply be absent from the results.
    runtime_proof: {enum: [EXECUTABLE, NOT_PROVEN], default: EXECUTABLE}
    blocker:
      class:         {enum: [SAFETY, SECURITY_POLICY, EXTERNAL, TOOLING, ARCHITECTURAL]}
      detail:        string
      detail_pt:     string     # BANZADMIN speaks Portuguese
      path_to_proof: string     # what would have to be true to make this EXECUTABLE

suites:
  - {id: S00, name: Environment / governance,      name_pt: Ambiente e governação,      existing_coverage: strong,    blocking: true}
  - {id: S01, name: Identity / auth / session,     name_pt: Identidade e autenticação,  existing_coverage: strong,    blocking: true}
  - {id: S02, name: App Banzami (Consumer),        name_pt: App Banzami,                existing_coverage: strong,    blocking: false}
  - {id: S03, name: App Banzami Business,          name_pt: App Banzami Business,       existing_coverage: strong,    blocking: false}
  - {id: S04, name: Business Receive Point,        name_pt: Ponto de recebimento,       existing_coverage: strong,    blocking: false}
  - {id: S05, name: Payment Links,                 name_pt: Links de pagamento,         existing_coverage: strong,    blocking: false}
  - {id: S06, name: Collections,                   name_pt: Cobranças divididas,        existing_coverage: strong,    blocking: false}
  - {id: S07, name: Refunds,                       name_pt: Reembolsos,                 existing_coverage: good,      blocking: false}
  - {id: S08, name: Consumer transfers / P2P,      name_pt: Transferências,             existing_coverage: partial,   blocking: false}
  - {id: S09, name: Financial truth,               name_pt: Verdade financeira,         existing_coverage: strong,    blocking: true}
  - {id: S10, name: Settlements / payouts,         name_pt: Liquidações e levantamentos, existing_coverage: good,     blocking: false}
  - {id: S11, name: Developer Platform,            name_pt: Plataforma de programadores, existing_coverage: strong,   blocking: false}
  - {id: S12, name: SDKs,                          name_pt: SDKs,                       existing_coverage: partial,   blocking: false}
  - {id: S13, name: Webhooks,                      name_pt: Webhooks,                   existing_coverage: strong,    blocking: false}
  # Partially proven, and the part that is proven is the one that decides who
  # gets paid. doa-canonical-binding is READ-ONLY — it was kept out of the
  # Validation universe by a BANZAMI_ALLOW_DOA_TENANT_WRITES caveat copied from
  # its two siblings and never applied to anything in it. The donation FLOW
  # remains unproven and is recorded as validation debt (VD-007), rather than
  # hidden behind a suite-level NOT_PROVEN that would have hidden the binding too.
  - id: S14
    name: DOA
    name_pt: DOA
    existing_coverage: good
    blocking: false
  - {id: S15, name: Receipts / comprovativos,      name_pt: Comprovativos,              existing_coverage: good,      blocking: false}
  # This suite was briefly classified NOT_PROVEN on the reasoning that
  # automating an MFA operator sign-in would require storing a TOTP seed. That
  # was wrong, and the record is kept rather than quietly edited: A01's
  # unattended session has existed since the Phase B owner ceremony, with its
  # seed at /root/.banzami/validation (0600), outside the repository and outside
  # every evidence artifact. The blocker described a wall that was not there.
  #
  # What was actually missing was a harness, and A01's COMPLIANCE role turned
  # out to be the RIGHT identity for the suite rather than an obstacle to it:
  # the sharpest thing BANZADMIN can prove is that the operator who runs the
  # Studio cannot start a run.
  - id: S16
    name: BANZADMIN
    name_pt: BANZADMIN
    existing_coverage: weak
    blocking: false
  - {id: S17, name: Security / authority / isolation, name_pt: Segurança e isolamento,  existing_coverage: good,      blocking: true}
  - {id: S18, name: Platform / web-mobile parity,  name_pt: Paridade de plataforma,     existing_coverage: good,      blocking: false}
  # Briefly NOT_PROVEN on a TOOLING blocker — the runner could not read this
  # harness's report shape. A TOOLING blocker is unfinished work wearing a
  # justification, so the adapter was written instead of the excuse being kept.
  - id: S19
    name: Contracts / OpenAPI / docs
    name_pt: Contratos e documentação
    existing_coverage: strong
    blocking: false
  # Challenged deliberately (Phase D §9) rather than left standing, and it
  # survives the challenge — but the class was wrong. The obstacle is not that
  # these dependencies belong to other people; it is that this operator built a
  # fault-injection seam for exactly ONE of them.
  - id: S20
    name: External dependencies
    name_pt: Dependências externas
    existing_coverage: partial
    blocking: false
    runtime_proof: NOT_PROVEN
    blocker:
      class: ARCHITECTURAL
      detail: >-
        The claim is not "the dependency is up". It is: when a dependency is
        DOWN, the operator classifies the failure as a dependency failure and
        confirms nothing. That is proven for the external rail (S23) because
        ADR-061 gave it an injectable failure whose blast radius is one Project
        (migration 0145 made a Project's simulated rail its own). No other
        dependency has such a seam: Resend, R2 and the npm registry cannot be
        failed on demand, and the only ways to fake it — disabling a control,
        pointing the Sandbox at a dead host — are the ones this programme
        forbids. What IS already proven incidentally: R2 round-trips KYB
        documents (S21-ONB-001), the npm registry serves the published SDK
        (S07-REF-002, SDK_FROM_NPM), and email delivery underpins the sign-in
        paths several journeys use. Those prove the dependencies work, which is
        the easy half and not this suite's claim. A reachability probe was
        considered and rejected: it would eliminate the blank without proving
        anything this suite asserts.
      detail_pt: >-
        A afirmação não é "a dependência está de pé". É: quando uma dependência
        está EM BAIXO, o operador classifica a falha como sendo da dependência e
        não confirma nada. Isso está provado para o canal externo (S23), porque o
        ADR-061 lhe deu uma falha injectável cujo raio de acção é um só Projecto.
        Nenhuma outra dependência tem essa costura, e as únicas formas de a
        simular são as que este programa proíbe. Uma sonda de alcançabilidade foi
        considerada e rejeitada: eliminaria o espaço em branco sem provar nada do
        que esta suite afirma.
      path_to_proof: >-
        The smallest missing capability is a per-dependency fault-injection seam
        with the same per-Project isolation the rail already has — one switch per
        declared dependency, scoped to a Validation Project, so a run can take
        email or storage down for itself and nobody else. That is a product
        change of the shape ADR-061 already set a precedent for, not a test to
        write, and it is why this stays ARCHITECTURAL rather than EXTERNAL.
  - id: S21
    name: Business onboarding lifecycle
    name_pt: Ciclo de vida de candidaturas
    scope: ADR-058/059 — application, KYB, approval, activation, one KYB authority
    existing_coverage: good
    blocking: false
    rationale: >-
      137 applications and 8 KYB routes; it is neither identity (S01) nor
      BANZADMIN (S16) — it spans both plus the public form.
  - id: S22
    name: Operator finance
    name_pt: Finanças do operador
    scope: pricing rules and profiles, fee policies, operator fees, reconciliation
    existing_coverage: weak
    blocking: false
    rationale: >-
      17 admin routes with essentially no deployed-Sandbox E2E, and it carries
      the critical-financial-confirmation requirement.
  - id: S23
    name: Rail boundary (ADR-061 fail-closed)
    name_pt: Fronteira do canal externo
    scope: >-
      Rail simulator down → hosted payment and payout fail closed with
      503 PROVIDER_UNAVAILABLE and nothing created, credited or confirmed;
      internal movements unaffected; per-(Project, Business) rail scope (0145).
    existing_coverage: unit-only
    blocking: true
    rationale: >-
      HIGHEST-VALUE NEW SUITE. ADR-061's central table is documented and
      unit-tested but never proven end to end against the deployed Sandbox
      (doc 19 VL-007). It is also what separates a product defect from an
      external dependency for every rail-crossing capability.
