# Journey registry — Banzami Validation Studio.
#
# Journeys are reviewed as code, never edited in a web form: a journey
# definition is executable truth. Seeded with the one journey an existing
# harness already performs end to end; the catalog grows in Phase C, and each
# entry names the harness it ORCHESTRATES rather than reimplementing it.

$schema: banzami.validation.journeys/1
registry_version: 1

journey:
  fields:
    journey_id:   {pattern: "^S[0-9]{2}-[A-Z]{3}-[0-9]{3}$"}
    suite:        {pattern: "^S[0-9]{2}$"}
    name:         {type: string}
    capabilities: {type: list<capability_id>, min: 1}
    actors:       {type: list<actor_id>}
    preconditions: {type: list<string>}
    entry_point:
      surface: {enum: [app-banzami-web, app-banzami-web-business, pay, banzadmin,
                       console, website, api, sdk, cli]}
      path:    {type: string}
    steps:
      type: list
      fields:
        action: string
        expect_ui:  {type: string, nullable: true}
        expect_api: {type: string, nullable: true}
        evidence:   {type: list<evidence_type>}
    financial_expectations:
      type: list
      oneOf:
        - {account: string, delta_minor: int}
        - {invariant: {enum: [debits_equal_credits, no_duplicate_effect,
                              book_matches_balance_reader, conservation]}}
    negative_assertions: {type: list<string>}
    evidence_required:   {type: list<evidence_type>, min: 1}
    cleanup:
      disposable: {type: list<string>}
      preserved:  {type: list<string>, note: "economic history — never deleted"}
    depends_on:  {type: list<journey_id>}
    automation:  {enum: [full, partial, manual, blocked-external, device-only]}
    existing_harness:
      type: string
      nullable: true
      description: >-
        The canonical harness this journey ORCHESTRATES. §106: the Lab reuses
        proven tooling rather than building a redundant parallel implementation.
        A journey whose behaviour an existing harness already performs MUST name
        it here rather than reimplement it.
    last_result: {computed: true}

verdicts:
  enum: [PASS, PASS_WITH_RETRY, FAIL, NOT_IMPLEMENTED, EXTERNAL_DEPENDENCY,
         OUT_OF_SCOPE, DEPRECATED, UNKNOWN]
  rules:
    - an unparseable or unreachable result is UNKNOWN, never PASS
    - an assertion failure is NEVER retried
    - a retry is permitted only for an infrastructure-class failure, and is recorded
    - PASS_WITH_RETRY must be 0 for a Golden Run
    - a journey cannot be PASS unless every evidence_required type resolves to an
      artifact in that run's Evidence Manifest

# One fully worked example, from a journey that ALREADY EXISTS and passes
# (tools/e2e/app-web/proofs/19-collections-split-settlement.mjs). No speculative
# journeys are populated in Phase A.
journeys:
  - journey_id: S06-COL-001
    suite: S06
    name: Split a charge two ways and settle both shares
    capabilities: [CAP-COLLECT-001, CAP-PAY-002, CAP-LEDGER-001, CAP-PROOF-001]
    actors: [B01, C01, C02]
    preconditions:
      - B01 is ACTIVE and not suspended
      - C01 and C02 are each funded at or above the share amount
      - aggregate volume budget has headroom for the charge   # doc 19 VL-001
    entry_point: {surface: app-banzami-web-business, path: /business/cobrar}
    steps:
      - action: create a 452,00 Kz charge and split it two ways
        expect_ui: two shares of 226,00 Kz
        evidence: [screenshot]
      - action: surface share 1 as a payment link and render its QR
        expect_api: "201 on POST /v1/collection-shares/{id}/surface"
        evidence: [screenshot, qr, api]
      - action: C01 scans the rendered QR pixels through the fake camera
        expect_ui: payer review screen shows 226,00 Kz and the Business name
        evidence: [qr, video, trace]
      - action: C01 confirms
        expect_ui: success; collection shows PARTIAL
        evidence: [screenshot, api, ledger]
      - action: C02 pays share 2 the same way
        expect_ui: collection shows COMPLETED; QR sheet auto-dismisses
        evidence: [screenshot, video, api, ledger, receipt]
    financial_expectations:
      - {account: "B01.available", delta_minor: 45200}
      - {account: "C01.available", delta_minor: -22600}
      - {account: "C02.available", delta_minor: -22600}
      - {invariant: debits_equal_credits}
      - {invariant: no_duplicate_effect}
    negative_assertions:
      - paying an already-settled share creates no second financial effect
      - B02 cannot read or surface B01's collection
      - the odd-minor-unit remainder is allocated deterministically
    evidence_required: [screenshot, video, trace, api, qr, ledger, receipt]
    cleanup:
      disposable: [draft collections, unused payment links]
      preserved:  [paid shares, receipts, ledger postings]
    depends_on: [S01-BIZ-001, S09-FIN-001]
    automation: full
    existing_harness: tools/e2e/app-web/proofs/19-collections-split-settlement.mjs

