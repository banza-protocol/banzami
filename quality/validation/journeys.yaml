  - journey_id: S07-REF-001
    suite: S07
    name: Reembolso completo sob credencial de programador
    purpose: >-
      A refund is the one operation that moves money BACKWARDS, so it is where authority errors become theft. The round trip is real — a payment is completed and then refunded with the project's own key — and the negative half matters as much: a second project holding an equally valid key must not be able to refund the first project's payment. Knowing a payment id is not authority over it.
    capabilities: []
    actors: [D01]
    preconditions:
      - the Sandbox public edge answers
      - the harness provisions and retires whatever it needs
    entry_point: {surface: api, path: "(see harness)"}
    steps:
      - action: run the canonical harness end to end against the deployed Sandbox
        expect_api: "exit 0, every recorded assertion PASS, and the adapter's count reconciled against the harness's own summary"
        evidence: [api, trace]
    financial_expectations: []
    negative_assertions:
      - a foreign project cannot read or refund another project's payment
      - a read-scoped key cannot refund
      - a replayed refund moves no money a second time
      - retired refund paths are gone, and moved nothing on the way out
    evidence_required: [api]
    cleanup:
      disposable: [fixtures the harness created]
      preserved:  [ledger postings]
    depends_on: []
    automation: full
    existing_harness: tests/phase0/refund-devkey-e2e.sh
    evidence_adapter: phase0-stdout
    timeout_seconds: 1200
    retry_policy: none

