      wallet_id: 36a72f51-ba28-4299-a964-d7da0bbb1317
      available_account_id: fd46e652-5d21-44a8-aa05-3d0ead655e4f
    credentials: {pin: "secret://banzami/validation/c01/pin"}
    status: provisioned
    provisioned_at: "2026-09-18"
    creation_evidence: "POST /v1/auth/register -> 201; PIN proven by POST /v1/auth/token -> 200"
    lifecycle: persistent
    provisioning: ["POST /v1/auth/register"]
    purpose: primary payer

  - id: C02
    type: consumer
