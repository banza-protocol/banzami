# Validation Actor registry — Banzami Validation Studio (owner decision D7/D8).
#
# APPROVED ROSTER. PROVISIONING IN PROGRESS — 5 of 9 (2026-09-18).
#
#   C01 C02 C03  provisioned — POST /v1/auth/register (no operator needed)
#   D01 D02      provisioned — Console OTP sign-in, then workspace + project
#   B01 B02 B03  BLOCKED — an application must be APPROVED by an operator
#                (CapApplicationApprove); the only ACTIVE operator is the owner's
#   A01          BLOCKED — POST /admin/v1/operators requires CapOperatorManage
#                AND a step-up (TOTP within 5 minutes)
#
# The four blocked actors share ONE boundary, not four: the owner's TOTP
# ceremony for A01. Once A01 exists it approves B01-B03 through the normal
# operator path. See docs/validation/studio/26-b10-owner-ceremony.md.
#
# Provisioning is deliberately the LAST step of Phase B (B10) and has not been
# performed. Creating the actors before the system can recognise them would
# produce nine ordinary Sandbox accounts that nothing owns, nothing monitors and
# nothing can attribute a run to — residue, not infrastructure. The preconditions
# are: this registry exists (done), secret references exist (declared below),
# the health model exists (tools/validation-actor-health.mjs), lifecycle
# ownership is defined (section `lifecycle` per actor), evidence attribution
# exists (run_id/actor_id on every Validation Resource), and the Studio can tell
# an actor from a customer (the `e2e` handle prefix + this registry).
#
# A product_id is recorded only after the canonical product flow has been walked
# for that actor. Nothing here was inserted into a database.

$schema: banzami.validation.actors/1
registry_version: 1
environment: SANDBOX          # the only permitted value

invariants:
  - id: ACTORS_ARE_ORDINARY
    rule: >-
      No Validation Actor receives a Core, authorization, RBAC, pricing, fee,
      settlement or ledger exception, nor exemption from KYB, suspension, rate
      limits or pilot limits.
    enforced_by: >-
      guard: no actor id, handle or email may appear in services/**, core/** or
      apps/** outside *_test files → ACTOR_LEAKED_INTO_PRODUCT = FAIL
  - id: ACTORS_ARE_SANDBOX_ONLY
    rule: no actor exists in, or may be migrated to, Live.
  - id: NO_SECRET_VALUES
    rule: credentials are `secret://` references only; never a value.

actor:
  fields:
    id:            {pattern: "^(C|B|D|A)[0-9]{2}$"}
    type:          {enum: [consumer, business, developer, operator]}
    display_name:  {type: string, note: must read as unmistakably synthetic}
    handle:        {type: string, nullable: true, constraints: "3-30 chars, lowercase, not in handle_registry owner_type=SYSTEM"}
    email:         {type: string, nullable: true, note: "only where the product requires one"}
    product_ids:
      consumer_id: {nullable: true}
      merchant_id: {nullable: true}
      wallet_id:   {nullable: true}
      workspace_id: {nullable: true}
      project_id:  {nullable: true}
      admin_user_id: {nullable: true}
    credentials:   {type: map<string, secret_reference>}
    status:        {enum: [proposed, provisioned, healthy, degraded, retired]}
    lifecycle:     {enum: [persistent, run-scoped]}
    provisioning:  {type: list<string>, note: "the product doors used — never a DB insert"}

secret_reference:
  format: "secret://banzami/validation/<actor>/<name>"
  resolves_to: "/run/secrets/validation_<actor>_<name>"   # existing docker-secret convention

# ── The proposed roster. Every credential below is what the PRODUCT actually
#    requires, read from the handlers — not assumed.
actors:

  - id: C01
    type: consumer
    display_name: Validation Actor C01
    handle: e2ec01
    email: null                      # POST /v1/auth/register takes handle+name+PIN only
    product_ids:
