  - id: CAP-SDK-001
    name: TypeScript SDK (@banzami/sdk)
    owner: developer-platform
    public_status: public-sandbox
    environments:
      sandbox: true
      live: false
    authority: internal
    authority_ref: SDK-first policy (CLAUDE.md §13)
    implementation:
      - sdk/typescript
    api_surface:
      - "@banzami/sdk/sandbox (curated external Sandbox entry): BanzamiClient.me() + config/errors/env helpers"
    threat_category: identity-auth
    tests:
      unit:
        - sdk/typescript env-resolution + webhook-signature tests
      integration: []
      e2e_sandbox:
        - SDK clean tarball-install E2E → BanzamiClient.me() against deployed Gateway with a fresh Console key (evidence artifact)
        - tests/phase0/refund-published-sdk-e2e.sh (25/25 through @banzami/sdk@latest installed from npm)
        - tests/phase0/sdk-types-cleanroom.sh (4/4 — fresh consumer, strict, skipLibCheck:false, no @types/node)
      negative_security:
        - bz_live_+sandbox rejected (BanzamiConfigError); ./sandbox exposes no unreleased-capability methods; tools/check-sdk-contract.mjs
        - public .d.ts declares no undeclared Node global; documented ./webhooks subpath resolves under NodeNext
    deployment_gate: sandbox-e2e-required
    cleanup_disposition: active-needs-remediation
    evidence:
      - tools/check-sdk-contract.mjs
      - evidence/assurance/dev-foundation/sdk-clean-install-1783203531.json
      - docs/operations/SDK_REGISTRY_OWNERSHIP_AND_RELEASE.md
      - .github/workflows/sdk-publish.yml
      - tools/sdk-release.mjs
      - evidence/assurance/sdk/cap-sdk-001-public-install.json
      - evidence/assurance/sdk/cap-sdk-001-types-cleanroom-1788629468.json
    surface: public
    disposition: released
    status: verified
    # RELEASED: published to the public npm registry as @banzami/sdk@0.5.0 (MIT,
    # 27 files) and proven from a clean temporary project OUTSIDE both the
    # Banzami and DOA repositories — installed from the registry with no
    # file:/link:/path dependency, then run against the deployed Sandbox:
    # me() resolves the project and scopes, and createPaymentSession returns a
    # payment link, deep link and dynamic QR.
    #
    # That external install is what earned the promotion, and it is also what
    # caught the defect that made 0.4.0 unusable: the client sent every key to
    # the merchant exchange endpoint, so a Console-issued key — the only kind
    # the documented path produces — failed authentication on the first call.
    # No in-repo test could have found it, because they all use local source.
    #
    # api_surface note: the curated ./sandbox entry still exposes only me().
    # Payment-session methods are reached through the main entry, and the
    # developer-key payment path is covered by the golden-journey suite rather
    # than by this capability.
    # Registry ownership (the former blocker) is resolved: the npm organisation
    # `banzami` is Banzami-owned. Publication remains a deliberate manual owner
    # action; no long-lived write token exists in CI.
    #
    # latest = 0.8.2. Every version through 0.8.0 is deprecated; 0.7.0/0.8.0
    # because createRefund pointed at a merchant-JWT route and answered 401 for
    # the only credential the SDK documents. 0.8.2 additionally fixed two defects
    # a consumer meets before writing any business code, both invisible in-repo
    # because our own projects have @types/node and import from the package root:
    # the public types demanded an undeclared Node global, and the ./webhooks
    # subpath the module's own example teaches was never exported.

  # RELEASED as banzami_client, which is NOT sdk/flutter.
  #
  # The capability used to name banzami_flutter. That package is a path
  # dependency of Banzami's own mobile apps — onboarding, KYB, theme, merchant
  # screens — and its docs instructed developers to compile a secret key into a
  # mobile binary. Publishing it would have presented first-party app internals
  # as a third-party product, so it now carries publish_to: none and the
  # capability names the purpose-built public client instead (Banzami ADR-053).
  - id: CAP-SDK-002
    name: Public Banzami client SDK (banzami_client, Dart/Flutter)
    owner: developer-platform
    public_status: public-sandbox
    environments:
      sandbox: true
      live: false
    authority: internal
    authority_ref: SDK-first policy (CLAUDE.md §13) · Banzami ADR-053
    implementation:
      - sdk/dart-client
    api_surface:
      - pub.dev banzami_client (dart pub add banzami_client)
    threat_category: identity-auth
    tests:
      unit:
        - sdk/dart-client/test/client_test.dart (construction refusals, typed errors, polling)
        - sdk/dart-client/test/links_test.dart (link and QR parsing)
      integration: []
      e2e_sandbox:
        - sdk/dart-client/test/sandbox_e2e_test.dart (10/10 with a real publishable key against the deployed Sandbox)
        - clean-room install from pub.dev outside every Banzami repository (16/16)
      negative_security:
        - the constructor refuses a SECRET key before any request, with the reason
        - a key from the wrong environment, and a LIVE client while LIVE is unreleased, are both refused
        - the operator refuses a publishable key on every route that moves money — create, transfer, refund, open account, manage webhooks, list the owner's accounts (403, measured)
        - parseSlug refuses look-alike hosts, http, wrong paths and malformed slugs; checkoutUrl throws rather than build a URL that would send a payer elsewhere
        - no credential is printed or interpolated into an error, guarded by a source test
        - the first-party framework carries publish_to: none, so it cannot be published by accident
    deployment_gate: sandbox-e2e-required
    cleanup_disposition: active-required
    evidence:
      - evidence/assurance/sdk/cap-sdk-002-public-install.json
      - docs/adr/ADR-053-flutter-package-boundary.md
    surface: public
    disposition: released
    status: verified

