  - id: CAP-APP-004
    name: Pay page + checkout
    owner: web
    public_status: public-sandbox
    environments:
      sandbox: true
      live: false
    authority: internal
    authority_ref: operator product
    implementation:
      - apps/pay
      - infra/nginx/sandbox-edge.conf.template
    api_surface:
      - https://pay.banzami.com (canonical) + https://checkout.banzami.com (308 alias)
      - /public/pay/{slug}
    threat_category: financial-money-movement
    tests:
      unit: []
      integration: []
      e2e_sandbox:
        - tests/phase0/hosted-checkout-e2e.sh (24/24 against the PUBLIC deployment)
        - tests/phase0/hosted-checkout-payment-e2e.sh (11/11, payer-authorised payment through the public page)
      negative_security:
        - the page carries no internal identifier — no merchant, wallet, account or consumer id
        - unknown and empty slugs are 404; a traversal attempt is refused and returns no file
        - no writable server-authoritative field — the page sends no amount, recipient or currency anywhere
        - the unapproved external acquiring rail is absent in SANDBOX, resolved server-side rather than hidden
        - the SANDBOX disclosure is server-rendered, so it survives JavaScript or the platform-mode fetch being blocked
        - strict CSP, frame-ancestors none, connect-src scoped to the gateway origin
        - a paid link offers no payment control, and a second settlement attempt is refused and moves nothing
    deployment_gate: sandbox-e2e-required
    cleanup_disposition: active-required
    evidence:
      - evidence/assurance/checkout/cap-app-004-public-hosted-checkout.json
      - docs/quality/PAYMENTS_CONTRACT_AUDIT.md
    # RELEASED on PUBLIC deployed evidence (Banzami ADR-052). pay.banzami.com
    # answers 200 and checkout.banzami.com 308s onto it, both routed by
    # sandbox-edge to a surface that holds no credential, no database and no
    # Core access, on the application plane alone.
    #
    # Before this, every Sandbox payment link the platform issued pointed at a
    # 503: the published SDK maps both environments to the same origin, so a
    # human following a real donation link reached a maintenance page. The
    # donation E2E had not caught it because the harness settles links through
    # the API rather than through the page.
    surface: public
    disposition: released
    status: verified

