# Programme: BANZAMI-SANDBOX-RELEASE-ASSURANCE-001 (started 2026-07-04)
#
# This file is the single authoritative registry of every material Banzami
# capability. docs/quality/BANZAMI_OPERATOR_ASSURANCE.md is GENERATED from
# this file (tools/generate-assurance-doc.mjs) — never edit the doc directly.
# Capability status MUST NOT be duplicated manually in other documents.
#
# Enforced by: tools/check-assurance-manifest.mjs  (make check-assurance)
#
# Schema (strict subset of YAML — 2-space indent, no anchors/aliases):
#   id                  CAP-<AREA>-<NNN>, unique
#   name                human name
#   owner               owning component/team identifier
#   public_status       one of: public-sandbox | public-live | internal |
#                       preview-disabled | not-exposed
#   environments        sandbox: true|false / live: true|false
#                       (live: true requires live_authorization_evidence)
#   authority           protocol | operator-extension | internal
#   authority_ref       ADR/RFC or governance reference
#   implementation      list of repo-relative code locations
#   api_surface         list of public API routes / SDK methods / UI / docs
#                       surfaces ("none" if not exposed)
#   threat_category     financial-money-movement | financial-read |
#                       identity-auth | tenant-data | infrastructure | content
#   tests               unit / integration / e2e_sandbox / negative_security —
#                       lists of test IDs (paths or named suites)
#   deployment_gate     sandbox-e2e-required | integration-required |
#                       static-only | none-docs-only
#   cleanup_disposition active-required | active-needs-remediation |
#                       legacy-compat-justified | obsolete-candidate | removed
#   evidence            list of evidence artifact references
#   status              verified | in-audit | blocked | deprecated | removed
#
# Release rule: Sandbox launch readiness requires zero entries with status
# in-audit or blocked, and zero cleanup_disposition of obsolete-candidate.
# ═══════════════════════════════════════════════════════════════════════════

